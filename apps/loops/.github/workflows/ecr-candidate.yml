name: ECR candidate

on:
  workflow_dispatch:
    inputs:
      source_track:
        description: Permitted source lineage for the exact candidate commit
        required: true
        default: main
        type: choice
        options:
          - main
          - maint/0.4.28
      source_sha:
        description: Full lowercase commit SHA reachable from the selected source lineage
        required: true
        type: string
      confirmation:
        description: Type "push <full-sha>" to authorize this immutable candidate
        required: true
        type: string

concurrency:
  group: ecr-candidate-${{ inputs.source_sha }}
  cancel-in-progress: false

permissions: {}

env:
  SOURCE_TRACK: ${{ inputs.source_track }}
  SOURCE_SHA: ${{ inputs.source_sha }}
  CONFIRMATION: ${{ inputs.confirmation }}
  # The emergency maintenance track is pinned to its reviewed merge. Main
  # intentionally keeps its existing reviewed-ancestor behavior.
  SOURCE_CONTRACTS_JSON: '{"main":{"ref":"refs/heads/main","expectedSha":null,"expectedPackageVersion":null},"maint/0.4.28":{"ref":"refs/heads/maint/0.4.28","expectedSha":"361d351445c256e397dbeb654f112facb7c572ca","expectedPackageVersion":"0.4.28-offsite.1"}}'

jobs:
  build_scan:
    name: Build and scan immutable candidate
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    outputs:
      transfer_artifact_id: ${{ steps.transfer-upload.outputs.artifact-id }}
      transfer_artifact_digest: ${{ steps.transfer-upload.outputs.artifact-digest }}
    permissions:
      contents: read
      id-token: none
    steps:
      - name: Validate dispatch and configuration
        id: preflight
        shell: bash
        run: |
          set -Eeuo pipefail

          if [[ ! "${SOURCE_SHA}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "source_sha must be a full lowercase 40-character commit SHA" >&2
            exit 1
          fi
          if [[ "${CONFIRMATION}" != "push ${SOURCE_SHA}" ]]; then
            echo "confirmation must exactly match: push <full-sha>" >&2
            exit 1
          fi
          if ! source_contract="$(jq -cer --arg source_track "${SOURCE_TRACK}" \
            '.[$source_track] // error("unsupported source_track")' \
            <<<"${SOURCE_CONTRACTS_JSON}")"; then
            echo "source_track is not permitted" >&2
            exit 1
          fi
          if ! source_ref="$(jq -er \
            '.ref | select(type == "string" and test("^refs/heads/[A-Za-z0-9][A-Za-z0-9._/-]*$"))' \
            <<<"${source_contract}")"; then
            echo "source contract has an invalid branch ref" >&2
            exit 1
          fi
          if ! expected_package_version="$(jq -er \
            '.expectedPackageVersion | if . == null then "" elif type == "string" and length > 0 then . else error("invalid expectedPackageVersion") end' \
            <<<"${source_contract}")"; then
            echo "source contract has an invalid expected package version" >&2
            exit 1
          fi
          if ! expected_source_sha="$(jq -er \
            '.expectedSha | if . == null then "" elif type == "string" and test("^[0-9a-f]{40}$") then . else error("invalid expectedSha") end' \
            <<<"${source_contract}")"; then
            echo "source contract has an invalid expected source SHA" >&2
            exit 1
          fi
          source_branch="${source_ref#refs/heads/}"
          source_remote_ref="refs/remotes/origin/${source_branch}"

          short_sha="${SOURCE_SHA:0:12}"
          candidate_tag="candidate-${short_sha}-${SOURCE_SHA}"
          printf 'source_track=%s\n' "${SOURCE_TRACK}" >> "${GITHUB_OUTPUT}"
          printf 'source_ref=%s\n' "${source_ref}" >> "${GITHUB_OUTPUT}"
          printf 'short_sha=%s\n' "${short_sha}" >> "${GITHUB_OUTPUT}"
          printf 'candidate_tag=%s\n' "${candidate_tag}" >> "${GITHUB_OUTPUT}"
          printf 'SAFE_SOURCE_TRACK=%s\n' "${SOURCE_TRACK}" >> "${GITHUB_ENV}"
          printf 'SAFE_SOURCE_REF=%s\n' "${source_ref}" >> "${GITHUB_ENV}"
          printf 'SAFE_SOURCE_REMOTE_REF=%s\n' "${source_remote_ref}" >> "${GITHUB_ENV}"
          printf 'EXPECTED_SOURCE_SHA=%s\n' "${expected_source_sha}" >> "${GITHUB_ENV}"
          printf 'EXPECTED_PACKAGE_VERSION=%s\n' "${expected_package_version}" >> "${GITHUB_ENV}"
          printf 'SAFE_SOURCE_SHA=%s\n' "${SOURCE_SHA}" >> "${GITHUB_ENV}"
          printf 'SHORT_SHA=%s\n' "${short_sha}" >> "${GITHUB_ENV}"
          printf 'CANDIDATE_TAG=%s\n' "${candidate_tag}" >> "${GITHUB_ENV}"

      - name: Checkout requested commit
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify exact commit against permitted source
        shell: bash
        run: |
          set -Eeuo pipefail
          git fetch --no-tags origin "+${SAFE_SOURCE_REF}:${SAFE_SOURCE_REMOTE_REF}"
          actual_sha="$(git rev-parse --verify HEAD^{commit})"
          if [[ "${actual_sha}" != "${SOURCE_SHA}" ]]; then
            echo "checked out commit does not exactly match source_sha" >&2
            exit 1
          fi
          if ! git merge-base --is-ancestor "${SOURCE_SHA}^{commit}" "${SAFE_SOURCE_REMOTE_REF}^{commit}"; then
            echo "source_sha is not reachable from the permitted source ref" >&2
            exit 1
          fi
          if [[ -n "${EXPECTED_SOURCE_SHA}" && "${SOURCE_SHA}" != "${EXPECTED_SOURCE_SHA}" ]]; then
            echo "source_sha does not match the exact approved maintenance merge" >&2
            exit 1
          fi
          verified_package_version=""
          if [[ -n "${EXPECTED_PACKAGE_VERSION}" ]]; then
            if ! package_version="$(jq -er '.version | strings | select(length > 0)' package.json)"; then
              echo "package.json must contain a non-empty string version" >&2
              exit 1
            fi
            if [[ "${package_version}" != "${EXPECTED_PACKAGE_VERSION}" ]]; then
              echo "source package version does not match the selected maintenance contract" >&2
              exit 1
            fi
            verified_package_version="${EXPECTED_PACKAGE_VERSION}"
          fi
          printf 'VERIFIED_PACKAGE_VERSION=%s\n' "${verified_package_version}" >> "${GITHUB_ENV}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build native ARM64 runner image
        shell: bash
        run: |
          set -Eeuo pipefail
          docker buildx build \
            --platform linux/arm64 \
            --file Dockerfile \
            --target runner \
            --load \
            --label "org.opencontainers.image.revision=${SOURCE_SHA}" \
            --label "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" \
            --tag "openloops-candidate:${SOURCE_SHA}" \
            .
          local_image_id="$(docker image inspect --format '{{.Id}}' "openloops-candidate:${SOURCE_SHA}")"
          if [[ ! "${local_image_id}" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "built image did not produce a valid local image id" >&2
            exit 1
          fi
          printf 'LOCAL_IMAGE_ID=%s\n' "${local_image_id}" >> "${GITHUB_ENV}"

      - name: Install verified Trivy CLI
        shell: bash
        env:
          TRIVY_ARCHIVE_SHA256: 2f6bb988b553a1bbac6bdd1ce890f5e412439564e17522b88a4541b4f364fc8d
          TRIVY_BINARY_SHA256: 5bf6066f08c972e0575660eaeb87b4f1bac0e527076dcbf88184bc9baa353f65
        run: |
          set -Eeuo pipefail
          trusted_trivy_root="${RUNNER_TEMP}/openloops-trivy-v0.70.0"
          trusted_trivy_bin="${trusted_trivy_root}/bin"
          trivy_archive="${trusted_trivy_root}/trivy_0.70.0_Linux-ARM64.tar.gz"
          trivy_binary="${trusted_trivy_bin}/trivy"
          mkdir -p "${trusted_trivy_bin}"
          curl \
            --fail \
            --location \
            --proto '=https' \
            --tlsv1.2 \
            --retry 3 \
            --output "${trivy_archive}" \
            https://github.com/aquasecurity/trivy/releases/download/v0.70.0/trivy_0.70.0_Linux-ARM64.tar.gz
          printf '%s  %s\n' "${TRIVY_ARCHIVE_SHA256}" "${trivy_archive}" | sha256sum --check --strict -
          tar \
            --extract \
            --gzip \
            --file "${trivy_archive}" \
            --directory "${trusted_trivy_bin}" \
            --no-same-owner \
            --no-same-permissions \
            trivy
          printf '%s  %s\n' "${TRIVY_BINARY_SHA256}" "${trivy_binary}" | sha256sum --check --strict -
          chmod 0555 "${trivy_binary}"
          "${trivy_binary}" --version
          printf '%s\n' "${trusted_trivy_bin}" >> "${GITHUB_PATH}"

      - name: Prepare trusted Trivy policy
        shell: bash
        run: |
          set -Eeuo pipefail
          trusted_policy_dir="${RUNNER_TEMP}/openloops-trivy-policy"
          rm -f -- trivyignores
          mkdir -p "${trusted_policy_dir}" "${RUNNER_TEMP}/openloops-trivy-cache"
          printf '{}\n' > "${trusted_policy_dir}/trivy.yaml"
          : > "${trusted_policy_dir}/trivy.ignore"
          chmod 0444 "${trusted_policy_dir}/trivy.yaml" "${trusted_policy_dir}/trivy.ignore"

      - name: Generate local vulnerability report
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.70.0
          skip-setup-trivy: true
          image-ref: openloops-candidate:${{ inputs.source_sha }}
          format: json
          output: trivy-local.json
          scanners: vuln
          vuln-type: os,library
          severity: CRITICAL,HIGH
          ignore-unfixed: false
          list-all-pkgs: true
          trivy-config: ${{ runner.temp }}/openloops-trivy-policy/trivy.yaml
          trivyignores: ${{ runner.temp }}/openloops-trivy-policy/trivy.ignore
          cache-dir: ${{ runner.temp }}/openloops-trivy-cache
          cache: false
          exit-code: "0"

      - name: Enforce local vulnerability gate
        id: local-scan
        shell: bash
        run: |
          set -Eeuo pipefail
          if ! jq -e \
            --arg expected_image_tag "openloops-candidate:${SOURCE_SHA}" \
            --arg expected_image_id "${LOCAL_IMAGE_ID}" '
            type == "object"
            and (.SchemaVersion == 2)
            and (.Trivy | type == "object")
            and (.Trivy.Version == "0.70.0")
            and (.ArtifactName == $expected_image_tag)
            and (.ArtifactType == "container_image")
            and (.Metadata | type == "object")
            and (.Metadata.ImageID == $expected_image_id)
            and (.Metadata.Reference == $expected_image_tag)
            and (.Metadata.RepoTags | type == "array" and index($expected_image_tag) != null)
            and (.Metadata.ImageConfig | type == "object")
            and (.Metadata.ImageConfig.architecture == "arm64")
            and (.Metadata.ImageConfig.os == "linux")
            and (.Results | type == "array" and length > 0)
            and any(.Results[]; .Class == "os-pkgs")
            and any(.Results[]; .Class == "lang-pkgs")
            and all(.Results[];
              type == "object"
              and (.Target | type == "string" and length > 0)
              and (.Class == "os-pkgs" or .Class == "lang-pkgs")
              and (.Type | type == "string" and length > 0)
              and (.Packages | type == "array" and length > 0)
              and all(.Packages[];
                type == "object"
                and (.ID | type == "string" and length > 0)
                and (.Name | type == "string" and length > 0)
                and (.Version | type == "string" and length > 0)
                and (.Identifier | type == "object")
                and (.Identifier.PURL | type == "string" and length > 0)
                and (.Identifier.UID | type == "string" and length > 0)
              )
              and (.Vulnerabilities == null or (.Vulnerabilities | type == "array"))
              and all(.Vulnerabilities[]?;
                type == "object" and (.Severity == "CRITICAL" or .Severity == "HIGH")
              )
            )
          ' trivy-local.json >/dev/null; then
            echo "local Trivy report is empty or malformed" >&2
            exit 1
          fi
          critical="$(jq '[.Results[]?.Vulnerabilities[]? | select(.Severity == "CRITICAL")] | length' trivy-local.json)"
          high="$(jq '[.Results[]?.Vulnerabilities[]? | select(.Severity == "HIGH")] | length' trivy-local.json)"
          printf 'critical=%s\n' "${critical}" >> "${GITHUB_OUTPUT}"
          printf 'high=%s\n' "${high}" >> "${GITHUB_OUTPUT}"
          printf 'LOCAL_CRITICAL=%s\n' "${critical}" >> "${GITHUB_ENV}"
          printf 'LOCAL_HIGH=%s\n' "${high}" >> "${GITHUB_ENV}"
          if (( critical > 0 || high > 0 )); then
            echo "local Trivy gate failed: critical=${critical}, high=${high}" >&2
            exit 1
          fi

      - name: Generate CycloneDX SBOM
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.70.0
          skip-setup-trivy: true
          image-ref: openloops-candidate:${{ inputs.source_sha }}
          format: cyclonedx
          output: openloops-candidate.sbom.cdx.json
          scanners: vuln
          vuln-type: os,library
          trivy-config: ${{ runner.temp }}/openloops-trivy-policy/trivy.yaml
          trivyignores: ${{ runner.temp }}/openloops-trivy-policy/trivy.ignore
          cache-dir: ${{ runner.temp }}/openloops-trivy-cache
          cache: false
          exit-code: "0"

      - name: Enforce SBOM identity gate
        shell: bash
        run: |
          set -Eeuo pipefail
          if ! jq -e \
            --arg expected_image_tag "openloops-candidate:${SOURCE_SHA}" \
            --arg expected_image_id "${LOCAL_IMAGE_ID}" '
            type == "object"
            and (.bomFormat == "CycloneDX")
            and (.specVersion == "1.6")
            and (.version == 1)
            and (.metadata | type == "object")
            and (.metadata.component | type == "object")
            and (.metadata.component.type == "container")
            and (.metadata.component.name == $expected_image_tag)
            and (.metadata.component.properties | type == "array")
            and any(.metadata.component.properties[];
              .name == "aquasecurity:trivy:ImageID" and .value == $expected_image_id
            )
            and any(.metadata.component.properties[];
              .name == "aquasecurity:trivy:Reference" and .value == $expected_image_tag
            )
            and any(.metadata.component.properties[];
              .name == "aquasecurity:trivy:RepoTag" and .value == $expected_image_tag
            )
            and any(.metadata.component.properties[];
              .name == "aquasecurity:trivy:SchemaVersion" and .value == "2"
            )
            and (.components | type == "array" and length > 0)
            and any(.components[]; .type == "operating-system")
            and any(.components[]; .type == "library")
            and all(.components[];
              type == "object"
              and (.type == "operating-system" or .type == "library")
              and (.name | type == "string" and length > 0)
              and (.version | type == "string" and length > 0)
              and (if .type == "library" then (.purl | type == "string" and length > 0) else true end)
            )
          ' openloops-candidate.sbom.cdx.json >/dev/null; then
            echo "CycloneDX SBOM is empty, malformed, or bound to a different image" >&2
            exit 1
          fi

      - name: Package scanned image and hash-bound evidence
        shell: bash
        run: |
          set -Eeuo pipefail
          local_image_tag="openloops-candidate:${SOURCE_SHA}"
          inspected_image_id="$(docker image inspect --format '{{.Id}}' "${local_image_tag}")"
          inspected_architecture="$(docker image inspect --format '{{.Architecture}}' "${local_image_tag}")"
          inspected_os="$(docker image inspect --format '{{.Os}}' "${local_image_tag}")"
          inspected_revision="$(docker image inspect --format '{{index .Config.Labels "org.opencontainers.image.revision"}}' "${local_image_tag}")"
          inspected_source="$(docker image inspect --format '{{index .Config.Labels "org.opencontainers.image.source"}}' "${local_image_tag}")"
          if [[ "${inspected_image_id}" != "${LOCAL_IMAGE_ID}" || "${inspected_architecture}" != "arm64" || "${inspected_os}" != "linux" ]]; then
            echo "built image identity or ARM64 platform changed after scanning" >&2
            exit 1
          fi
          if [[ "${inspected_revision}" != "${SOURCE_SHA}" || "${inspected_source}" != "https://github.com/${GITHUB_REPOSITORY}" ]]; then
            echo "built image source labels do not match the verified commit" >&2
            exit 1
          fi

          docker save --output candidate-image.tar "${local_image_tag}"
          image_archive_sha256="$(sha256sum candidate-image.tar | awk '{print $1}')"
          trivy_sha256="$(sha256sum trivy-local.json | awk '{print $1}')"
          sbom_sha256="$(sha256sum openloops-candidate.sbom.cdx.json | awk '{print $1}')"

          jq -n \
            --arg repository "${GITHUB_REPOSITORY}" \
            --arg source_track "${SAFE_SOURCE_TRACK}" \
            --arg source_ref "${SAFE_SOURCE_REF}" \
            --arg source_sha "${SOURCE_SHA}" \
            --arg package_version "${VERIFIED_PACKAGE_VERSION}" \
            --arg image_tag "${local_image_tag}" \
            --arg image_id "${LOCAL_IMAGE_ID}" \
            --arg image_archive_sha256 "${image_archive_sha256}" \
            --arg trivy_sha256 "${trivy_sha256}" \
            --arg sbom_sha256 "${sbom_sha256}" \
            --argjson critical "${LOCAL_CRITICAL}" \
            --argjson high "${LOCAL_HIGH}" '
            {
              schemaVersion: 1,
              repository: $repository,
              sourceTrack: $source_track,
              sourceRef: $source_ref,
              sourceSha: $source_sha,
              packageVersion: (if $package_version == "" then null else $package_version end),
              image: {
                localTag: $image_tag,
                localImageId: $image_id,
                platform: {os: "linux", architecture: "arm64"},
                archivePath: "candidate-image.tar",
                archiveSha256: $image_archive_sha256
              },
              evidence: {
                trivy: {
                  path: "trivy-local.json",
                  sha256: $trivy_sha256,
                  schemaVersion: 2,
                  version: "0.70.0",
                  critical: $critical,
                  high: $high
                },
                sbom: {
                  path: "openloops-candidate.sbom.cdx.json",
                  sha256: $sbom_sha256,
                  format: "CycloneDX",
                  specVersion: "1.6"
                }
              }
            }
          ' > candidate-transfer-manifest.json

          sha256sum \
            candidate-image.tar \
            trivy-local.json \
            openloops-candidate.sbom.cdx.json \
            > candidate-transfer-payload.sha256
          sha256sum \
            candidate-transfer-manifest.json \
            candidate-transfer-payload.sha256 \
            > candidate-transfer-envelope.sha256

      - name: Upload scanned candidate transfer
        id: transfer-upload
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ecr-candidate-transfer-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            candidate-image.tar
            trivy-local.json
            openloops-candidate.sbom.cdx.json
            candidate-transfer-manifest.json
            candidate-transfer-payload.sha256
            candidate-transfer-envelope.sha256
          if-no-files-found: warn
          compression-level: 0
          retention-days: 30

  push_verify:
    name: Verify and push immutable candidate
    needs: build_scan
    runs-on: ubuntu-24.04-arm
    environment: ecr-candidate
    timeout-minutes: 45
    permissions:
      actions: read
      contents: none
      id-token: write
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      AWS_ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}
      ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
    steps:
      - name: Validate scanned transfer artifact reference
        env:
          TRANSFER_ARTIFACT_ID: ${{ needs.build_scan.outputs.transfer_artifact_id }}
          TRANSFER_ARTIFACT_DIGEST: ${{ needs.build_scan.outputs.transfer_artifact_digest }}
        shell: bash
        run: |
          set -Eeuo pipefail
          if [[ ! "${TRANSFER_ARTIFACT_ID}" =~ ^[1-9][0-9]*$ ]]; then
            echo "build job did not provide a valid immutable transfer artifact ID" >&2
            exit 1
          fi
          if [[ ! "${TRANSFER_ARTIFACT_DIGEST}" =~ ^[0-9a-f]{64}$ ]]; then
            echo "build job did not provide a valid transfer artifact digest" >&2
            exit 1
          fi

      - name: Download scanned candidate transfer
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          artifact-ids: ${{ needs.build_scan.outputs.transfer_artifact_id }}
          merge-multiple: true
          path: candidate-transfer

      - name: Validate privileged configuration
        shell: bash
        run: |
          set -Eeuo pipefail

          if [[ ! "${SOURCE_SHA}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "source_sha must be a full lowercase 40-character commit SHA" >&2
            exit 1
          fi
          if [[ "${CONFIRMATION}" != "push ${SOURCE_SHA}" ]]; then
            echo "confirmation must exactly match: push <full-sha>" >&2
            exit 1
          fi
          if [[ -z "${AWS_REGION}" || -z "${AWS_ROLE_ARN}" || -z "${ECR_REPOSITORY}" ]]; then
            echo "AWS_REGION, AWS_ROLE_ARN, and ECR_REPOSITORY repository variables are required" >&2
            exit 1
          fi
          if [[ ! "${AWS_REGION}" =~ ^[a-z]{2}(-gov)?-[a-z]+-[0-9]+$ ]]; then
            echo "AWS_REGION has an invalid format" >&2
            exit 1
          fi
          if [[ ! "${AWS_ROLE_ARN}" =~ ^arn:(aws|aws-us-gov|aws-cn):iam::[0-9]{12}:role/[A-Za-z0-9+=,.@_/-]+$ ]]; then
            echo "AWS_ROLE_ARN has an invalid format" >&2
            exit 1
          fi
          if [[ ! "${ECR_REPOSITORY}" =~ ^[a-z0-9]+([._/-][a-z0-9]+)*$ ]]; then
            echo "ECR_REPOSITORY has an invalid format" >&2
            exit 1
          fi

          if ! source_contract="$(jq -cer --arg source_track "${SOURCE_TRACK}" \
            '.[$source_track] // error("unsupported source_track")' \
            <<<"${SOURCE_CONTRACTS_JSON}")"; then
            echo "source_track is not permitted" >&2
            exit 1
          fi
          if ! source_ref="$(jq -er \
            '.ref | select(type == "string" and test("^refs/heads/[A-Za-z0-9][A-Za-z0-9._/-]*$"))' \
            <<<"${source_contract}")"; then
            echo "source contract has an invalid branch ref" >&2
            exit 1
          fi
          if ! expected_package_version="$(jq -er \
            '.expectedPackageVersion | if . == null then "" elif type == "string" and length > 0 then . else error("invalid expectedPackageVersion") end' \
            <<<"${source_contract}")"; then
            echo "source contract has an invalid expected package version" >&2
            exit 1
          fi
          if ! expected_source_sha="$(jq -er \
            '.expectedSha | if . == null then "" elif type == "string" and test("^[0-9a-f]{40}$") then . else error("invalid expectedSha") end' \
            <<<"${source_contract}")"; then
            echo "source contract has an invalid expected source SHA" >&2
            exit 1
          fi
          if [[ -n "${expected_source_sha}" && "${SOURCE_SHA}" != "${expected_source_sha}" ]]; then
            echo "source_sha does not match the exact approved maintenance merge" >&2
            exit 1
          fi

          short_sha="${SOURCE_SHA:0:12}"
          candidate_tag="candidate-${short_sha}-${SOURCE_SHA}"
          printf 'SAFE_SOURCE_TRACK=%s\n' "${SOURCE_TRACK}" >> "${GITHUB_ENV}"
          printf 'SAFE_SOURCE_REF=%s\n' "${source_ref}" >> "${GITHUB_ENV}"
          printf 'EXPECTED_PACKAGE_VERSION=%s\n' "${expected_package_version}" >> "${GITHUB_ENV}"
          printf 'SAFE_SOURCE_SHA=%s\n' "${SOURCE_SHA}" >> "${GITHUB_ENV}"
          printf 'SHORT_SHA=%s\n' "${short_sha}" >> "${GITHUB_ENV}"
          printf 'CANDIDATE_TAG=%s\n' "${candidate_tag}" >> "${GITHUB_ENV}"

      - name: Verify transferred image, scan, and SBOM evidence
        working-directory: candidate-transfer
        shell: bash
        run: |
          set -Eeuo pipefail
          required_files=(
            candidate-image.tar
            trivy-local.json
            openloops-candidate.sbom.cdx.json
            candidate-transfer-manifest.json
            candidate-transfer-payload.sha256
            candidate-transfer-envelope.sha256
          )
          shopt -s nullglob dotglob
          transfer_entries=(./*)
          shopt -u nullglob dotglob
          if (( ${#transfer_entries[@]} != ${#required_files[@]} )); then
            echo "candidate transfer must contain exactly the expected regular files" >&2
            exit 1
          fi
          for transfer_entry in "${transfer_entries[@]}"; do
            if [[ ! -f "${transfer_entry}" || -L "${transfer_entry}" ]]; then
              echo "candidate transfer must contain exactly the expected regular files" >&2
              exit 1
            fi
          done
          for required_file in "${required_files[@]}"; do
            if [[ ! -f "${required_file}" || -L "${required_file}" ]]; then
              echo "candidate transfer is missing ${required_file}" >&2
              exit 1
            fi
          done

          envelope_line_count="$(awk 'END { print NR }' candidate-transfer-envelope.sha256)"
          payload_line_count="$(awk 'END { print NR }' candidate-transfer-payload.sha256)"
          if (( envelope_line_count != 2 || payload_line_count != 3 )); then
            echo "candidate transfer checksum manifests have an unexpected shape" >&2
            exit 1
          fi
          for checksum_entry in candidate-transfer-manifest.json candidate-transfer-payload.sha256; do
            if [[ "$(awk -v file="${checksum_entry}" '$2 == file && length($1) == 64 && $1 !~ /[^0-9a-f]/ { count++ } END { print count + 0 }' candidate-transfer-envelope.sha256)" != "1" ]]; then
              echo "candidate transfer envelope does not bind ${checksum_entry} exactly once" >&2
              exit 1
            fi
          done
          for checksum_entry in candidate-image.tar trivy-local.json openloops-candidate.sbom.cdx.json; do
            if [[ "$(awk -v file="${checksum_entry}" '$2 == file && length($1) == 64 && $1 !~ /[^0-9a-f]/ { count++ } END { print count + 0 }' candidate-transfer-payload.sha256)" != "1" ]]; then
              echo "candidate transfer payload does not bind ${checksum_entry} exactly once" >&2
              exit 1
            fi
          done
          sha256sum --check --strict candidate-transfer-envelope.sha256
          sha256sum --check --strict candidate-transfer-payload.sha256

          image_archive_sha256="$(sha256sum candidate-image.tar | awk '{print $1}')"
          trivy_sha256="$(sha256sum trivy-local.json | awk '{print $1}')"
          sbom_sha256="$(sha256sum openloops-candidate.sbom.cdx.json | awk '{print $1}')"
          expected_image_tag="openloops-candidate:${SOURCE_SHA}"
          if ! jq -e \
            --arg repository "${GITHUB_REPOSITORY}" \
            --arg source_track "${SAFE_SOURCE_TRACK}" \
            --arg source_ref "${SAFE_SOURCE_REF}" \
            --arg source_sha "${SOURCE_SHA}" \
            --arg package_version "${EXPECTED_PACKAGE_VERSION}" \
            --arg image_tag "${expected_image_tag}" \
            --arg image_archive_sha256 "${image_archive_sha256}" \
            --arg trivy_sha256 "${trivy_sha256}" \
            --arg sbom_sha256 "${sbom_sha256}" '
            type == "object"
            and (.schemaVersion == 1)
            and (.repository == $repository)
            and (.sourceTrack == $source_track)
            and (.sourceRef == $source_ref)
            and (.sourceSha == $source_sha)
            and (.packageVersion == (if $package_version == "" then null else $package_version end))
            and (.image | type == "object")
            and (.image.localTag == $image_tag)
            and (.image.localImageId | type == "string" and test("^sha256:[0-9a-f]{64}$"))
            and (.image.platform == {os: "linux", architecture: "arm64"})
            and (.image.archivePath == "candidate-image.tar")
            and (.image.archiveSha256 == $image_archive_sha256)
            and (.evidence | type == "object")
            and (.evidence.trivy == {
              path: "trivy-local.json",
              sha256: $trivy_sha256,
              schemaVersion: 2,
              version: "0.70.0",
              critical: 0,
              high: 0
            })
            and (.evidence.sbom == {
              path: "openloops-candidate.sbom.cdx.json",
              sha256: $sbom_sha256,
              format: "CycloneDX",
              specVersion: "1.6"
            })
          ' candidate-transfer-manifest.json >/dev/null; then
            echo "candidate transfer manifest does not match this dispatch or its checksums" >&2
            exit 1
          fi
          transferred_image_id="$(jq -er '.image.localImageId' candidate-transfer-manifest.json)"

          if ! jq -e \
            --arg expected_image_tag "${expected_image_tag}" \
            --arg expected_image_id "${transferred_image_id}" '
            type == "object"
            and (.SchemaVersion == 2)
            and (.Trivy | type == "object")
            and (.Trivy.Version == "0.70.0")
            and (.ArtifactName == $expected_image_tag)
            and (.ArtifactType == "container_image")
            and (.Metadata | type == "object")
            and (.Metadata.ImageID == $expected_image_id)
            and (.Metadata.Reference == $expected_image_tag)
            and (.Metadata.RepoTags | type == "array" and index($expected_image_tag) != null)
            and (.Metadata.ImageConfig | type == "object")
            and (.Metadata.ImageConfig.architecture == "arm64")
            and (.Metadata.ImageConfig.os == "linux")
            and (.Results | type == "array" and length > 0)
            and any(.Results[]; .Class == "os-pkgs")
            and any(.Results[]; .Class == "lang-pkgs")
            and all(.Results[];
              type == "object"
              and (.Target | type == "string" and length > 0)
              and (.Class == "os-pkgs" or .Class == "lang-pkgs")
              and (.Type | type == "string" and length > 0)
              and (.Packages | type == "array" and length > 0)
              and all(.Packages[];
                type == "object"
                and (.ID | type == "string" and length > 0)
                and (.Name | type == "string" and length > 0)
                and (.Version | type == "string" and length > 0)
                and (.Identifier | type == "object")
                and (.Identifier.PURL | type == "string" and length > 0)
                and (.Identifier.UID | type == "string" and length > 0)
              )
              and (.Vulnerabilities == null or (.Vulnerabilities | type == "array"))
              and all(.Vulnerabilities[]?;
                type == "object" and (.Severity == "CRITICAL" or .Severity == "HIGH")
              )
            )
          ' trivy-local.json >/dev/null; then
            echo "transferred Trivy evidence is malformed or bound to a different image" >&2
            exit 1
          fi
          critical="$(jq '[.Results[]?.Vulnerabilities[]? | select(.Severity == "CRITICAL")] | length' trivy-local.json)"
          high="$(jq '[.Results[]?.Vulnerabilities[]? | select(.Severity == "HIGH")] | length' trivy-local.json)"
          if (( critical > 0 || high > 0 )); then
            echo "transferred Trivy evidence contains critical/high findings" >&2
            exit 1
          fi

          if ! jq -e \
            --arg expected_image_tag "${expected_image_tag}" \
            --arg expected_image_id "${transferred_image_id}" '
            type == "object"
            and (.bomFormat == "CycloneDX")
            and (.specVersion == "1.6")
            and (.version == 1)
            and (.metadata | type == "object")
            and (.metadata.component | type == "object")
            and (.metadata.component.type == "container")
            and (.metadata.component.name == $expected_image_tag)
            and (.metadata.component.properties | type == "array")
            and any(.metadata.component.properties[];
              .name == "aquasecurity:trivy:ImageID" and .value == $expected_image_id
            )
            and any(.metadata.component.properties[];
              .name == "aquasecurity:trivy:Reference" and .value == $expected_image_tag
            )
            and any(.metadata.component.properties[];
              .name == "aquasecurity:trivy:RepoTag" and .value == $expected_image_tag
            )
            and any(.metadata.component.properties[];
              .name == "aquasecurity:trivy:SchemaVersion" and .value == "2"
            )
            and (.components | type == "array" and length > 0)
            and any(.components[]; .type == "operating-system")
            and any(.components[]; .type == "library")
            and all(.components[];
              type == "object"
              and (.type == "operating-system" or .type == "library")
              and (.name | type == "string" and length > 0)
              and (.version | type == "string" and length > 0)
              and (if .type == "library" then (.purl | type == "string" and length > 0) else true end)
            )
          ' openloops-candidate.sbom.cdx.json >/dev/null; then
            echo "transferred CycloneDX SBOM is malformed or bound to a different image" >&2
            exit 1
          fi

          docker load --input candidate-image.tar
          loaded_image_id="$(docker image inspect --format '{{.Id}}' "${expected_image_tag}")"
          loaded_architecture="$(docker image inspect --format '{{.Architecture}}' "${expected_image_tag}")"
          loaded_os="$(docker image inspect --format '{{.Os}}' "${expected_image_tag}")"
          loaded_revision="$(docker image inspect --format '{{index .Config.Labels "org.opencontainers.image.revision"}}' "${expected_image_tag}")"
          loaded_source="$(docker image inspect --format '{{index .Config.Labels "org.opencontainers.image.source"}}' "${expected_image_tag}")"
          if [[ "${loaded_image_id}" != "${transferred_image_id}" || "${loaded_architecture}" != "arm64" || "${loaded_os}" != "linux" ]]; then
            echo "transferred image identity does not match scanned evidence" >&2
            exit 1
          fi
          if [[ "${loaded_revision}" != "${SOURCE_SHA}" || "${loaded_source}" != "https://github.com/${GITHUB_REPOSITORY}" ]]; then
            echo "transferred image source labels do not match this dispatch" >&2
            exit 1
          fi

          verified_package_version="$(jq -r '.packageVersion // ""' candidate-transfer-manifest.json)"
          printf 'LOCAL_IMAGE_ID=%s\n' "${loaded_image_id}" >> "${GITHUB_ENV}"
          printf 'IMAGE_ARCHIVE_SHA256=%s\n' "${image_archive_sha256}" >> "${GITHUB_ENV}"
          printf 'TRIVY_SHA256=%s\n' "${trivy_sha256}" >> "${GITHUB_ENV}"
          printf 'SBOM_SHA256=%s\n' "${sbom_sha256}" >> "${GITHUB_ENV}"
          printf 'VERIFIED_PACKAGE_VERSION=%s\n' "${verified_package_version}" >> "${GITHUB_ENV}"
          printf 'LOCAL_CRITICAL=%s\n' "${critical}" >> "${GITHUB_ENV}"
          printf 'LOCAL_HIGH=%s\n' "${high}" >> "${GITHUB_ENV}"

      - name: Configure AWS credentials with OIDC
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          aws-region: ${{ vars.AWS_REGION }}
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          role-session-name: openloops-ecr-${{ github.run_id }}
          role-duration-seconds: 1800
          mask-aws-account-id: true
          unset-current-credentials: true

      - name: Verify immutable scan-on-push repository
        shell: bash
        run: |
          set -Eeuo pipefail
          repository="$(aws ecr describe-repositories \
            --repository-names "${ECR_REPOSITORY}" \
            --query 'repositories[0].{mutability:imageTagMutability,scanOnPush:imageScanningConfiguration.scanOnPush}' \
            --output json)"
          if [[ "$(jq -r '.mutability' <<<"${repository}")" != "IMMUTABLE" ]]; then
            echo "ECR repository must enforce IMMUTABLE tags" >&2
            exit 1
          fi
          if [[ "$(jq -r '.scanOnPush' <<<"${repository}")" != "true" ]]; then
            echo "ECR repository must enable scan-on-push" >&2
            exit 1
          fi
          existing_response="$(aws ecr batch-get-image \
            --repository-name "${ECR_REPOSITORY}" \
            --image-ids imageTag="${CANDIDATE_TAG}" \
            --query '{digests: images[].imageId.imageDigest,failures: failures[].failureCode}' \
            --output json)"
          if ! existing_remote_digest="$(jq -er '
            if type != "object"
              or (.digests | type) != "array"
              or (.failures | type) != "array" then
              error("malformed batch-get-image response")
            elif (.digests | length) == 0
              and ((.failures | length) == 0
                or ((.failures | length) == 1 and .failures[0] == "ImageNotFound")) then
              ""
            elif (.digests | length) == 1
              and (.failures | length) == 0
              and (.digests[0] | type == "string" and test("^sha256:[0-9a-f]{64}$")) then
              .digests[0]
            else
              error("candidate tag returned multiple or malformed digests")
            end
          ' <<<"${existing_response}")"; then
            echo "ECR returned malformed existing candidate metadata" >&2
            exit 1
          fi
          printf 'EXISTING_REMOTE_DIGEST=%s\n' "${existing_remote_digest}" >> "${GITHUB_ENV}"

      - name: Log in to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@d539f0932e70871a027e9d5a9d8fc38589180a64 # v2
        with:
          mask-password: true

      - name: Push or resume scanned immutable candidate
        id: push
        env:
          ECR_REGISTRY: ${{ steps.ecr-login.outputs.registry }}
        shell: bash
        run: |
          set -Eeuo pipefail
          image_uri="${ECR_REGISTRY}/${ECR_REPOSITORY}:${CANDIDATE_TAG}"
          remote_digest=""
          if [[ -n "${EXISTING_REMOTE_DIGEST}" ]]; then
            if [[ ! "${EXISTING_REMOTE_DIGEST}" =~ ^sha256:[0-9a-f]{64}$ ]]; then
              echo "existing candidate digest is malformed" >&2
              exit 1
            fi
            remote_ref="${ECR_REGISTRY}/${ECR_REPOSITORY}@${EXISTING_REMOTE_DIGEST}"
            docker pull "${remote_ref}"
            resumed_image_id="$(docker image inspect --format '{{.Id}}' "${remote_ref}")"
            if [[ "${resumed_image_id}" != "${LOCAL_IMAGE_ID}" ]]; then
              echo "existing candidate tag is bound to a different image; refusing mutation" >&2
              exit 1
            fi
            remote_digest="${EXISTING_REMOTE_DIGEST}"
            echo "resuming verification for the exact existing immutable candidate"
          else
            docker tag "openloops-candidate:${SOURCE_SHA}" "${image_uri}"
            docker push "${image_uri}"

            for attempt in {1..12}; do
              remote_digest="$(aws ecr describe-images \
                --repository-name "${ECR_REPOSITORY}" \
                --image-ids imageTag="${CANDIDATE_TAG}" \
                --query 'imageDetails[0].imageDigest' \
                --output text 2>/dev/null || true)"
              if [[ "${remote_digest}" =~ ^sha256:[0-9a-f]{64}$ ]]; then
                break
              fi
              sleep 5
            done
          fi
          if [[ ! "${remote_digest}" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "ECR did not return a valid digest" >&2
            exit 1
          fi
          printf 'digest=%s\n' "${remote_digest}" >> "${GITHUB_OUTPUT}"
          printf 'IMAGE_URI=%s\n' "${image_uri}" >> "${GITHUB_ENV}"
          printf 'REMOTE_DIGEST=%s\n' "${remote_digest}" >> "${GITHUB_ENV}"

      - name: Wait for ECR vulnerability scan
        id: ecr-scan
        shell: bash
        run: |
          set -Eeuo pipefail
          max_attempts=60
          retry_interval_seconds=15
          scan_complete=false
          scan_error_file="${RUNNER_TEMP}/ecr-scan-error.txt"
          findings=""

          for (( attempt=1; attempt<=max_attempts; attempt++ )); do
            scan_response=""
            if ! scan_response="$(aws ecr describe-image-scan-findings \
              --repository-name "${ECR_REPOSITORY}" \
              --image-id imageDigest="${REMOTE_DIGEST}" \
              --query '{status: imageScanStatus.status, counts: imageScanFindings.findingSeverityCounts}' \
              --output json 2>"${scan_error_file}")"; then
              scan_error="$(<"${scan_error_file}")"
              if [[ "${scan_error}" == *"ScanNotFoundException"* ]]; then
                echo "ECR scan is not registered yet (attempt ${attempt}/${max_attempts})" >&2
                if (( attempt < max_attempts )); then
                  sleep "${retry_interval_seconds}"
                fi
                continue
              fi
              echo "nontransient ECR scan query failed" >&2
              exit 1
            fi

            if ! scan_status="$(jq -er '.status | strings | select(length > 0)' <<<"${scan_response}")"; then
              echo "ECR returned an empty or malformed scan status" >&2
              exit 1
            fi

            case "${scan_status}" in
              "COMPLETE")
                if ! findings="$(jq -ce '.counts | if type == "object" then . else error("missing or malformed finding counts") end' <<<"${scan_response}")"; then
                  echo "ECR returned empty or malformed finding counts" >&2
                  exit 1
                fi
                scan_complete=true
                break
                ;;
              "IN_PROGRESS")
                echo "ECR scan is still in progress (attempt ${attempt}/${max_attempts})" >&2
                ;;
              *)
                echo "ECR scan entered terminal status: ${scan_status}" >&2
                exit 1
                ;;
            esac

            if (( attempt < max_attempts )); then
              sleep "${retry_interval_seconds}"
            fi
          done
          rm -f "${scan_error_file}"

          if [[ "${scan_complete}" != "true" ]]; then
            echo "ECR scan did not complete after ${max_attempts} attempts" >&2
            exit 1
          fi

          if ! critical="$(jq -er '(if has("CRITICAL") then .CRITICAL else 0 end) | if type == "number" and . >= 0 and floor == . then . else error("malformed CRITICAL count") end' <<<"${findings}")"; then
            echo "ECR returned a malformed CRITICAL finding count" >&2
            exit 1
          fi
          if ! high="$(jq -er '(if has("HIGH") then .HIGH else 0 end) | if type == "number" and . >= 0 and floor == . then . else error("malformed HIGH count") end' <<<"${findings}")"; then
            echo "ECR returned a malformed HIGH finding count" >&2
            exit 1
          fi
          jq -n \
            --argjson critical "${critical}" \
            --argjson high "${high}" \
            '{critical: $critical, high: $high}' > ecr-scan-counts.json
          printf 'critical=%s\n' "${critical}" >> "${GITHUB_OUTPUT}"
          printf 'high=%s\n' "${high}" >> "${GITHUB_OUTPUT}"
          printf 'ECR_CRITICAL=%s\n' "${critical}" >> "${GITHUB_ENV}"
          printf 'ECR_HIGH=%s\n' "${high}" >> "${GITHUB_ENV}"
          if (( critical > 0 || high > 0 )); then
            echo "ECR scan gate failed: critical=${critical}, high=${high}" >&2
            exit 1
          fi

      - name: Generate source provenance statement
        shell: bash
        run: |
          set -Eeuo pipefail
          jq -n \
            --arg repository "${GITHUB_REPOSITORY}" \
            --arg source_track "${SAFE_SOURCE_TRACK}" \
            --arg source_ref "${SAFE_SOURCE_REF}" \
            --arg source_sha "${SOURCE_SHA}" \
            --arg package_version "${VERIFIED_PACKAGE_VERSION}" \
            --arg image_uri "${IMAGE_URI}" \
            --arg digest "${REMOTE_DIGEST#sha256:}" \
            --arg run_id "${GITHUB_RUN_ID}" \
            --arg run_attempt "${GITHUB_RUN_ATTEMPT}" \
            '{
              "_type": "https://in-toto.io/Statement/v1",
              subject: [{name: $image_uri, digest: {sha256: $digest}}],
              predicateType: "https://slsa.dev/provenance/v1",
              predicate: {
                buildDefinition: {
                  buildType: "https://github.com/hasna/loops/.github/workflows/ecr-candidate.yml",
                  externalParameters: {
                    sourceTrack: $source_track,
                    sourceRef: $source_ref,
                    sourceSha: $source_sha,
                    packageVersion: (if $package_version == "" then null else $package_version end),
                    dockerfile: "Dockerfile",
                    target: "runner",
                    platform: "linux/arm64"
                  },
                  internalParameters: {},
                  resolvedDependencies: [{
                    uri: ("git+https://github.com/" + $repository + "@" + $source_sha),
                    digest: {gitCommit: $source_sha}
                  }]
                },
                runDetails: {
                  builder: {id: ("https://github.com/" + $repository + "/actions/runs/" + $run_id)},
                  metadata: {invocationId: ($run_id + ":" + $run_attempt)}
                }
              }
            }' > openloops-candidate.provenance.json

      - name: Upload candidate evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ecr-candidate-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            candidate-transfer/trivy-local.json
            candidate-transfer/openloops-candidate.sbom.cdx.json
            candidate-transfer/candidate-transfer-manifest.json
            candidate-transfer/candidate-transfer-payload.sha256
            candidate-transfer/candidate-transfer-envelope.sha256
            openloops-candidate.provenance.json
            ecr-scan-counts.json
          if-no-files-found: warn
          retention-days: 30

      - name: Publish candidate summary
        if: ${{ always() }}
        shell: bash
        run: |
          set -Eeuo pipefail
          {
            echo "## Loops ECR candidate"
            echo
            echo "- source track: \`${SAFE_SOURCE_TRACK:-invalid}\`"
            echo "- permitted source ref: \`${SAFE_SOURCE_REF:-invalid}\`"
            echo "- source SHA: \`${SAFE_SOURCE_SHA:-invalid}\`"
            echo "- package version contract: \`${VERIFIED_PACKAGE_VERSION:-not-enforced}\`"
            echo "- immutable tag: \`${CANDIDATE_TAG:-not-created}\`"
            echo "- digest: \`${REMOTE_DIGEST:-not-pushed}\`"
            echo "- local Trivy critical/high: \`${LOCAL_CRITICAL:-not-run}/${LOCAL_HIGH:-not-run}\`"
            echo "- ECR critical/high: \`${ECR_CRITICAL:-not-run}/${ECR_HIGH:-not-run}\`"
            echo "- ECS/latest mutation: \`none\`"
          } >> "${GITHUB_STEP_SUMMARY}"
