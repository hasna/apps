# Local development stack for the @hasna/loops self-hosted service.
# HASNA_LOOPS_STORAGE_MODE=self_hosted is the service deployment contract.
#   docker compose run --rm loops-migrate   # apply schema first
#   docker compose up --build loops-serve
services:
  postgres:
    image: postgres:16-alpine@sha256:57c72fd2a128e416c7fcc499958864df5301e940bca0a56f58fddf30ffc07777
    environment:
      POSTGRES_USER: loops_bootstrap
      POSTGRES_PASSWORD: loops-bootstrap
      POSTGRES_DB: loops
    volumes:
      - ./docker/postgres-init.sql:/docker-entrypoint-initdb.d/10-open-loops-roles.sql:ro
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U loops_bootstrap"]
      interval: 5s
      timeout: 3s
      retries: 10

  loops-migrate:
    build: .
    command:
      - sh
      - -lc
      - >-
        bun dist/serve/index.js migrate &&
        bun dist/serve/index.js tenant-backfill --input /app/empty-tenant-backfill.json &&
        bun dist/serve/index.js migrate --enforce-tenancy
    environment:
      HASNA_LOOPS_STORAGE_MODE: self_hosted
      HASNA_LOOPS_MIGRATOR_DATABASE_URL: postgres://loops_bootstrap:loops-bootstrap@postgres:5432/loops?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy

  loops-serve:
    build: .
    ports:
      - "8787:8787"
    environment:
      PORT: "8787"
      HOST: 0.0.0.0
      HASNA_LOOPS_STORAGE_MODE: self_hosted
      HASNA_LOOPS_DATABASE_URL: postgres://loops_runtime:loops-runtime@postgres:5432/loops?sslmode=disable
      HASNA_LOOPS_AUTH_DATABASE_URL: postgres://loops_authenticator:loops-authenticator@postgres:5432/loops?sslmode=disable
      HASNA_LOOPS_API_SIGNING_KEY: dev-signing-secret-change-me
    depends_on:
      postgres:
        condition: service_healthy
      loops-migrate:
        condition: service_completed_successfully
