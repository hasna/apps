services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: consolidations
      POSTGRES_USER: consolidations
      POSTGRES_PASSWORD_FILE: /run/secrets/pg_password
    secrets: [pg_password]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U consolidations"]
      interval: 5s
      retries: 10
  serve:
    image: oven/bun:1
    # Invoke the serve bin directly. `bunx --package` selects the correct bin;
    # a bare `bunx @hasna/consolidations consolidations-serve` would run the CLI.
    command: ["bunx", "--package", "@hasna/consolidations", "consolidations-serve"]
    environment:
      HASNA_CONSOLIDATIONS_STORAGE_MODE: cloud
      HASNA_CONSOLIDATIONS_DATABASE_URL_FILE: /run/secrets/database_url
      HASNA_CONSOLIDATIONS_PORT: "3488"
      HASNA_CONSOLIDATIONS_BIND_HOST: "0.0.0.0"
      HASNA_CONSOLIDATIONS_API_CREDENTIALS: ${API_CREDENTIALS:-}
      HASNA_CONSOLIDATIONS_CORS_ORIGINS: ${CORS_ORIGINS:-}
    secrets: [database_url]
    depends_on: { db: { condition: service_healthy } }
    ports: ["3488:3488"]
  mcp:
    image: oven/bun:1
    # --package selects the MCP bin; a bare `bunx @hasna/consolidations consolidations-mcp` would run
    # the CLI and treat "consolidations-mcp" as a bogus argument. (BUILD-SPEC §6.4)
    command: ["bunx", "--package", "@hasna/consolidations", "consolidations-mcp", "--http", "--port", "8892"]
    environment:
      HASNA_CONSOLIDATIONS_STORAGE_MODE: cloud
      HASNA_CONSOLIDATIONS_DATABASE_URL_FILE: /run/secrets/database_url
      MCP_HTTP: "1"
      MCP_HTTP_PORT: "8892"
      # Bind 0.0.0.0 so the published 8892 is reachable; the default loopback
      # bind is invisible to Docker port forwarding. A non-loopback bind forces auth
      # ON and is asserted fail-closed at startup (assertMcpServeSafety), satisfied
      # here by wiring API_CREDENTIALS. Never publish this port without credentials.
      HASNA_CONSOLIDATIONS_MCP_BIND_HOST: "0.0.0.0"
      HASNA_CONSOLIDATIONS_API_CREDENTIALS: ${CONSOLIDATIONS_API_CREDENTIALS:-}
    secrets: [database_url]
    depends_on: { db: { condition: service_healthy } }
    ports: ["8892:8892"]
secrets:
  pg_password:
    file: ./secrets/pg_password
  database_url:
    file: ./secrets/database_url # postgres://consolidations:<pw>@db:5432/consolidations?sslmode=verify-full
volumes: { pgdata: {} }
