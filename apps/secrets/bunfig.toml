# Bun configuration for @hasna/secrets.
#
# The preload runs once per `bun test` process, before any test file, and strips the
# hosted-vault selectors that a Hasna fleet machine exports into every shell. Without
# it, `getStore()` resolves the PRODUCTION vault inside a test run — which is how this
# repo's own fixtures were written into secrets.hasna.xyz four times (HC-00304).
#
# Removing this preload does not re-open that path: src/test-isolation.ts throws on
# any non-loopback vault target from a test process regardless. What removing it does
# is turn a working suite into a loudly failing one.

[test]
preload = ["./tests/setup/isolate-vault.ts"]
