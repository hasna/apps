<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Secrets Vault</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div id="app">
    <header>
      <span class="logo">🔐 Secrets Vault</span>
      <button id="options-btn" title="Settings">⚙</button>
    </header>

    <div id="status-bar"></div>

    <div class="search-wrap">
      <input id="search" type="text" placeholder="Search secrets…" spellcheck="false" autocomplete="off">
    </div>

    <div id="matches-section" class="section hidden">
      <div class="section-title">This page</div>
      <div id="matches-list"></div>
    </div>

    <div id="results-section" class="section">
      <div class="section-title">All secrets</div>
      <div id="results-list"></div>
    </div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
