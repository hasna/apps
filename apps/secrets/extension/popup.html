<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Secrets Vault</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div id="app">
    <header>
      <div>
        <div class="product">Secrets</div>
        <div id="page-host" class="host">No active page</div>
      </div>
      <button id="options-btn" class="icon-btn" title="Settings" aria-label="Settings">...</button>
    </header>

    <div id="status-bar"></div>

    <div class="search-wrap">
      <input id="search" type="text" placeholder="Search vault items and legacy secrets" spellcheck="false" autocomplete="off">
    </div>

    <nav class="tabs" aria-label="Vault sections">
      <button class="tab active" data-tab="page" type="button">Page</button>
      <button class="tab" data-tab="items" type="button">Items</button>
      <button class="tab" data-tab="legacy" type="button">Legacy</button>
    </nav>

    <main>
      <section id="page-panel" class="panel active">
        <div id="matches-list" class="list"></div>
      </section>

      <section id="items-panel" class="panel">
        <div class="filters">
          <button class="filter active" data-kind="" type="button">All</button>
          <button class="filter" data-kind="login" type="button">Logins</button>
          <button class="filter" data-kind="address" type="button">Addresses</button>
          <button class="filter" data-kind="payment_card" type="button">Cards</button>
        </div>
        <div id="items-list" class="list"></div>
      </section>

      <section id="legacy-panel" class="panel">
        <div id="legacy-list" class="list"></div>
      </section>
    </main>
  </div>
  <script src="popup.js"></script>
</body>
</html>
