# @hasna/secrets — local development stack.
#
# A throwaway Postgres for exercising cloud mode (PURE REMOTE, Amendment A1)
# against a local database instead of the shared RDS. Point secrets-serve at it:
#
#   export HASNA_SECRETS_STORAGE_MODE=cloud
#   export HASNA_SECRETS_DATABASE_URL=postgres://secrets:secrets@localhost:5432/secrets
#   export HASNA_SECRETS_API_SIGNING_KEY=$(openssl rand -hex 32)
#   export HASNA_SECRETS_MASTER_KEY=$(openssl rand -base64 32)
#   secrets db migrate && secrets-serve
#
# Never commit real credentials; the values below are local-only throwaways.
services:
  postgres:
    image: postgres:16
    container_name: hasna-secrets-postgres
    environment:
      POSTGRES_USER: secrets
      POSTGRES_PASSWORD: secrets
      POSTGRES_DB: secrets
    ports:
      - "5432:5432"
    volumes:
      - secrets-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U secrets -d secrets"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  secrets-pgdata:
