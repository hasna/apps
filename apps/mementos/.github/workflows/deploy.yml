# =============================================================================
# mementos production deploy pipeline (migration-gated, additive)
#
# Before building, proves the current stable service already runs through the
# migration-gated command. That is the executable handoff from the one-time
# tenancy R1 prerequisite: a healthy `mementos-deploy` task cannot exist unless
# migrations 36/37 were already present and the guarded 38..40 gate passed.
# The same preflight is repeated immediately before ECS mutation.
#
# Builds a NATIVE arm64 image on a GitHub arm64 runner, pushes it to ECR,
# resolves that commit tag to an immutable digest, rolls the mementos-prod ECS
# service, and asserts the rollout completed on that digest and task def.
# Verifies health and readiness after steady state. A failed public endpoint
# restores the exact pre-deploy task definition, waits for stability, proves
# that revision is the sole stable PRIMARY, and only then fails the job.
#
# The deploy role deliberately has no ecs:RunTask permission, so the canonical
# standalone migration task is unavailable here. Instead every NEW service task
# starts through `mementos-deploy`: it serializes and applies the package-owned
# PostgreSQL migrations with the owner DSN, reads back both migration ledgers,
# the guarded receipt/binding tables, and their immutable triggers, then switches
# to the least-privilege app DSN before starting the server. A failed gate exits
# before readiness, so the ECS circuit breaker retains the previous revision.
#
# Rollback: the workflow resolves and records the service's current task
# definition before registering a replacement. The deployment circuit breaker
# handles an unhealthy ECS rollout; package-owned verification explicitly
# restores that recorded revision when public readiness rejects a stable rollout.
# =============================================================================
name: deploy

on:
  push:
    branches: [main]
    paths: ["apps/mementos/**"] # monorepo adaptation: deploy only on mementos changes
  workflow_dispatch: {}

# Serialize production deploys; never cancel an in-flight rollout.
concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write # required to mint the GitHub OIDC token

jobs:
  deploy:
    name: build + migrate + verify + deploy
    runs-on: ubuntu-24.04-arm # native arm64 runner — image built without QEMU
    environment: production # NOTE (monorepo port): OIDC subject is now repo:hasna/apps:environment:production; verify the mementos-prod-gha-deploy role trust policy and account are current before enabling this workflow
    timeout-minutes: 45

    env:
      AWS_REGION: us-east-1
      AWS_ACCOUNT_ID: "${{ secrets.MEMENTOS_PROD_AWS_ACCOUNT_ID }}"
      CLUSTER: oss-fleet-prod
      SERVICE: mementos-prod
      WEB_FAMILY: mementos-prod
      WEB_CONTAINER: mementos
      ECR_REPOSITORY: mementos
      ECR_URL: "${{ secrets.MEMENTOS_PROD_AWS_ACCOUNT_ID }}.dkr.ecr.us-east-1.amazonaws.com/mementos"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials (GitHub OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ env.AWS_ACCOUNT_ID }}:role/${{ secrets.MEMENTOS_PROD_GHA_ROLE }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: gha-deploy-mementos-${{ github.run_id }}

      - name: Preflight automated deploy eligibility
        run: bash scripts/production-deploy.sh preflight

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push native arm64 image
        run: |
          set -euo pipefail
          IMAGE="${ECR_URL}:${GITHUB_SHA}"
          docker buildx build \
            --platform linux/arm64 \
            --provenance=false \
            --cache-from "type=gha" \
            --cache-to "type=gha,mode=max" \
            --tag "${IMAGE}" \
            --push \
            .

      - name: Deploy service (new revision) and wait for stable
        id: deploy
        env:
          CANDIDATE_SHA: ${{ github.sha }}
        run: bash scripts/production-deploy.sh deploy

      - name: Verify health and migration readiness endpoints
        env:
          APP_BASE_URL: ${{ vars.MEMENTOS_PROD_APP_BASE_URL }}
          PREVIOUS_TASK_DEFINITION: ${{ steps.deploy.outputs.previous_task_definition }}
          DEPLOYED_TASK_DEFINITION: ${{ steps.deploy.outputs.deployed_task_definition }}
        run: bash scripts/production-deploy.sh verify
