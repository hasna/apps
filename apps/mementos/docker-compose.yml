# =============================================================================
# Local stack for @hasna/mementos.
#   Postgres (server postgresql backend) + the mementos-serve API.
# The server backend is selected by HASNA_MEMENTOS_DATABASE_URL; for a remote
# database, point that variable at the real DSN and drop the `db` service.
# =============================================================================
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: mementos_owner
      POSTGRES_PASSWORD: mementos_local
      POSTGRES_DB: mementos
    ports:
      - "5432:5432"
    volumes:
      - mementos_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mementos_owner -d mementos"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      HASNA_MEMENTOS_DATABASE_URL: "postgres://mementos_owner:mementos_local@db:5432/mementos"
    command: ["mementos", "storage", "migrate"]

  serve:
    build: .
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      HASNA_MEMENTOS_DATABASE_URL: "postgres://mementos_owner:mementos_local@db:5432/mementos"
      API_KEY_SIGNING_SECRET: "${API_KEY_SIGNING_SECRET:-local-dev-signing-secret}"
      # REQUIRED: the origin/host allowlist for state-changing requests. The
      # default is http://localhost:19428, which would refuse 403 every request
      # to this stack (clients here send Host: localhost:8080). The cloud
      # deployment (hasna-app Terraform module env) must set
      # MEMENTOS_CORS_ORIGIN to its own public origin for the same reason.
      MEMENTOS_CORS_ORIGIN: "${MEMENTOS_CORS_ORIGIN:-http://localhost:8080}"
      PORT: "8080"
    ports:
      - "8080:8080"

volumes:
  mementos_pgdata:
