# =============================================================================
# Local docker-compose for @hasna/domains — the domains-serve HTTP API backed by
# a local Postgres. Mirrors the cloud (Amendment A1 pure-remote) shape so you
# can exercise the service without RDS.
#
#   docker compose up --build
#   # then: curl localhost:8080/health
#
# Set HASNA_DOMAINS_API_SIGNING_KEY before running (openssl rand -hex 32).
# =============================================================================

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: domains
      POSTGRES_PASSWORD: domains
      POSTGRES_DB: domains
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U domains -d domains"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - domains_pgdata:/var/lib/postgresql/data

  migrate:
    build: .
    command: ["bun", "dist/cli/index.js", "db", "migrate"]
    environment:
      HASNA_DOMAINS_STORAGE_MODE: cloud
      HASNA_DOMAINS_DATABASE_URL_OWNER: postgresql://domains:domains@postgres:5432/domains
      NODE_EXTRA_CA_CERTS: ""
    depends_on:
      postgres:
        condition: service_healthy

  serve:
    build: .
    command: ["bun", "dist/server/index.js"]
    environment:
      PORT: "8080"
      HOST: 0.0.0.0
      HASNA_DOMAINS_STORAGE_MODE: cloud
      HASNA_DOMAINS_DATABASE_URL: postgresql://domains:domains@postgres:5432/domains
      HASNA_DOMAINS_API_SIGNING_KEY: ${HASNA_DOMAINS_API_SIGNING_KEY:-dev-only-signing-secret-change-me}
      NODE_EXTRA_CA_CERTS: ""
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

volumes:
  domains_pgdata:
