name: Attested container candidate

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact lowercase commit SHA currently at refs/heads/main
        required: true
        type: string

concurrency:
  group: attested-container-candidate-${{ inputs.source_sha }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write
  attestations: write

env:
  SOURCE_SHA: ${{ inputs.source_sha }}
  OCI_ARCHIVE: todos-candidate.oci.tar
  OCI_LAYOUT: todos-candidate.oci-layout
  MACHINE_MANIFEST: todos-candidate.manifest.json
  SCAN_REPORT: todos-candidate.trivy.json
  PRODUCT_PROJECTION_RECORD: todos-candidate.product-projection.json
  INTENT_SNAPSHOT_RECORD: todos-candidate.intent-snapshot.json
  SOURCE_CANDIDATE_RECORD: todos-candidate.verified-source-candidate.json
  ATTESTATION_RECORD: todos-candidate.artifact-attestation.json
  BUILD_ARTIFACT_RECORD: todos-candidate.build-artifact.json
  ATTESTATION_BUNDLE: todos-candidate.slsa-bundle.jsonl

jobs:
  build-attest-verify:
    name: Build, attest, and verify without push
    if: github.repository == 'hasna/todos'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    steps:
      - name: Validate exact source input
        shell: bash
        run: |
          set -Eeuo pipefail
          if [[ ! "${SOURCE_SHA}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "source_sha must be a full lowercase commit SHA" >&2
            exit 1
          fi

      - name: Checkout exact source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Require the exact current main commit
        shell: bash
        run: |
          set -Eeuo pipefail
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          test "$(git rev-parse HEAD)" = "${SOURCE_SHA}"
          test "$(git rev-parse refs/remotes/origin/main)" = "${SOURCE_SHA}"
          printf 'SOURCE_TREE_SHA=%s\n' "$(git rev-parse "${SOURCE_SHA}^{tree}")" >> "${GITHUB_ENV}"

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.14"

      - name: Install frozen dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: No-cloud release guards
        run: bun run test:no-cloud

      - name: Test
        run: bun test --retry=2

      - name: Build
        run: bun run build

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build Linux ARM64 OCI archive without push
        shell: bash
        run: |
          set -Eeuo pipefail
          docker buildx build \
            --platform linux/arm64 \
            --file Dockerfile \
            --target runner \
            --label "org.opencontainers.image.revision=${SOURCE_SHA}" \
            --label "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" \
            --provenance=false \
            --output type=oci,dest="${OCI_ARCHIVE}" \
            .
          mkdir "${OCI_LAYOUT}"
          tar -xf "${OCI_ARCHIVE}" -C "${OCI_LAYOUT}"
          test -f "${OCI_LAYOUT}/oci-layout"
          test -f "${OCI_LAYOUT}/index.json"

      - name: Scan the local OCI archive
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          input: ${{ env.OCI_ARCHIVE }}
          format: json
          output: ${{ env.SCAN_REPORT }}
          scanners: vuln
          vuln-type: os,library
          severity: CRITICAL,HIGH
          ignore-unfixed: false
          exit-code: "0"

      - name: Generate the exact-main candidate manifest
        shell: bash
        run: |
          set -Eeuo pipefail
          created_at="$(date -u +'%Y-%m-%dT%H:%M:%S.000Z')"
          expires_at="$(date -u -d "${created_at} +7 days" +'%Y-%m-%dT%H:%M:%S.000Z')"
          bun run scripts/attested-container-candidate.ts manifest \
            --oci-layout "${OCI_LAYOUT}" \
            --oci-archive "${OCI_ARCHIVE}" \
            --trivy-report "${SCAN_REPORT}" \
            --output "${MACHINE_MANIFEST}" \
            --repository "${GITHUB_REPOSITORY}" \
            --source-sha "${SOURCE_SHA}" \
            --tree-sha "${SOURCE_TREE_SHA}" \
            --run-id "${GITHUB_RUN_ID}" \
            --run-attempt "${GITHUB_RUN_ATTEMPT}" \
            --created-at "${created_at}" \
            --expires-at "${expires_at}"

      - name: Prepare exact subject checksums
        shell: bash
        run: |
          set -Eeuo pipefail
          archive_sha="$(sha256sum "${OCI_ARCHIVE}" | cut -d ' ' -f 1)"
          manifest_sha="$(sha256sum "${MACHINE_MANIFEST}" | cut -d ' ' -f 1)"
          report_sha="$(sha256sum "${SCAN_REPORT}" | cut -d ' ' -f 1)"
          oci_digest="$(jq -er '.artifact.ociManifestDigest' "${MACHINE_MANIFEST}")"
          {
            printf '%s  %s\n' "${archive_sha}" "${OCI_ARCHIVE}"
            printf '%s  oci://hasna/todos@sha256:%s\n' "${oci_digest}" "${oci_digest}"
            printf '%s  %s\n' "${manifest_sha}" "${MACHINE_MANIFEST}"
            printf '%s  %s\n' "${report_sha}" "${SCAN_REPORT}"
          } > todos-candidate.subject-checksums.txt

      - name: Create GitHub OIDC keyless provenance
        id: provenance
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-checksums: todos-candidate.subject-checksums.txt
          push-to-registry: false
          show-summary: true

      - name: Verify signed archive and reject a tampered archive
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          cp "${{ steps.provenance.outputs.bundle-path }}" "${ATTESTATION_BUNDLE}"
          gh attestation verify "${OCI_ARCHIVE}" \
            --repo "${GITHUB_REPOSITORY}" \
            --bundle "${ATTESTATION_BUNDLE}" \
            --format json > "${RUNNER_TEMP}/positive-verification.json"
          cp "${OCI_ARCHIVE}" "${RUNNER_TEMP}/tampered.oci.tar"
          printf '\n' >> "${RUNNER_TEMP}/tampered.oci.tar"
          set +e
          gh attestation verify "${RUNNER_TEMP}/tampered.oci.tar" \
            --repo "${GITHUB_REPOSITORY}" \
            --bundle "${ATTESTATION_BUNDLE}" \
            --format json > "${RUNNER_TEMP}/tampered-verification.stdout" \
            2> "${RUNNER_TEMP}/tampered-verification.stderr"
          tampered_rc=$?
          set -e
          if [ "${tampered_rc}" -eq 0 ]; then
            echo "tampered archive unexpectedly verified" >&2
            exit 1
          fi
          archive_sha="$(sha256sum "${OCI_ARCHIVE}" | cut -d ' ' -f 1)"
          jq -n \
            --arg repository "${GITHUB_REPOSITORY}" \
            --arg archive_sha256 "${archive_sha}" \
            --argjson positive_exit_code 0 \
            --argjson tampered_exit_code "${tampered_rc}" \
            '{
              verifier: "gh attestation verify",
              repository: $repository,
              subject: "todos-candidate.oci.tar",
              subjectSha256: $archive_sha256,
              oidcIssuer: "https://token.actions.githubusercontent.com",
              positiveExitCode: $positive_exit_code,
              tamperedExitCode: $tampered_exit_code
            }' > todos-candidate.signature-verification.json

      - name: Emit and validate the Hasna artifact attestation
        shell: bash
        run: |
          set -Eeuo pipefail
          bun run scripts/attested-container-candidate.ts finalize \
            --manifest "${MACHINE_MANIFEST}" \
            --bundle "${ATTESTATION_BUNDLE}" \
            --verification todos-candidate.signature-verification.json \
            --product-output "${PRODUCT_PROJECTION_RECORD}" \
            --intent-output "${INTENT_SNAPSHOT_RECORD}" \
            --source-output "${SOURCE_CANDIDATE_RECORD}" \
            --artifact-output "${BUILD_ARTIFACT_RECORD}" \
            --attestation-id "${{ steps.provenance.outputs.attestation-id }}" \
            --attestation-url "${{ steps.provenance.outputs.attestation-url }}" \
            --created-at "$(date -u +'%Y-%m-%dT%H:%M:%S.000Z')" \
            --output "${ATTESTATION_RECORD}"
          bun run scripts/attested-container-candidate.ts verify \
            --manifest "${MACHINE_MANIFEST}" \
            --product "${PRODUCT_PROJECTION_RECORD}" \
            --intent "${INTENT_SNAPSHOT_RECORD}" \
            --source "${SOURCE_CANDIDATE_RECORD}" \
            --artifact "${BUILD_ARTIFACT_RECORD}" \
            --attestation "${ATTESTATION_RECORD}" \
            --bundle "${ATTESTATION_BUNDLE}"

      - name: Upload the finite no-push candidate and evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: attested-container-candidate-${{ github.run_id }}
          path: |
            todos-candidate.oci.tar
            todos-candidate.manifest.json
            todos-candidate.trivy.json
            todos-candidate.subject-checksums.txt
            todos-candidate.slsa-bundle.jsonl
            todos-candidate.signature-verification.json
            todos-candidate.product-projection.json
            todos-candidate.intent-snapshot.json
            todos-candidate.verified-source-candidate.json
            todos-candidate.build-artifact.json
            todos-candidate.artifact-attestation.json
          if-no-files-found: error
          retention-days: 7
