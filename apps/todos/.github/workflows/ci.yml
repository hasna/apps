name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install AI companion dependencies
        working-directory: ai
        run: bun install --frozen-lockfile

      - name: Type check
        run: bun run typecheck

      - name: Type check AI companion
        working-directory: ai
        run: bun run typecheck

      - name: No-cloud release guards
        run: bun run test:no-cloud

      - name: Run tests
        # The suite shells out to the real CLI in hundreds of subprocess tests
        # that each open a SQLite/WAL handle. Under parallel load a transient
        # SQLITE_BUSY / SQLITE_BUSY_SNAPSHOT ("database is locked") or a slow
        # cold-start can fail a random single test that passes on re-run. Retry
        # transient failures so genuine (deterministic) failures still surface.
        run: bun test --retry=2

      - name: Test AI companion
        working-directory: ai
        run: bun test

      - name: Build
        run: bun run build

      - name: Build AI companion
        working-directory: ai
        run: bun run build

  secret-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      # Pinned by version AND verified by checksum from the release's
      # gitleaks_<version>_checksums.txt. Bump both together.
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history so the pushed/PR commit range is resolvable locally.
          fetch-depth: 0
          persist-credentials: false

      - name: Install pinned gitleaks
        shell: bash
        run: |
          set -euo pipefail
          url="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          mkdir -p "${RUNNER_TEMP}/gitleaks-bin"
          curl --fail --silent --show-error --location --retry 3 --retry-delay 2 \
            --output "${RUNNER_TEMP}/gitleaks.tar.gz" "${url}"
          echo "${GITLEAKS_SHA256}  ${RUNNER_TEMP}/gitleaks.tar.gz" | sha256sum --check --strict -
          tar -xzf "${RUNNER_TEMP}/gitleaks.tar.gz" -C "${RUNNER_TEMP}/gitleaks-bin" gitleaks
          chmod +x "${RUNNER_TEMP}/gitleaks-bin/gitleaks"
          echo "${RUNNER_TEMP}/gitleaks-bin" >> "${GITHUB_PATH}"

      - name: Resolve commit range
        id: range
        shell: bash
        # Event data is passed through the environment (never interpolated into
        # the script body) so it cannot be interpreted as shell.
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.event.after }}
        run: |
          set -euo pipefail
          null_sha="0000000000000000000000000000000000000000"
          log_opts=""
          if [ "${EVENT_NAME}" = "pull_request" ]; then
            log_opts="--no-merges ${PR_BASE_SHA}..${PR_HEAD_SHA}"
          elif [ -n "${PUSH_BEFORE:-}" ] \
            && [ "${PUSH_BEFORE}" != "${null_sha}" ] \
            && git cat-file -e "${PUSH_BEFORE}^{commit}" 2>/dev/null; then
            log_opts="${PUSH_BEFORE}..${PUSH_AFTER}"
          fi
          # An empty value means "no resolvable range" (new branch, force push
          # to an unreachable commit, ...) and falls back to full history.
          printf 'log_opts=%s\n' "${log_opts}" >> "${GITHUB_OUTPUT}"
          if [ -n "${log_opts}" ]; then
            echo "Scanning range: ${log_opts}"
          else
            echo "No resolvable range; scanning full history."
          fi

      - name: Scan commits for secrets
        shell: bash
        env:
          GITLEAKS_LOG_OPTS: ${{ steps.range.outputs.log_opts }}
        run: |
          set -euo pipefail
          # --redact keeps any detected value out of the public workflow log.
          if [ -n "${GITLEAKS_LOG_OPTS}" ]; then
            gitleaks git --log-opts "${GITLEAKS_LOG_OPTS}" \
              --redact --no-banner --platform github --exit-code 1 .
          else
            gitleaks git --redact --no-banner --platform github --exit-code 1 .
          fi
