name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: capacity-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  secret-scan:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install pinned gitleaks
        env:
          GITLEAKS_VERSION: "8.30.1"
          GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/gitleaks.tar.gz"
          install_dir="$RUNNER_TEMP/gitleaks"
          mkdir -p "$install_dir"
          curl --fail --silent --show-error --location \
            --proto '=https' --tlsv1.2 \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            --output "$archive"
          echo "${GITLEAKS_SHA256}  ${archive}" | sha256sum --check --strict
          tar -xzf "$archive" -C "$install_dir" gitleaks
          echo "$install_dir" >> "$GITHUB_PATH"

      - name: Scan event commit range
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BASE_SHA: ${{ github.event.before }}
          PUSH_HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            BASE_SHA="$PR_BASE_SHA"
            HEAD_SHA="$PR_HEAD_SHA"
          elif [[ "$EVENT_NAME" == "push" ]]; then
            BASE_SHA="$PUSH_BASE_SHA"
            HEAD_SHA="$PUSH_HEAD_SHA"
          else
            exit 1
          fi
          [[ "$BASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]
          git cat-file -e "${HEAD_SHA}^{commit}"
          if [[ "$BASE_SHA" == "0000000000000000000000000000000000000000" ]]; then
            LOG_OPTS="$HEAD_SHA"
          else
            git cat-file -e "${BASE_SHA}^{commit}"
            LOG_OPTS="${BASE_SHA}..${HEAD_SHA}"
          fi
          printf '%s\n' '[extend]' 'useDefault = true' > "$RUNNER_TEMP/gitleaks.toml"
          : > "$RUNNER_TEMP/gitleaksignore"
          gitleaks git --redact=100 --no-banner --ignore-gitleaks-allow \
            --config="$RUNNER_TEMP/gitleaks.toml" \
            --gitleaks-ignore-path="$RUNNER_TEMP/gitleaksignore" \
            --log-opts="$LOG_OPTS" .

  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine@sha256:af194ccf3e2d7fe367012c7b88ce8b816c5c889b18a5b316799a1f0d7eac746a
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: capacity_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d capacity_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Install content-verified Bun
        env:
          BUN_VERSION: "1.3.14"
          BUN_ARCHIVE_SHA256: "951ee2aee855f08595aeec6225226a298d3fea83a3dcd6465c09cbccdf7e848f"
          BUN_BINARY_SHA256: "9fd36f87e4b90b07632b987a2e4ec81ca15a62c81bf983190cea6d715be2ad74"
        run: |
          set -euo pipefail
          [[ "$(uname -m)" == "x86_64" ]]
          archive="$RUNNER_TEMP/bun.zip"
          install_dir="$RUNNER_TEMP/bun"
          mkdir -p "$install_dir"
          curl --fail --silent --show-error --location \
            --proto '=https' --tlsv1.2 \
            "https://github.com/oven-sh/bun/releases/download/bun-v${BUN_VERSION}/bun-linux-x64.zip" \
            --output "$archive"
          echo "${BUN_ARCHIVE_SHA256}  ${archive}" | sha256sum --check --strict
          unzip -q "$archive" -d "$install_dir"
          echo "${BUN_BINARY_SHA256}  ${install_dir}/bun-linux-x64/bun" | sha256sum --check --strict
          echo "$install_dir/bun-linux-x64" >> "$GITHUB_PATH"

      - name: Record toolchain versions
        run: |
          bun --version
          npm --version
          tar --version | head -n 1

      - name: Verify lockfile release-age contract
        run: bun .github/scripts/verify-lock-release-age.ts

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Type check
        run: bun run typecheck

      - name: Run tests
        env:
          ACCOUNTS_TEST_POSTGRES_URL: postgresql://postgres:postgres@127.0.0.1:5432/capacity_test?sslmode=disable
        run: bun test

      - name: Clean build
        run: |
          rm -rf dist
          bun run build

      - name: Clean package contract
        run: |
          rm -rf dist
          bun run test:package

      - name: Dependency audit
        run: bun audit
