# =============================================================================
# open-testers — local docker compose for the cloud (Postgres) service.
# Runs Postgres + testers-serve in cloud mode, applies migrations, then serves.
# For production the image is deployed to ECS via the hasna-app Terraform module.
# =============================================================================
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: testers
      POSTGRES_PASSWORD: testers
      POSTGRES_DB: testers
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U testers"]
      interval: 5s
      timeout: 3s
      retries: 10

  migrate:
    build: .
    command: ["testers", "db", "migrate"]
    environment:
      HASNA_TESTERS_STORAGE_MODE: cloud
      HASNA_TESTERS_DATABASE_URL: postgresql://testers:testers@db:5432/testers
    depends_on:
      db:
        condition: service_healthy

  serve:
    build: .
    command: ["testers-serve"]
    environment:
      PORT: "8080"
      HASNA_TESTERS_STORAGE_MODE: cloud
      HASNA_TESTERS_DATABASE_URL: postgresql://testers:testers@db:5432/testers
      HASNA_TESTERS_API_SIGNING_KEY: ${HASNA_TESTERS_API_SIGNING_KEY:-dev-signing-secret-change-me}
    ports:
      - "8080:8080"
    depends_on:
      migrate:
        condition: service_completed_successfully
