# =============================================================================
# testers — local docker compose for the Postgres-backed service.
# Runs Postgres + testers-serve (DATABASE_URL selects Postgres), applies
# migrations, then serves. For production the image is deployed to ECS via the
# hasna-app Terraform module.
# =============================================================================
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: testers
      POSTGRES_PASSWORD: testers
      POSTGRES_DB: testers
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U testers"]
      interval: 5s
      timeout: 3s
      retries: 10

  migrate:
    build: .
    command: ["testers", "db", "migrate"]
    environment:
      HASNA_TESTERS_DATABASE_URL: postgresql://testers:testers@db:5432/testers
    depends_on:
      db:
        condition: service_healthy

  serve:
    build: .
    command: ["testers-serve"]
    environment:
      PORT: "8080"
      # The server binds loopback by default; the container must accept the
      # published port, and the legacy /api/* auth gate (active because the
      # DATABASE_URL + signing key are set) is the protection on this surface.
      TESTERS_HOST: "0.0.0.0"
      HASNA_TESTERS_DATABASE_URL: postgresql://testers:testers@db:5432/testers
      # The signing key is the master key of the whole API-key system (the
      # /api/* gate authenticates by symmetric HMAC with it), so it must NEVER
      # have a committed or defaulted value. The required form fails `docker
      # compose up` fast when the operator did not supply the key, which also
      # restores the server's own fail-closed guard for any other deploy path.
      HASNA_TESTERS_API_SIGNING_KEY: ${HASNA_TESTERS_API_SIGNING_KEY:?set HASNA_TESTERS_API_SIGNING_KEY for this deployment}
    ports:
      - "8080:8080"
    depends_on:
      migrate:
        condition: service_completed_successfully
