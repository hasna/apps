<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>@hasna/browser</title>
    <style>
      body {
        width: 320px;
        margin: 0;
        font: 13px/1.4 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color: #111827;
        background: #ffffff;
      }
      main {
        padding: 14px;
      }
      h1 {
        margin: 0 0 12px;
        font-size: 16px;
        font-weight: 650;
      }
      label {
        display: block;
        margin: 10px 0 4px;
        font-weight: 600;
      }
      input {
        box-sizing: border-box;
        width: 100%;
        border: 1px solid #cbd5e1;
        border-radius: 6px;
        padding: 8px 9px;
        font: inherit;
      }
      button {
        border: 0;
        border-radius: 6px;
        padding: 8px 10px;
        font: inherit;
        font-weight: 650;
        cursor: pointer;
      }
      .primary {
        width: 100%;
        margin-top: 12px;
        color: #ffffff;
        background: #166534;
      }
      .secondary {
        margin-top: 8px;
        color: #374151;
        background: #e5e7eb;
      }
      .status {
        margin: 10px 0 0;
        padding: 8px;
        border-radius: 6px;
        background: #f3f4f6;
        color: #374151;
        word-break: break-word;
      }
      .status[data-state="connected"] {
        background: #dcfce7;
        color: #14532d;
      }
      .status[data-state="error"] {
        background: #fee2e2;
        color: #7f1d1d;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>@hasna/browser Bridge</h1>
      <label for="server-url">Server</label>
      <input id="server-url" value="ws://127.0.0.1:7030" autocomplete="off" />
      <label for="pair-code">Pair code</label>
      <input id="pair-code" inputmode="numeric" maxlength="6" autocomplete="one-time-code" />
      <button id="pair" class="primary">Pair</button>
      <button id="unpair" class="secondary">Unpair</button>
      <div id="status" class="status" data-state="idle">Idle</div>
    </main>
    <script type="module" src="./popup.ts"></script>
  </body>
</html>
