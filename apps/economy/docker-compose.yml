# Local development stack for @hasna/economy in cloud (PURE REMOTE) mode.
#   docker compose run --rm economy-migrate   # apply schema first
#   docker compose up --build economy-serve
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: economy
      POSTGRES_PASSWORD: economy
      POSTGRES_DB: economy
    ports:
      - "5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U economy"]
      interval: 5s
      timeout: 3s
      retries: 10

  economy-migrate:
    build: .
    command: ["bun", "dist/server/index.js", "migrate"]
    environment:
      HASNA_ECONOMY_STORAGE_MODE: cloud
      HASNA_ECONOMY_DATABASE_URL: postgres://economy:economy@postgres:5432/economy?sslmode=disable
      HASNA_ECONOMY_API_SIGNING_KEY: dev-signing-secret-change-me
    depends_on:
      postgres:
        condition: service_healthy

  economy-serve:
    build: .
    ports:
      - "8787:8787"
    environment:
      ECONOMY_PORT: "8787"
      ECONOMY_HOST: 0.0.0.0
      HASNA_ECONOMY_STORAGE_MODE: cloud
      HASNA_ECONOMY_DATABASE_URL: postgres://economy:economy@postgres:5432/economy?sslmode=disable
      HASNA_ECONOMY_API_SIGNING_KEY: dev-signing-secret-change-me
    depends_on:
      postgres:
        condition: service_healthy
      economy-migrate:
        condition: service_completed_successfully
