name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun test
      - run: bun run build
      # The release gate lives in prepack, so nothing but a real pack exercises
      # it. Both packers run it, and a gate that exits non-zero here would
      # otherwise only surface at `npm publish`.
      - name: Packed-artifact release gate (npm pack)
        run: npm pack --dry-run
      - name: Packed-artifact release gate (bun pm pack)
        run: bun pm pack --dry-run
      - run: bun install
        working-directory: dashboard
      - run: bun run build
        working-directory: dashboard
