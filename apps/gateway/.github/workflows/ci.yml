name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      # Build before test: tests/no-cloud-boundary.test.ts inspects dist and skips that
      # assertion when no build is present.
      - run: bun run build
      - run: bun test
