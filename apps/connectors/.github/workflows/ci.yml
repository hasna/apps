name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Install dashboard dependencies
        run: cd dashboard && bun install

      - name: Typecheck
        run: bun run typecheck

      # Build BEFORE Test: the MCP/CLI/server test suites spawn the compiled
      # entrypoints (bin/mcp.js, bin/index.js) which are gitignored and only
      # produced by `bun run build`. Running tests first (the previous order)
      # made every spawned-binary test fail on a fresh checkout.
      - name: Build
        run: bun run build

      - name: Test
        run: bun test

      # Last, deliberately: this guard scans the union of tracked files and the
      # files `npm pack` would ship. Everything untracked-but-shipped — `dist/`,
      # `bin/`, `dashboard/dist/`, per-connector lockfiles, the `.test-home/`
      # install-cache blobs `bun test` creates — only exists once install, build
      # and test have run. Running it earlier (the previous order) reduced it to
      # a tracked-only scan that could not see the artifacts it exists to catch.
      - name: Package-manager secret guard
        run: bun run check:package-secrets
