# nginx configuration for connect-zendesk
# Location: /etc/nginx/sites-available/connect-zendesk
#
# To enable:
#   sudo ln -s /etc/nginx/sites-available/connect-zendesk /etc/nginx/sites-enabled/
#   sudo nginx -t
#   sudo systemctl reload nginx

# Upstream server
upstream connect_zendesk {
    server 127.0.0.1:21010;
    keepalive 32;
}

