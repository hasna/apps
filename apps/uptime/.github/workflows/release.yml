# Trusted-publishing release workflow for `@hasna/uptime`.
#
# `--provenance` lives here rather than in `publishConfig` on purpose. npm only
# generates a provenance attestation from a supported CI provider, and refuses
# to publish at all ("Automatic provenance generation not supported for
# provider") when `publishConfig.provenance` is set anywhere else — which would
# break every maintainer's local publish, including patch releases.
#
# The publish is gated: `prepublishOnly` runs the OSS release gate, then the
# build, typecheck, and test suite, before anything is uploaded. The gate scans
# the complete Git history and, for a `GO` decision, also runs Gitleaks, so this
# workflow checks out the full history and installs Gitleaks first.
name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

# id-token: write is what lets npm mint the provenance attestation.
permissions:
  contents: read
  id-token: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish @hasna/uptime
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: "8.30.1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # The release gate scans the complete Git history for credentials.
          fetch-depth: 0

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Install Gitleaks
        shell: bash
        run: |
          set -euo pipefail
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" -o /tmp/gitleaks.tar.gz
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          sudo install /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Fail before touching npm if the release is not approved and clean. The
      # gate reads repository visibility with `gh`, which exits 4 without a
      # token, so every step that runs it is given the job's GITHUB_TOKEN.
      - name: Verify the recorded OSS release decision
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bun run release:oss:audit

      # `npm publish` runs prepublishOnly: release gate, build, typecheck, tests.
      - name: Publish to npm with provenance
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --provenance --access public

      # The provenance attestation only exists once the publish has minted it, so
      # the pre-publish gate cannot assert it. This step does, after the fact.
      - name: Verify the published provenance attestation
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bun run release:oss:verify
