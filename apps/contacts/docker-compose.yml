# Local development stack for @hasna/contacts in cloud (PURE REMOTE) mode.
#   docker compose run --rm contacts-migrate     # apply schema first
#   docker compose up --build contacts-serve
# Auth: mint a key with `contracts issue-key --app contacts --scopes 'contacts:*'`
# using the SAME HASNA_CONTACTS_API_SIGNING_KEY and HASNA_CONTACTS_DATABASE_URL.
# NOTE: seed ONLY synthetic data — never load real PII into any database.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: contacts
      POSTGRES_PASSWORD: contacts
      POSTGRES_DB: contacts
    ports:
      - "5435:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U contacts"]
      interval: 5s
      timeout: 3s
      retries: 10

  contacts-migrate:
    build: .
    command: ["bun", "dist/server/index.js", "migrate"]
    environment:
      HASNA_CONTACTS_STORAGE_MODE: cloud
      HASNA_CONTACTS_DATABASE_URL: postgres://contacts:contacts@postgres:5432/contacts?sslmode=disable
      HASNA_CONTACTS_API_SIGNING_KEY: dev-signing-secret-change-me
    depends_on:
      postgres:
        condition: service_healthy

  contacts-serve:
    build: .
    ports:
      - "19428:19428"
    environment:
      PORT: "19428"
      HOST: 0.0.0.0
      CONTACTS_HOST: 0.0.0.0
      CONTACTS_NO_OPEN: "true"
      HASNA_CONTACTS_STORAGE_MODE: cloud
      HASNA_CONTACTS_DATABASE_URL: postgres://contacts:contacts@postgres:5432/contacts?sslmode=disable
      HASNA_CONTACTS_API_SIGNING_KEY: dev-signing-secret-change-me
    depends_on:
      contacts-migrate:
        condition: service_completed_successfully
