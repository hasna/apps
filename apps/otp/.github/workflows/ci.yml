name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check (typecheck, test, build)
        run: bun run check

      # Runs prepack end to end, so a broken release hook fails here instead of
      # at publish time.
      - name: Pack dry-run (exercises prepack)
        run: npm pack --dry-run
