<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="color-scheme" content="light dark" />
  <title>Hasna Conversations</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="app" class="app">
    <!-- Purple liquid-glass sidebar -->
    <aside class="sidebar scroller" id="sidebar">
      <div class="sidebar-top" id="sidebarTop">
        <div class="ws-badge" aria-hidden="true">H</div>
        <div class="ws-name">Hasna&nbsp;Conversations</div>
      </div>

      <nav class="pages" id="pages" aria-label="Pages">
        <!-- top pages injected here -->
      </nav>

      <section class="sb-section" id="channelsSection">
        <button class="sb-section-head" data-section="channels" aria-expanded="true">
          <span class="chev" aria-hidden="true">▾</span>
          <span class="sb-section-title">Channels</span>
          <span class="sb-add" id="addChannelBtn" title="Create channel" data-no-drag>＋</span>
        </button>
        <div class="sb-list" id="channelList"></div>
      </section>

      <section class="sb-section" id="dmSection">
        <button class="sb-section-head" data-section="dms" aria-expanded="true">
          <span class="chev" aria-hidden="true">▾</span>
          <span class="sb-section-title">Direct Messages</span>
          <span class="sb-add" id="addDmBtn" title="New message" data-no-drag>＋</span>
        </button>
        <div class="sb-list" id="dmList"></div>
      </section>

      <div class="sb-footer">
        <div class="me-chip" id="meChip" title="You">
          <span class="avatar" id="meAvatar">?</span>
          <span class="me-name" id="meName">you</span>
        </div>
        <button class="icon-btn" id="themeToggle" title="Toggle appearance" data-no-drag aria-label="Toggle appearance">◐</button>
      </div>
    </aside>

    <!-- White canvas -->
    <main class="canvas" id="canvas">
      <header class="content-header" id="contentHeader">
        <div class="ch-title-wrap">
          <h1 class="ch-title" id="chTitle">Hasna Conversations</h1>
          <div class="ch-topic" id="chTopic"></div>
        </div>
        <div class="ch-actions" id="chActions" data-no-drag></div>
      </header>

      <div class="messages scroller" id="messages" aria-live="polite">
        <div class="empty-state" id="emptyState">
          <div class="empty-glyph" aria-hidden="true">✳︎</div>
          <div class="empty-text">Pick a channel or direct message to start.</div>
        </div>
      </div>

      <footer class="composer-wrap" id="composerWrap" hidden>
        <form class="composer" id="composer" data-no-drag>
          <textarea id="composerInput" class="composer-input" rows="1"
            placeholder="Message" autocomplete="off"></textarea>
          <button type="submit" class="send-btn" id="sendBtn" title="Send" aria-label="Send">↑</button>
        </form>
      </footer>
    </main>
  </div>

  <div class="toast-host" id="toastHost" aria-live="assertive"></div>
  <script src="app.js"></script>
</body>
</html>
