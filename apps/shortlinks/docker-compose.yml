# Local end-to-end stack for shortlinks-serve: Postgres + the service.
# PURE REMOTE parity — the service reads/writes Postgres directly.
#
#   docker compose up --build
#   curl localhost:8080/health
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: shortlinks
      POSTGRES_PASSWORD: shortlinks
      POSTGRES_DB: shortlinks
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shortlinks"]
      interval: 5s
      timeout: 3s
      retries: 10

  shortlinks-serve:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PORT: "8080"
      HASNA_SHORTLINKS_STORAGE_MODE: cloud
      HASNA_SHORTLINKS_DATABASE_URL: postgres://shortlinks:shortlinks@postgres:5432/shortlinks
      HASNA_SHORTLINKS_API_SIGNING_KEY: local-dev-signing-secret-change-me
      SHORTLINKS_VERSION: local
    ports:
      - "8080:8080"
