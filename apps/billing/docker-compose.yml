services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: billing
      POSTGRES_USER: billing
      POSTGRES_PASSWORD_FILE: /run/secrets/pg_password
    secrets: [pg_password]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U billing"]
      interval: 5s
      retries: 10
  serve:
    image: oven/bun:1
    # invoke the serve bin directly via --package (a bare `bunx @hasna/billing
    # billing-serve` would run the CLI and treat "billing-serve" as an arg).
    command: ["bunx", "--package", "@hasna/billing", "billing-serve"]
    environment:
      HASNA_BILLING_STORAGE_MODE: cloud
      HASNA_BILLING_DATABASE_URL_FILE: /run/secrets/database_url
      HASNA_BILLING_PORT: "3487"
      HASNA_BILLING_BIND_HOST: "0.0.0.0"
      HASNA_BILLING_CORS_ORIGINS: ${CORS_ORIGINS:-}
      HASNA_BILLING_API_CREDENTIALS: ${BILLING_API_CREDENTIALS:-}
    secrets: [database_url]
    depends_on: { db: { condition: service_healthy } }
    ports: ["3487:3487"]
  mcp:
    image: oven/bun:1
    # --package selects the MCP bin; a bare `bunx @hasna/billing billing-mcp` would
    # run the CLI and treat "billing-mcp" as a bogus argument. (BUILD-SPEC §6.4)
    command: ["bunx", "--package", "@hasna/billing", "billing-mcp", "--http", "--port", "8891"]
    environment:
      HASNA_BILLING_STORAGE_MODE: cloud
      HASNA_BILLING_DATABASE_URL_FILE: /run/secrets/database_url
      MCP_HTTP: "1"
      MCP_HTTP_PORT: "8891"
      # Bind 0.0.0.0 so the published port is reachable; the default loopback bind
      # is invisible to Docker port forwarding. A non-loopback bind forces auth ON
      # and is asserted fail-closed at startup (assertMcpServeSafety), satisfied
      # here by wiring API_CREDENTIALS. Never publish this port without credentials.
      HASNA_BILLING_MCP_BIND_HOST: "0.0.0.0"
      HASNA_BILLING_API_CREDENTIALS: ${BILLING_API_CREDENTIALS:-}
    secrets: [database_url]
    depends_on: { db: { condition: service_healthy } }
    ports: ["8891:8891"]
secrets:
  pg_password:
    file: ./secrets/pg_password
  database_url:
    file: ./secrets/database_url # postgres://billing:<pw>@db:5432/billing?sslmode=verify-full
volumes: { pgdata: {} }
