# hasna station template v1 — reclaim tuning.
# Fixes the direct-reclaim livelock that panicked station01 on Jul 16 + Jul 28 2026:
# vm.swappiness=1 (vendor 99-dgx-spark.conf) forced reclaim to strip page cache
# (executables/mmapped text) before cold anon, producing the
# filemap_fault->readahead->alloc->direct-reclaim storm seen in both panic traces.
# Filename MUST keep the 99-zz- prefix: a plain 99-*.conf fix LOSES lexicographic
# ordering to the vendor's 99-dgx-spark.conf. The template check enforces this.
vm.swappiness = 60
vm.min_free_kbytes = 1048576
vm.watermark_scale_factor = 150
kernel.panic = 10
