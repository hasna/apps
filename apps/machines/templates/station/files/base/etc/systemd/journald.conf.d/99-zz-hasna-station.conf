# hasna station: bound the persistent journal.
# station17 build 2 (2026-07-29) died of disk exhaustion — journald itself
# logged "Failed to create new system journal: No space left on device" — and
# with no explicit cap journald defaults to min(10% of the filesystem, 4G):
# "max 4.0G" measured in both boxes' journald startup lines, 2026-07-30. A
# bound nobody chose. 2G is two orders of magnitude above measured usage
# (16M on station17/18, 2026-07-30); SystemKeepFree mirrors the template's
# disk.minFreeGb=8 floor so journald stops growing before the drift-checked
# free-space floor is breached.
[Journal]
SystemMaxUse=2G
SystemKeepFree=8G
