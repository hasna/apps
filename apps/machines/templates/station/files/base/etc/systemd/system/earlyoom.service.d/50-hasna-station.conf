# hasna station template v1 — earlyoom backstop.
# The userspace memory guard printed "healthy" 3.5 minutes before the Jul 28
# 2026 kernel panic; swap depth was computed and ignored. earlyoom trips on
# MemAvailable <= 4% AND free swap <= 25% (SIGTERM; SIGKILL at 2%/12.5%) —
# the swap condition is the one the old guard ignored.
# ExecStart lives here (unit-file quoting) and NOT in $EARLYOOM_ARGS: env-var
# word-splitting would break the 'tmux: server' space in the avoid regex.
# Undo: rm this drop-in dir, systemctl daemon-reload, systemctl restart earlyoom.
[Unit]
StartLimitIntervalSec=300
StartLimitBurst=5

[Service]
ExecStart=
ExecStart=/usr/bin/earlyoom -m 4 -s 25 -r 300 --avoid '(^|/)(init|systemd|sshd|tmux: server|journald)$' --prefer '(^|/)(node|bun|rustc|java)$'
