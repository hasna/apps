# hasna station template v1 — MGLRU anti-thrash.
# Makes the kernel OOM-kill instead of livelocking in reclaim.
# Runtime-only writes to lru_gen die on reboot (measured Jul 28 2026); this
# tmpfiles rule is the persistence. Do not rename to a lower number — see
# /etc/sysctl.d/99-zz-hasna-station.conf.
w     /sys/kernel/mm/lru_gen/min_ttl_ms    -    -    -     -   1000
