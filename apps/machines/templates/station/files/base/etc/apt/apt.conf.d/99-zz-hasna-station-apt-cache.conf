# hasna station: bound the apt archive cache.
# The `linux-update-downloads` setup step writes Download-Upgradeable-Packages
# "1" together with Unattended-Upgrade "0" — download every day, install never.
# APT's own default for AutocleanInterval is "0", meaning never autoclean, so
# /var/cache/apt/archives accumulates .deb files that by policy will never be
# installed. Measured on station17 2026-07-30: 97,818,544 bytes across 90 .deb
# after 16 hours of uptime, on a box the drift check called clean 42/42.
# The growth is monotonic and every Linux station inherits it.
# 7 days keeps a useful re-install window without unbounded growth.
# apt.conf.d is last-wins by lexical order, so the 99-zz- prefix overrides the
# 20auto-upgrades file the setup step writes.
APT::Periodic::AutocleanInterval "7";
