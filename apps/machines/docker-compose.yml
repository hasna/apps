# Local development compose for the machines control-plane service.
#
# Amendment A1 (PURE REMOTE): the service always talks to a cloud Postgres — it
# never bundles its own database. For a fully local loop, point
# HASNA_MACHINES_DATABASE_URL at a throwaway Postgres you run yourself and set
# HASNA_MACHINES_STORAGE_MODE=cloud. Secrets are read from the environment; no
# credential values live in this file.
services:
  machines-serve:
    build:
      context: .
      dockerfile: Dockerfile
    image: hasna/machines:local
    ports:
      - "8080:8080"
    environment:
      PORT: "8080"
      HOST: "0.0.0.0"
      HASNA_MACHINES_STORAGE_MODE: "cloud"
      HASNA_MACHINES_DATABASE_URL: "${HASNA_MACHINES_DATABASE_URL:?set HASNA_MACHINES_DATABASE_URL to a Postgres DSN}"
      HASNA_MACHINES_DATABASE_URL_OWNER: "${HASNA_MACHINES_DATABASE_URL_OWNER:-}"
      HASNA_MACHINES_API_SIGNING_KEY: "${HASNA_MACHINES_API_SIGNING_KEY:?set HASNA_MACHINES_API_SIGNING_KEY}"
    restart: unless-stopped
