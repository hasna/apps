<?xml version="1.0" encoding="UTF-8"?>
<!--
  PersonalNotes — macOS menu-bar glyph, RECORDING variant.
  Same note-card silhouette as personalnotes-menubar.svg with a solid dot in the
  lower-right (replacing the bottom text line). Loaded as a template image
  (isTemplate=true) and tinted red at runtime (NSColor.systemRed) by
  refreshStatusTitle in Sources/PersonalNotesApp/main.swift.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 18 18">
  <g fill="none" stroke="#000000" stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round">
    <rect x="3.25" y="2.5" width="11.5" height="13" rx="2.2"/>
    <line x1="6" y1="6.4" x2="12" y2="6.4"/>
    <line x1="6" y1="9" x2="11" y2="9"/>
  </g>
  <circle cx="12" cy="12" r="2" fill="#000000"/>
</svg>
