<?xml version="1.0" encoding="UTF-8"?>
<!--
  PersonalNotes — macOS menu-bar TEMPLATE glyph (idle state).

  This is a TEMPLATE image: single solid color only (black on transparent).
  macOS auto-tints template images for light/dark menu bars and "graphite/blue"
  accents, so DO NOT bake in brand purple here. Intended NSImage usage:
      img.isTemplate = true
  Authored on an 18×18pt grid with a ~1pt optical inset (the recommended
  menu-bar bounding box). The "recording" state is the same glyph with a filled
  dot — render it as a separate template or overlay; tint it red at runtime
  (NSColor.systemRed) the same way the current text title does.

  See docs/brand-visual-system.md → "Menu bar".
-->
<svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 18 18">
  <!-- Idle: note card with two text lines. Stroke-based so it stays crisp at 18pt. -->
  <g fill="none" stroke="#000000" stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round">
    <rect x="3.25" y="2.5" width="11.5" height="13" rx="2.2"/>
    <line x1="6" y1="6.4" x2="12" y2="6.4"/>
    <line x1="6" y1="9"   x2="12" y2="9"/>
    <line x1="6" y1="11.6" x2="9.5" y2="11.6"/>
  </g>

  <!--
    Recording variant (commented reference geometry): same card, plus a solid dot
    in the lower-right that replaces the bottom text line. Export this as
    personalnotes-menubar-rec.svg if a glyph (rather than the existing "● REC"
    text) is wired in later.

    <g fill="none" stroke="#000" stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round">
      <rect x="3.25" y="2.5" width="11.5" height="13" rx="2.2"/>
      <line x1="6" y1="6.4" x2="12" y2="6.4"/>
      <line x1="6" y1="9" x2="11" y2="9"/>
    </g>
    <circle cx="12" cy="12" r="2" fill="#000"/>
  -->
</svg>
