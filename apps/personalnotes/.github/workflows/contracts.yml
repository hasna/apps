name: contracts

on:
  push:
    branches: [main]
  pull_request:

jobs:
  conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Contract conformance (check:contracts)
        run: bun run check:contracts
      - name: Contract tests
        run: bun test scripts/check-contract-conformance.test.mjs
