name: backend-ci

on:
  push:
    paths:
      - "src/**"
      - "package.json"
      - "tsconfig*.json"
      - "bun.lock"
      - ".github/workflows/backend-ci.yml"
  pull_request:
    paths:
      - "src/**"
      - "package.json"
      - "tsconfig*.json"
      - "bun.lock"
      - ".github/workflows/backend-ci.yml"

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      # Hermetic: the default suite passes with no PostgreSQL present.
      - run: bun test src
      - run: bun run build

  live-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: pn
          POSTGRES_PASSWORD: pn
          POSTGRES_DB: personalnotes_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pn"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: live PostgreSQL storage gate
        env:
          PERSONALNOTES_TEST_DATABASE_URL: postgres://pn:pn@localhost:5432/personalnotes_test
        run: bun test src/lib/storage/postgres.test.ts
