[install]
minimumReleaseAge = 604800
minimumReleaseAgeExcludes = [
  "@hasna/contracts",
  "@hasna/mcp-harness",
]

# The React component tests install a per-file happy-dom window (see
# src/react/test-dom.ts). Files must run in isolated processes or the DOM
# globals and react-dom's module-level feature probes collide across files
# (same pattern as apps/browser).
[test]
isolation = "process"
