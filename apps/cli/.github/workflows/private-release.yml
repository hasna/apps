name: Publish private GitHub Package

on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact package version to publish
        required: true
        type: string
      expected_commit:
        description: Exact reviewed 40-character main commit
        required: true
        type: string
      expected_sha256:
        description: SHA-256 of the reviewed npm tarball
        required: true
        type: string

permissions:
  contents: read
  packages: write

concurrency:
  group: hasna-cli-private-package-release
  cancel-in-progress: false

env:
  PACKAGE_NAME: '@hasna/cli'
  REGISTRY_URL: https://npm.pkg.github.com

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify exact main ref and package contract
        env:
          EXPECTED_COMMIT: ${{ inputs.expected_commit }}
          EXPECTED_VERSION: ${{ inputs.version }}
          EXPECTED_SHA256: ${{ inputs.expected_sha256 }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/main
          [[ "$EXPECTED_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          [[ "$EXPECTED_SHA256" =~ ^[0-9a-f]{64}$ ]]
          [[ "$EXPECTED_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          test "$GITHUB_SHA" = "$EXPECTED_COMMIT"
          test "$(git rev-parse refs/remotes/origin/main)" = "$GITHUB_SHA"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/commits/main" --jq .sha)" = "$GITHUB_SHA"
          test "$(node -p "require('./package.json').name")" = "$PACKAGE_NAME"
          test "$(node -p "require('./package.json').version")" = "$EXPECTED_VERSION"
          test "$(node -p "require('./package.json').repository")" = 'https://github.com/hasna/cli'
          test "$(node -p "require('./package.json').publishConfig.registry")" = "$REGISTRY_URL"
          test "$(node -p "require('./package.json').publishConfig.access")" = restricted
          test "$(node -p "require('./package.json').publishConfig.tag")" = internal
          grep -Fx 'minimumReleaseAge = 604800' bunfig.toml
          grep -Fx 'minimumReleaseAgeExcludes = ["@hasna/cli"]' bunfig.toml

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20.19.4'
          registry-url: https://npm.pkg.github.com
          scope: '@hasna'

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.3.14'

      - name: Install with frozen lockfile and quarantine
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Run complete source and package gates
        env:
          BUN_VERSION: '1.3.14'
        run: |
          set -euo pipefail
          bun run check
          bun run test
          bun run build
          npm pack --dry-run --json >/dev/null
          bun run package:smoke

      - name: Verify exact reviewed tarball
        id: artifact
        env:
          EXPECTED_SHA256: ${{ inputs.expected_sha256 }}
          EXPECTED_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          TARBALL="hasna-cli-${EXPECTED_VERSION}.tgz"
          test -f "$TARBALL"
          test "$(find . -maxdepth 1 -name 'hasna-cli-*.tgz' -type f | wc -l)" = 1
          ACTUAL_SHA256=$(sha256sum "$TARBALL" | cut -d' ' -f1)
          test "$ACTUAL_SHA256" = "$EXPECTED_SHA256"
          node scripts/verify-package-artifact.mjs "$TARBALL"
          echo "tarball=$TARBALL" >> "$GITHUB_OUTPUT"

      - name: Authenticate and require package version absence
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          test -n "$(npm whoami --registry="$REGISTRY_URL")"
          set +e
          EXISTING_OUTPUT=$(npm view "${PACKAGE_NAME}@${VERSION}" version --registry="$REGISTRY_URL" --json 2>&1)
          EXISTING_STATUS=$?
          set -e
          if [[ "$EXISTING_STATUS" -eq 0 ]]; then
            echo 'package version already exists; refusing to overwrite' >&2
            exit 3
          fi
          if ! grep -q 'E404' <<<"$EXISTING_OUTPUT"; then
            echo 'existing package version query did not fail with E404' >&2
            exit 3
          fi

      - name: Publish exact tarball to private GitHub Packages
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARBALL: ${{ steps.artifact.outputs.tarball }}
        run: |
          set -euo pipefail
          npm publish "$TARBALL" \
            --registry="$REGISTRY_URL" \
            --access restricted \
            --tag internal \
            --ignore-scripts

      - name: Verify private package, digest, tags, and authenticated install
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EXPECTED_SHA256: ${{ inputs.expected_sha256 }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          test "$(npm view "${PACKAGE_NAME}@${VERSION}" version --registry="$REGISTRY_URL")" = "$VERSION"
          test "$(npm view "${PACKAGE_NAME}@internal" version --registry="$REGISTRY_URL")" = "$VERSION"
          DIST_TAGS=$(npm dist-tag ls "$PACKAGE_NAME" --registry="$REGISTRY_URL")
          grep -Fx "internal: $VERSION" <<<"$DIST_TAGS"
          ! grep -q '^latest:' <<<"$DIST_TAGS"

          DOWNLOAD_DIR=$(mktemp -d)
          npm pack "${PACKAGE_NAME}@${VERSION}" \
            --registry="$REGISTRY_URL" \
            --pack-destination "$DOWNLOAD_DIR" >/dev/null
          DOWNLOADED=$(find "$DOWNLOAD_DIR" -maxdepth 1 -name 'hasna-cli-*.tgz' -type f -print -quit)
          test "$(sha256sum "$DOWNLOADED" | cut -d' ' -f1)" = "$EXPECTED_SHA256"

          INSTALL_DIR=$(mktemp -d)
          npm init --yes --prefix "$INSTALL_DIR" >/dev/null
          npm install --prefix "$INSTALL_DIR" --ignore-scripts \
            --registry="$REGISTRY_URL" "${PACKAGE_NAME}@${VERSION}" >/dev/null
          RESULT=$("$INSTALL_DIR/node_modules/.bin/hasna" --json version)
          test "$(jq -r .data.version <<<"$RESULT")" = "$VERSION"

          node --input-type=module <<'NODE'
          const packageName = encodeURIComponent('@hasna/cli')
          const response = await fetch(`https://api.github.com/orgs/hasna/packages/npm/${packageName}`, {
            headers: {
              Accept: 'application/vnd.github+json',
              Authorization: `Bearer ${process.env.GITHUB_TOKEN}`,
              'X-GitHub-Api-Version': '2022-11-28',
            },
          })
          if (!response.ok) throw new Error(`GitHub package metadata request failed: ${response.status}`)
          const metadata = await response.json()
          if (metadata.visibility !== 'private') throw new Error('GitHub package is not private')
          if (metadata.repository?.full_name !== 'hasna/cli')
            throw new Error('GitHub package is not linked to hasna/cli')
          NODE

          ANONYMOUS_CONFIG=$(mktemp)
          printf '@hasna:registry=%s\n' "$REGISTRY_URL" > "$ANONYMOUS_CONFIG"
          set +e
          env -u NODE_AUTH_TOKEN -u GITHUB_TOKEN \
            npm --userconfig="$ANONYMOUS_CONFIG" view "${PACKAGE_NAME}@${VERSION}" version \
            --registry="$REGISTRY_URL" >/dev/null 2>&1
          ANONYMOUS_STATUS=$?
          set -e
          test "$ANONYMOUS_STATUS" -ne 0

      - name: Preserve private release evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: hasna-cli-private-release-${{ github.sha }}-${{ github.run_id }}
          path: |
            artifacts/build-evidence.json
            ${{ steps.artifact.outputs.tarball }}
          if-no-files-found: error
          retention-days: 90
