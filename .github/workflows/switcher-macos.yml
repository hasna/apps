name: switcher-macos

on:
  pull_request:
    paths:
      - apps/switcher/**
      - .github/workflows/switcher-macos.yml
  push:
    branches: [main]
    paths:
      - apps/switcher/**
      - .github/workflows/switcher-macos.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  native-state:
    name: Native state and desktop boundaries (macOS)
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - name: Install the frozen workspace without package lifecycle mutations
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Build the exact packaged Switcher runtime
        working-directory: apps/switcher
        run: |
          bun run typecheck
          bun run build
      - name: Verify native state, desktop isolation and the packaged bridge
        working-directory: apps/switcher
        env:
          SWITCHER_TEST_DIST: "1"
          SWITCHER_TEST_ROOT: ${{ runner.temp }}/switcher-tests
        run: |
          mkdir -m 700 "$SWITCHER_TEST_ROOT"
          bun test \
            tests/native-state.test.ts \
            tests/native-state-import.test.ts \
            tests/codex-state-bridge.test.ts \
            tests/chatgpt-launch.test.ts \
            tests/claude-desktop.test.ts
      - name: Scan the exact packed artifact
        working-directory: apps/switcher
        env:
          SWITCHER_TEST_ROOT: ${{ runner.temp }}/switcher-artifacts
        run: |
          mkdir -m 700 "$SWITCHER_TEST_ROOT"
          bun run scan:artifact
