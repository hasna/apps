# TEMPORARY DIAGNOSTIC workflow (billing publish-guard flake, task 40ce31ad).
# REMOVE BEFORE MERGE. Runs the REAL publish-guard over the REAL repo (all
# members) with a temporary diagnostic hook in check-publish-guard.ts that
# dumps the captured prepack stdout tail on failure, so the inner failing step
# of billing's prepack becomes visible.
name: diagnose-billing-pack

on:
  pull_request:
  push:
    branches: [main]

jobs:
  diagnose:
    name: diagnose billing pack flake
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Install
        run: bun install --frozen-lockfile
      - name: Real guard (all members, diag hook dumps prepack stdout on failure)
        run: |
          set +e
          echo "nproc: $(nproc)"
          start=$(date +%s.%N)
          bun tooling/ci/check-publish-guard.ts > /tmp/guard.out 2> /tmp/guard.err
          rc=$?
          end=$(date +%s.%N)
          echo "guard rc=$rc dur=$(echo "$end $start" | awk '{printf "%.1f", $1-$2}')s"
          echo "--- guard stdout ---"; cat /tmp/guard.out
          echo "--- guard stderr ---"; cat /tmp/guard.err
          echo "--- newest npm debug log ---"
          LOG=$(ls -t "$HOME/.npm/_logs" 2>/dev/null | head -1)
          if [ -n "$LOG" ]; then tail -60 "$HOME/.npm/_logs/$LOG"; fi
          exit 0
