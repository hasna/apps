# TEMPORARY DIAGNOSTIC workflow (billing publish-guard flake, task 40ce31ad).
# REMOVE BEFORE MERGE. Loop the REAL publish-guard 3x with the diagnostic hook
# in check-publish-guard.ts (dumps captured prepack stdout on failure) to
# catch the intermittent member-prepack failure and identify the inner step.
name: diagnose-billing-pack

on:
  pull_request:
  push:
    branches: [main]

jobs:
  diagnose:
    name: diagnose billing pack flake
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Install
        run: bun install --frozen-lockfile
      - name: Real guard x3 (diag hook dumps prepack stdout on failure)
        run: |
          set +e
          for round in 1 2 3; do
            echo "===== ROUND $round ====="
            free -m | head -2
            ps aux | wc -l
            start=$(date +%s.%N)
            bun tooling/ci/check-publish-guard.ts > /tmp/guard-$round.out 2> /tmp/guard-$round.err
            rc=$?
            end=$(date +%s.%N)
            echo "guard round $round rc=$rc dur=$(echo "$end $start" | awk '{printf "%.1f", $1-$2}')s"
            if [ $rc -ne 0 ]; then
              echo "--- guard stdout ---"; cat /tmp/guard-$round.out
              echo "--- guard stderr ---"; cat /tmp/guard-$round.err
              echo "--- newest npm debug log ---"
              LOG=$(ls -t "$HOME/.npm/_logs" 2>/dev/null | head -1)
              if [ -n "$LOG" ]; then tail -80 "$HOME/.npm/_logs/$LOG"; fi
            fi
          done
          exit 0
