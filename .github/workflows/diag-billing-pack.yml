# TEMPORARY DIAGNOSTIC workflow (billing publish-guard flake, task 40ce31ad).
# REMOVE BEFORE MERGE. The fail-loud guard reports only npm's stderr tail on
# failure; the inner failing step of billing's prepack (`bun run verify && bun
# run scan:artifact`) is invisible in CI logs. Measured on the runner:
# typecheck 2.9s + test 1.4s ≈ the 4.2s failure point, so the failing step is
# `bun test`. This workflow hammers bun test, captures full failure output,
# and checks DNS behavior for the probe host used by mcp-safety tests.
name: diagnose-billing-pack

on:
  pull_request:
  push:
    branches: [main]

jobs:
  diagnose:
    name: diagnose billing pack flake
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Install
        run: bun install --frozen-lockfile
      - name: Environment + DNS facts
        run: |
          set +e
          echo "nproc: $(nproc)"; free -m | head -2
          echo "resolv.conf:"; cat /etc/resolv.conf
          echo "db.internal lookup:"
          getent hosts db.internal; echo "getent rc=$?"
          time (bun -e 'try { console.log("bun dns:", await Bun.dns.lookup("db.internal")) } catch (e) { console.log("bun dns failed:", e.message) }')
          echo "env names:"; env | cut -d= -f1 | sort | grep -E "^(CI|GITHUB_|RUNNER_|ACTIONS_|LANG|LC_)" | tr '\n' ' '; echo
      - name: Hammer bun test (15x, full output on failure)
        run: |
          set +e
          FAILS=0
          for i in $(seq 1 15); do
            start=$(date +%s.%N)
            (cd apps/billing && bun test > /tmp/bt-$i.log 2>&1)
            rc=$?
            end=$(date +%s.%N)
            dur=$(echo "$end $start" | awk '{printf "%.1f", $1-$2}')
            echo "bt iter $i: rc=$rc dur=${dur}s"
            if [ $rc -ne 0 ]; then
              FAILS=$((FAILS+1))
              echo "===== FAILURE OUTPUT iter $i ====="
              cat /tmp/bt-$i.log
            fi
          done
          echo "bt failures: $FAILS/15"
          exit 0
      - name: Hammer pack (5x, full prepack output on failure)
        run: |
          set +e
          for i in $(seq 1 5); do
            start=$(date +%s.%N)
            (cd apps/billing && npm pack --dry-run --json > /tmp/pack-$i.out 2> /tmp/pack-$i.err)
            rc=$?
            end=$(date +%s.%N)
            dur=$(echo "$end $start" | awk '{printf "%.1f", $1-$2}')
            echo "pack iter $i: rc=$rc dur=${dur}s"
            if [ $rc -ne 0 ]; then
              echo "--- stderr ---"; cat /tmp/pack-$i.err
              echo "--- stdout (prepack) tail ---"; tail -50 /tmp/pack-$i.out
            fi
          done
          exit 0
