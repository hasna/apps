# TEMPORARY DIAGNOSTIC workflow (billing publish-guard flake, task 40ce31ad).
# REMOVE BEFORE MERGE. Phase 3: replicate the guard's EXACT npm-pack invocation
# (execFileSync, pipe stdio) on the runner in a loop, and dump the FULL
# captured prepack stdout + npm debug log on failure, so the inner failing
# step of billing's prepack becomes visible.
name: diagnose-billing-pack

on:
  pull_request:
  push:
    branches: [main]

jobs:
  diagnose:
    name: diagnose billing pack flake
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Install
        run: bun install --frozen-lockfile
      - name: Replicate guard invocation (25x, full prepack output on failure)
        run: |
          set +e
          cat > /tmp/guard-repro.ts <<'EOF'
import { execFileSync } from "node:child_process";
const pkgDir = process.argv[2];
const n = parseInt(process.argv[3] ?? "10", 10);
let failures = 0;
for (let i = 1; i <= n; i++) {
  const start = Date.now();
  let out: string;
  try {
    out = execFileSync("npm", ["pack", "--dry-run", "--json"], {
      cwd: pkgDir,
      encoding: "utf8",
      maxBuffer: 16 * 1024 * 1024,
      stdio: ["ignore", "pipe", "pipe"],
    });
    const dur = ((Date.now() - start) / 1000).toFixed(1);
    const m = out.match(/"entryCount":\s*(\d+)/);
    console.log(`run ${i}: PASS dur=${dur}s entryCount=${m?.[1] ?? "?"}`);
  } catch (e: any) {
    failures++;
    const dur = ((Date.now() - start) / 1000).toFixed(1);
    const tail = String(e?.stderr ?? e?.message ?? "").trim().split("\n").slice(-3).join("\n");
    console.log(`run ${i}: FAIL dur=${dur}s`);
    console.log("  stderr tail:", tail);
    const stdoutTail = String(e?.stdout ?? "").trim().split("\n").slice(-40).join("\n");
    console.log("  stdout tail (prepack):");
    console.log(stdoutTail);
  }
}
console.log(`\nDONE: ${n - failures}/${n} passed`);
process.exit(failures ? 1 : 0);
EOF
          bun /tmp/guard-repro.ts "$PWD/apps/billing" 25
          echo "--- npm debug log tail ---"
          LOG=$(ls -t "$HOME/.npm/_logs" 2>/dev/null | head -1)
          if [ -n "$LOG" ]; then tail -100 "$HOME/.npm/_logs/$LOG"; fi
          exit 0
