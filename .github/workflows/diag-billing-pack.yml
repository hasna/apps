# TEMPORARY DIAGNOSTIC workflow (billing publish-guard flake, task 40ce31ad).
# REMOVE BEFORE MERGE. The fail-loud guard reports only npm's stderr tail on
# failure; the inner failing step of billing's prepack is invisible in CI logs.
# Phase 1 found: direct `bun test` on the runner fails `contracts` PATH
# resolution (deployment-terms test spawns node_modules/.bin/contracts). The
# guard chain goes npm -> sh -> bun run verify -> bun run test -> bun test, and
# `bun run` prepends node_modules/.bin to PATH. Decisive test: run the EXACT
# guard chain (npm pack 10x) + bun run test 10x + PATH/.bin facts.
name: diagnose-billing-pack

on:
  pull_request:
  push:
    branches: [main]

jobs:
  diagnose:
    name: diagnose billing pack flake
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Install
        run: bun install --frozen-lockfile
      - name: Facts (PATH, .bin links, versions)
        run: |
          set +e
          echo "nproc: $(nproc)"
          echo "bun: $(bun --version) npm: $(npm --version)"
          echo "PATH=$PATH"
          echo "billing .bin:"; ls -la apps/billing/node_modules/.bin/ 2>&1
          echo "billing .bin contracts resolve:"; test -x apps/billing/node_modules/.bin/contracts && echo PRESENT || echo MISSING
      - name: Guard chain — bun run test (10x)
        run: |
          set +e
          for i in $(seq 1 10); do
            start=$(date +%s.%N)
            (cd apps/billing && bun run test > /tmp/brt-$i.log 2>&1)
            rc=$?
            end=$(date +%s.%N)
            dur=$(echo "$end $start" | awk '{printf "%.1f", $1-$2}')
            echo "bun run test iter $i: rc=$rc dur=${dur}s"
            if [ $rc -ne 0 ]; then echo "===== FAILURE iter $i ====="; cat /tmp/brt-$i.log; fi
          done
          exit 0
      - name: Guard chain — npm pack (10x, full output on failure)
        run: |
          set +e
          for i in $(seq 1 10); do
            start=$(date +%s.%N)
            (cd apps/billing && npm pack --dry-run --json > /tmp/pack-$i.out 2> /tmp/pack-$i.err)
            rc=$?
            end=$(date +%s.%N)
            dur=$(echo "$end $start" | awk '{printf "%.1f", $1-$2}')
            echo "pack iter $i: rc=$rc dur=${dur}s"
            if [ $rc -ne 0 ]; then
              echo "--- stderr ---"; cat /tmp/pack-$i.err
              echo "--- stdout (prepack) tail ---"; tail -60 /tmp/pack-$i.out
              LOG=$(ls -t "$HOME/.npm/_logs" 2>/dev/null | head -1)
              if [ -n "$LOG" ]; then echo "--- npm debug log: $LOG ---"; tail -80 "$HOME/.npm/_logs/$LOG"; fi
            fi
          done
          exit 0
