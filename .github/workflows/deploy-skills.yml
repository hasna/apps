name: deploy-skills

# Ported from apps/skills/.github/workflows/deploy.yml (todos 9b1828c9):
# GitHub Actions only discovers workflows at the repo ROOT .github/workflows/,
# so the member-nested copy was a silent dead lane. This root-level workflow is
# the discoverable home of the skills deploy lane.
#
# TRIGGERING — deployment never races the repository gates. A push to main does
# NOT start this lane directly; the `ci` workflow does, and only after it has
# already concluded successfully for that exact commit. `workflow_run` carries
# `head_sha`, so the deployed source is bound to the commit CI actually
# verified rather than to whatever main happens to point at when the deploy
# starts. `workflow_run` does not accept a `paths:` filter, so the
# member-scoping that `paths: [apps/skills/**]` used to provide is enforced in
# the gate job below against DEPLOY_PATH_SCOPE — a push touching another member
# resolves proceed=false and the deploy job is skipped, never run and failed.
#
# The manual route is retained and is deliberately narrower than the automatic
# one: workflow_dispatch must be invoked on the main branch ref and always
# resolves to the exact current origin/main tip. A historical SHA cannot be
# deployed by hand, which is what the previous ancestor-of-main check allowed.
# Resolving to the tip is necessary and was not sufficient — the tip itself may
# never have passed ci, so a hand dispatch during or after red CI could deploy
# an unverified commit. The gate therefore asks the Actions API, with the
# workflow's own contents+actions read token, for a COMPLETED SUCCESSFUL ci PUSH
# run on main whose head_sha equals that freshly resolved tip, and refuses on
# zero or unreadable matches. Both routes now deploy only ci-passed commits.
#
# The bare `v*` tag trigger from the standalone repo is deliberately NOT carried
# over: path filters are not evaluated for tag pushes, so a v* tag on the
# monorepo would deploy skills from whatever commit the tag points at. Release
# deploys happen on ci-passed pushes to main, or by workflow_dispatch.

on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

env:
  APP: skills
  AWS_REGION: us-east-1
  LOCAL_IMAGE: skills-deploy-candidate
  # The workflow whose successful conclusion is the ONLY automatic entry point
  # into this lane. Must equal the `name:` of .github/workflows/ci.yml and the
  # single entry of on.workflow_run.workflows; the deploy gate cross-checks all
  # three so renaming ci.yml cannot silently detach the binding.
  REQUIRED_CI_WORKFLOW: ci
  # The ci workflow's file, used to address it exactly on the Actions API when
  # the manual route has to prove a ci success itself. Selecting by file path is
  # unambiguous where a name lookup is not; the run's own `name` and `path` are
  # then both re-checked against this pin and REQUIRED_CI_WORKFLOW.
  CI_WORKFLOW_FILE: ci.yml
  # Member scoping for this lane. Used as a real git pathspec by the gate job
  # because workflow_run cannot carry a paths: filter.
  DEPLOY_PATH_SCOPE: "apps/skills/**"

jobs:
  gate:
    name: gate (successful ci for the exact main commit)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # The gate reads git history and the repository's own Actions run history,
    # and nothing else. It must never hold the OIDC token that the deploy job
    # needs, so it narrows the workflow permissions: `actions: read` is what
    # lets it ask whether ci actually passed for a commit, and `id-token` is
    # deliberately absent so this job can never assume an AWS role.
    permissions:
      contents: read
      actions: read
    # A failed, cancelled, non-push or non-main ci run must not open this lane.
    # Expressed as a job condition so an unrelated ci outcome SKIPS the lane
    # instead of reporting a red deployment for a deployment that never began.
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main') }}
    outputs:
      proceed: ${{ steps.resolve.outputs.proceed }}
      source_sha: ${{ steps.resolve.outputs.source_sha }}
    steps:
      - name: Checkout main history
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: main

      - name: Resolve the deployable commit
        id: resolve
        shell: bash
        env:
          # The workflow's own short-lived repository token, scoped by the job
          # permissions above to contents+actions read. No PAT, no secret.
          GH_TOKEN: ${{ github.token }}
          RUN_NAME: ${{ github.event.workflow_run.name }}
          RUN_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          RUN_EVENT: ${{ github.event.workflow_run.event }}
          RUN_BRANCH: ${{ github.event.workflow_run.head_branch }}
          RUN_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -Eeuo pipefail
          git fetch --no-tags --prune origin +refs/heads/main:refs/remotes/origin/main
          main_tip="$(git rev-parse refs/remotes/origin/main)"
          proceed=false
          source_sha=""

          case "${GITHUB_EVENT_NAME}" in
            workflow_run)
              [[ "${RUN_NAME}" == "${REQUIRED_CI_WORKFLOW}" ]] || { echo "upstream workflow is ${RUN_NAME}, not ${REQUIRED_CI_WORKFLOW}" >&2; exit 1; }
              [[ "${RUN_CONCLUSION}" == "success" ]] || { echo "upstream ci concluded ${RUN_CONCLUSION}, not success" >&2; exit 1; }
              [[ "${RUN_EVENT}" == "push" ]] || { echo "upstream ci ran for ${RUN_EVENT}, not push" >&2; exit 1; }
              [[ "${RUN_BRANCH}" == "main" ]] || { echo "upstream ci ran on ${RUN_BRANCH}, not main" >&2; exit 1; }
              [[ "${RUN_HEAD_SHA}" =~ ^[0-9a-f]{40}$ ]] || { echo "upstream ci head sha is not a full commit id" >&2; exit 1; }
              source_sha="${RUN_HEAD_SHA}"
              git merge-base --is-ancestor "${source_sha}^{commit}" refs/remotes/origin/main || { echo "ci commit ${source_sha} is no longer contained in origin/main" >&2; exit 1; }
              superseded="$(git rev-list -n 1 "${source_sha}..refs/remotes/origin/main" -- "${DEPLOY_PATH_SCOPE}")"
              parent="$(git rev-parse --verify --quiet "${source_sha}^1" || true)"
              if [[ -n "${superseded}" ]]; then
                echo "superseded: origin/main already carries a newer commit touching ${DEPLOY_PATH_SCOPE}; that commit's own ci run owns the deployment"
              elif [[ -z "${parent}" ]]; then
                proceed=true
              elif [[ -n "$(git diff --name-only "${parent}" "${source_sha}" -- "${DEPLOY_PATH_SCOPE}")" ]]; then
                proceed=true
              else
                echo "no change under ${DEPLOY_PATH_SCOPE} in ${source_sha}; this lane has nothing to deploy"
              fi
              ;;
            workflow_dispatch)
              [[ "${GITHUB_REF}" == "refs/heads/main" ]] || { echo "manual deploy is restricted to the main branch ref, received ${GITHUB_REF}" >&2; exit 1; }
              source_sha="${main_tip}"
              # A manual dispatch must not become a route around the repository
              # gates. The workflow_run arm above inherits a head_sha that ci
              # itself verified; workflow_dispatch inherits nothing, so the same
              # binding is PROVED here against the Actions API: the exact tip we
              # are about to deploy must already own a COMPLETED, SUCCESSFUL ci
              # PUSH run on main. A dispatch during red, in-flight, or absent ci
              # is refused rather than deployed.
              #
              # Fails closed on every path: a missing token, an HTTP or 404
              # failure (set -e), a body jq cannot reduce to a number, and a zero
              # count all exit non-zero. Nothing here can resolve proceed=true by
              # default.
              [[ -n "${GH_TOKEN:-}" ]] || { echo "manual deploy cannot verify ${REQUIRED_CI_WORKFLOW} without a repository token" >&2; exit 1; }
              gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/${CI_WORKFLOW_FILE}/runs?branch=main&event=push&status=completed&head_sha=${source_sha}&per_page=100" > "${RUNNER_TEMP}/ci-runs.json"
              ci_success_count="$(jq --arg sha "${source_sha}" --arg name "${REQUIRED_CI_WORKFLOW}" --arg path ".github/workflows/${CI_WORKFLOW_FILE}" '[.workflow_runs[]? | select(.name == $name and .path == $path and .head_sha == $sha and .head_branch == "main" and .event == "push" and .status == "completed" and .conclusion == "success")] | length' "${RUNNER_TEMP}/ci-runs.json")"
              [[ "${ci_success_count}" =~ ^[0-9]+$ ]] || { echo "the ${REQUIRED_CI_WORKFLOW} run query for ${source_sha} returned a body with no readable count" >&2; exit 1; }
              [[ "${ci_success_count}" -ge 1 ]] || { echo "manual deploy refused: no completed successful ${REQUIRED_CI_WORKFLOW} push run on main for the exact origin/main tip ${source_sha}" >&2; exit 1; }
              echo "manual deploy: ${ci_success_count} completed successful ${REQUIRED_CI_WORKFLOW} push run(s) bind ${source_sha}"
              proceed=true
              ;;
            *)
              echo "unsupported trigger ${GITHUB_EVENT_NAME}" >&2
              exit 1
              ;;
          esac

          [[ "${source_sha}" =~ ^[0-9a-f]{40}$ ]] || { echo "gate did not resolve a full source commit" >&2; exit 1; }
          {
            printf 'source_sha=%s\n' "${source_sha}"
            printf 'proceed=%s\n' "${proceed}"
          } >> "${GITHUB_OUTPUT}"

  deploy:
    name: build + scan + migrate + deploy
    needs: gate
    if: ${{ needs.gate.outputs.proceed == 'true' }}
    runs-on: ubuntu-24.04-arm
    environment: production
    timeout-minutes: 45

    defaults:
      run:
        shell: bash
        # The monorepo checkout lands at the repo root; this job's Dockerfile,
        # package.json, bun.lock and .dockerignore all live under apps/skills.
        # The docker build context below is `.` and MUST resolve to apps/skills.
        working-directory: apps/skills

    steps:
      - name: Checkout exact source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ needs.gate.outputs.source_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify source is the gated ci-passed main commit
        env:
          GATED_SHA: ${{ needs.gate.outputs.source_sha }}
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "${GATED_SHA}"
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          main_tip="$(git rev-parse refs/remotes/origin/main)"
          git merge-base --is-ancestor "${GATED_SHA}^{commit}" refs/remotes/origin/main
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            [[ "${GITHUB_REF}" == "refs/heads/main" ]] || { echo "manual deploy is restricted to the main branch ref, received ${GITHUB_REF}" >&2; exit 1; }
            [[ "${GATED_SHA}" == "${main_tip}" ]] || { echo "manual deploy must target the exact current origin/main commit ${main_tip}, received ${GATED_SHA}" >&2; exit 1; }
          fi
          printf 'SOURCE_SHA=%s\n' "${GATED_SHA}" >> "${GITHUB_ENV}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build native ARM64 image locally
        run: |
          set -Eeuo pipefail
          docker buildx build \
            --platform linux/arm64 \
            --provenance=false \
            --cache-from "type=gha" \
            --cache-to "type=gha,mode=max" \
            --tag "${LOCAL_IMAGE}:${SOURCE_SHA}" \
            --load \
            .

      # The local image is scanned BEFORE any AWS credential is configured, so
      # a CRITICAL/HIGH candidate never reaches the credentialed window. The
      # scan rejects by severity count in the next step, mirroring the todos
      # lane; the action is pinned to its full commit (a tag is mutable, and
      # this action runs before the deploy job holds any production credential).
      - name: Generate local vulnerability report
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.LOCAL_IMAGE }}:${{ needs.gate.outputs.source_sha }}
          format: json
          output: ${{ github.workspace }}/apps/skills/trivy-local.json
          scanners: vuln
          vuln-type: os,library
          severity: CRITICAL,HIGH
          ignore-unfixed: false
          exit-code: "0"

      - name: Enforce local vulnerability gate
        id: local-scan
        run: |
          set -Eeuo pipefail
          critical="$(jq '[.Results[]?.Vulnerabilities[]? | select(.Severity == "CRITICAL")] | length' trivy-local.json)"
          high="$(jq '[.Results[]?.Vulnerabilities[]? | select(.Severity == "HIGH")] | length' trivy-local.json)"
          [[ "${critical}" =~ ^[0-9]+$ && "${high}" =~ ^[0-9]+$ ]]
          printf 'critical=%s\n' "${critical}" >> "${GITHUB_OUTPUT}"
          printf 'high=%s\n' "${high}" >> "${GITHUB_OUTPUT}"
          if (( critical > 0 || high > 0 )); then
            echo "local image scan rejected the candidate: critical=${critical}, high=${high}" >&2
            exit 1
          fi

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/${{ env.APP }}-prod-gha-deploy
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: gha-deploy-${{ env.APP }}-${{ github.run_id }}

      # Every infrastructure identifier this workflow needs (cluster, service,
      # task family, container, ECR repo, networking, health URL) is resolved
      # here from the deploy manifest, with an optional CI-variable override.
      # No infrastructure name is written literally anywhere in this repository.
      # The DEPLOY_MANIFEST line below is the single tracked line that names
      # where the manifest lives; everything else is read out of it.
      - name: Load deploy manifest
        id: m
        env:
          DEPLOY_MANIFEST: ${{ vars.DEPLOY_MANIFEST || format('/hasna/deploy/{0}', env.APP) }}
          VAR_CLUSTER: ${{ vars.ECS_CLUSTER }}
          VAR_SERVICE: ${{ vars.ECS_SERVICE }}
          VAR_WEB_FAMILY: ${{ vars.WEB_TASK_FAMILY }}
          VAR_WEB_CONTAINER: ${{ vars.WEB_CONTAINER }}
          VAR_MIG_FAMILY: ${{ vars.MIGRATION_TASK_FAMILY }}
          VAR_MIG_CONTAINER: ${{ vars.MIGRATION_CONTAINER }}
          VAR_ECR_URL: ${{ vars.ECR_REPOSITORY_URL }}
          VAR_ASSIGN_PUBLIC_IP: ${{ vars.ASSIGN_PUBLIC_IP }}
          VAR_SUBNETS: ${{ vars.SUBNETS }}
          VAR_SGS: ${{ vars.SECURITY_GROUPS }}
          VAR_WORKER_SERVICE: ${{ vars.WORKER_SERVICE }}
          VAR_WORKER_FAMILY: ${{ vars.WORKER_TASK_FAMILY }}
          VAR_WORKER_CONTAINER: ${{ vars.WORKER_CONTAINER }}
          VAR_HEALTH_URL: ${{ vars.HEALTH_URL }}
        run: |
          set -euo pipefail
          M="$(aws ssm get-parameter --name "$DEPLOY_MANIFEST" --query Parameter.Value --output text)"

          missing=""

          # resolve <output> <jq-filter> <ci-variable-name> <ci-variable-value>
          # Manifest wins; the CI variable is the fallback. Anything that resolves
          # to neither is collected and reported together at the end -- BEFORE any
          # image is built and before any service is mutated, so an incompletely
          # configured deployment fails clean rather than half-applied.
          resolve() {
            output="$1"; filter="$2"; var_name="$3"; var_value="${4:-}"
            # An explicit "null" test rather than jq's `// empty`: the alternative
            # operator also swallows `false`, which would corrupt assign_public_ip.
            value="$(jq -r "$filter" <<<"$M" 2>/dev/null || true)"
            if [ "$value" = "null" ]; then value=""; fi
            if [ -z "$value" ]; then value="$var_value"; fi
            if [ -z "$value" ]; then
              missing="${missing}  - ${output}: manifest key '${filter}' or repository variable '${var_name}'"$'\n'
              return 0
            fi
            echo "${output}=${value}" >> "$GITHUB_OUTPUT"
          }

          resolve cluster          '.cluster'                       ECS_CLUSTER            "${VAR_CLUSTER:-}"
          resolve service          '.service'                       ECS_SERVICE            "${VAR_SERVICE:-}"
          resolve web_family       '.web_task_family'               WEB_TASK_FAMILY        "${VAR_WEB_FAMILY:-}"
          resolve web_container    '.web_container'                 WEB_CONTAINER          "${VAR_WEB_CONTAINER:-}"
          resolve mig_family       '.migration_task_family'         MIGRATION_TASK_FAMILY  "${VAR_MIG_FAMILY:-}"
          resolve mig_container    '.migration_container'           MIGRATION_CONTAINER    "${VAR_MIG_CONTAINER:-}"
          resolve ecr_url          '.ecr_repository_url'            ECR_REPOSITORY_URL     "${VAR_ECR_URL:-}"
          resolve assign_public_ip '.assign_public_ip'              ASSIGN_PUBLIC_IP       "${VAR_ASSIGN_PUBLIC_IP:-}"
          resolve subnets          '.subnets | join(",")'           SUBNETS                "${VAR_SUBNETS:-}"
          resolve sgs              '.security_groups | join(",")'   SECURITY_GROUPS        "${VAR_SGS:-}"
          resolve worker_service   '.worker_service'                WORKER_SERVICE         "${VAR_WORKER_SERVICE:-}"
          resolve worker_family    '.worker_task_family'            WORKER_TASK_FAMILY     "${VAR_WORKER_TASK_FAMILY:-}"
          resolve worker_container '.worker_container'              WORKER_CONTAINER       "${VAR_WORKER_CONTAINER:-}"
          resolve health_url       '.health_url'                    HEALTH_URL             "${VAR_HEALTH_URL:-}"

          if [ -n "$missing" ]; then
            echo "::error::deploy manifest '$DEPLOY_MANIFEST' is missing required values and no repository-variable fallback is set:"
            printf '%s' "$missing"
            echo "::error::add the listed manifest keys to the SSM parameter, or set the listed repository variables."
            exit 1
          fi

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@d539f0932e70871a027e9d5a9d8fc38589180a64 # v2
        with:
          mask-password: true

      - name: Push scanned image
        id: build
        env:
          ECR_URL: ${{ steps.m.outputs.ecr_url }}
        run: |
          set -euo pipefail
          IMAGE="${ECR_URL}:${SOURCE_SHA}"
          docker tag "${LOCAL_IMAGE}:${SOURCE_SHA}" "${IMAGE}"
          docker push "${IMAGE}"
          echo "image=${IMAGE}" >> "$GITHUB_OUTPUT"

      - name: Run database migration
        env:
          IMAGE: ${{ steps.build.outputs.image }}
          CLUSTER: ${{ steps.m.outputs.cluster }}
          MIG_FAMILY: ${{ steps.m.outputs.mig_family }}
          MIG_CONTAINER: ${{ steps.m.outputs.mig_container }}
          SUBNETS: ${{ steps.m.outputs.subnets }}
          SGS: ${{ steps.m.outputs.sgs }}
          ASSIGN: ${{ steps.m.outputs.assign_public_ip }}
        run: |
          set -euo pipefail
          NEW_TD="$(aws ecs describe-task-definition --task-definition "$MIG_FAMILY" \
            --query taskDefinition | jq --arg img "$IMAGE" --arg c "$MIG_CONTAINER" '
              .containerDefinitions |= map(if .name==$c then .image=$img else . end)
              | del(.taskDefinitionArn,.revision,.status,.requiresAttributes,.compatibilities,.registeredAt,.registeredBy,.deregisteredAt)')"
          MIG_ARN="$(aws ecs register-task-definition --cli-input-json "$NEW_TD" \
            --query taskDefinition.taskDefinitionArn --output text)"
          TASK_ARN="$(aws ecs run-task --cluster "$CLUSTER" --task-definition "$MIG_ARN" \
            --launch-type FARGATE --count 1 \
            --started-by "gha-migrate-${GITHUB_RUN_ID}" \
            --network-configuration "awsvpcConfiguration={subnets=[$SUBNETS],securityGroups=[$SGS],assignPublicIp=$ASSIGN}" \
            --query 'tasks[0].taskArn' --output text)"
          if [ -z "$TASK_ARN" ] || [ "$TASK_ARN" = "None" ]; then
            echo "::error::migration task failed to start"; exit 1
          fi
          aws ecs wait tasks-stopped --cluster "$CLUSTER" --tasks "$TASK_ARN"
          DESC="$(aws ecs describe-tasks --cluster "$CLUSTER" --tasks "$TASK_ARN")"
          EXIT="$(jq -r ".tasks[0].containers[] | select(.name==\"$MIG_CONTAINER\") | .exitCode // \"null\"" <<<"$DESC")"
          REASON="$(jq -r '.tasks[0].stoppedReason // ""' <<<"$DESC")"
          echo "migration exitCode=$EXIT stoppedReason=$REASON"
          if [ "$EXIT" != "0" ]; then
            echo "::error::migration task did not exit 0 (exit=$EXIT, reason=$REASON)"; exit 1
          fi

      - name: Deploy API service
        id: deploy_api
        env:
          IMAGE: ${{ steps.build.outputs.image }}
          CLUSTER: ${{ steps.m.outputs.cluster }}
          SERVICE: ${{ steps.m.outputs.service }}
          WEB_FAMILY: ${{ steps.m.outputs.web_family }}
          WEB_CONTAINER: ${{ steps.m.outputs.web_container }}
        run: |
          set -euo pipefail
          NEW_TD="$(aws ecs describe-task-definition --task-definition "$WEB_FAMILY" \
            --query taskDefinition | jq --arg img "$IMAGE" --arg c "$WEB_CONTAINER" '
              .containerDefinitions |= map(if .name==$c then .image=$img else . end)
              | del(.taskDefinitionArn,.revision,.status,.requiresAttributes,.compatibilities,.registeredAt,.registeredBy,.deregisteredAt)')"
          WEB_ARN="$(aws ecs register-task-definition --cli-input-json "$NEW_TD" \
            --query taskDefinition.taskDefinitionArn --output text)"
          aws ecs update-service --cluster "$CLUSTER" --service "$SERVICE" \
            --task-definition "$WEB_ARN" \
            --desired-count 1 >/dev/null
          aws ecs wait services-stable --cluster "$CLUSTER" --services "$SERVICE"
          for attempt in {1..24}; do
            SVC="$(aws ecs describe-services --cluster "$CLUSTER" --services "$SERVICE")"
            RS="$(jq -r '[.services[0].deployments[] | select(.status=="PRIMARY") | .rolloutState][0] // ""' <<<"$SVC")"
            LIVE_TD="$(jq -r '[.services[0].deployments[] | select(.status=="PRIMARY") | .taskDefinition][0] // ""' <<<"$SVC")"
            if [ "$RS" = "COMPLETED" ] && [ "$LIVE_TD" = "$WEB_ARN" ]; then
              exit 0
            fi
            echo "waiting for API primary rollout completion (attempt ${attempt}/24, state=${RS}, taskDefinition=${LIVE_TD})"
            sleep 5
          done
          echo "::error::API deployment did not complete cleanly"; exit 1

      - name: Deploy worker service
        env:
          IMAGE: ${{ steps.build.outputs.image }}
          CLUSTER: ${{ steps.m.outputs.cluster }}
          WORKER_SERVICE: ${{ steps.m.outputs.worker_service }}
          WORKER_FAMILY: ${{ steps.m.outputs.worker_family }}
          WORKER_CONTAINER: ${{ steps.m.outputs.worker_container }}
        run: |
          set -euo pipefail
          NEW_TD="$(aws ecs describe-task-definition --task-definition "$WORKER_FAMILY" \
            --query taskDefinition | jq --arg img "$IMAGE" --arg c "$WORKER_CONTAINER" '
              .containerDefinitions |= map(if .name==$c then .image=$img else . end)
              | del(.taskDefinitionArn,.revision,.status,.requiresAttributes,.compatibilities,.registeredAt,.registeredBy,.deregisteredAt)')"
          WORKER_ARN="$(aws ecs register-task-definition --cli-input-json "$NEW_TD" \
            --query taskDefinition.taskDefinitionArn --output text)"
          aws ecs update-service --cluster "$CLUSTER" --service "$WORKER_SERVICE" \
            --task-definition "$WORKER_ARN" \
            --desired-count 1 >/dev/null
          aws ecs wait services-stable --cluster "$CLUSTER" --services "$WORKER_SERVICE"
          for attempt in {1..24}; do
            SVC="$(aws ecs describe-services --cluster "$CLUSTER" --services "$WORKER_SERVICE")"
            RS="$(jq -r '[.services[0].deployments[] | select(.status=="PRIMARY") | .rolloutState][0] // ""' <<<"$SVC")"
            LIVE_TD="$(jq -r '[.services[0].deployments[] | select(.status=="PRIMARY") | .taskDefinition][0] // ""' <<<"$SVC")"
            if [ "$RS" = "COMPLETED" ] && [ "$LIVE_TD" = "$WORKER_ARN" ]; then
              exit 0
            fi
            echo "waiting for worker primary rollout completion (attempt ${attempt}/24, state=${RS}, taskDefinition=${LIVE_TD})"
            sleep 5
          done
          echo "::error::worker deployment did not complete cleanly"; exit 1

      # Asserts only `.ok`, the one field of /health that is part of the
      # endpoint's contract. `service` and `mode` are deliberately NOT asserted:
      # `service` is churning with the product rename, and `mode` is being
      # removed outright -- there is one deployment story, you run it.
      - name: Smoke health endpoint
        env:
          HEALTH_URL: ${{ steps.m.outputs.health_url }}
        run: |
          set -euo pipefail
          curl -fsS "$HEALTH_URL" | jq -e '.ok == true'

  # Provision-or-verify the CLIENT API key for this app (hasna/apps#1595).
  #
  # A deploy that leaves a running, routed service nobody can call is not a
  # finished deploy -- that is exactly what happened to messages-prod, and
  # projects/knowledge shipped keys the origin had already revoked while
  # Secrets Manager still held the dead value. This job reads
  # hasna/oss/skills/api-key, proves it still authenticates against the freshly
  # deployed origin with a two-sided probe, and mints one when it is absent or
  # refused.
  #
  # Deliberately a job AFTER `deploy`, not a step inside it: the rollout is
  # already complete and healthy when this runs, so a key that cannot be minted
  # reports as its own failure instead of as a failed deployment, and never
  # executes while the deploy job is mutating the production service.
  provision_key:
    name: provision or verify the fleet client API key
    needs: [gate, deploy]
    if: ${{ needs.gate.outputs.proceed == 'true' }}
    uses: ./.github/workflows/fleet-key-provision.yml
    with:
      app: skills
      source_sha: ${{ needs.gate.outputs.source_sha }}
    secrets: inherit
    permissions:
      contents: read
      id-token: write
