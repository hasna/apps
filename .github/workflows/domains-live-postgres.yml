name: domains-live-postgres

on:
  pull_request:
    paths:
      - "apps/domains/**"
      - "tooling/deploy/domains/**"
      - ".github/workflows/deploy-domains.yml"
      - ".github/workflows/domains-live-postgres.yml"
      - "bun.lock"
      - "package.json"
  push:
    branches: [main]
    paths:
      - "apps/domains/**"
      - "tooling/deploy/domains/**"
      - ".github/workflows/deploy-domains.yml"
      - ".github/workflows/domains-live-postgres.yml"
      - "bun.lock"
      - "package.json"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: domains-live-postgres-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  provisioning-postgres:
    name: provisioning state machine on PostgreSQL 16
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: domains_provisioning_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d domains_provisioning_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      HASNA_DOMAINS_TEST_DATABASE_URL: postgres://postgres@127.0.0.1:5432/domains_provisioning_ci
    steps:
      - name: Checkout exact source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: Install frozen workspace
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Refuse any non-disposable database target
        run: >-
          bun -e 'const u=new URL(process.env.HASNA_DOMAINS_TEST_DATABASE_URL); if (u.protocol!=="postgres:" || u.hostname!=="127.0.0.1" || u.port!=="5432" || u.pathname!=="/domains_provisioning_ci" || u.username!=="postgres" || u.password || u.search || u.hash) throw new Error("refusing non-disposable Domains PostgreSQL target")'

      - name: Run migrations and provisioning concurrency proof
        working-directory: apps/domains
        run: bun run test:postgres
