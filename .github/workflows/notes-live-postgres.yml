name: notes live PostgreSQL

on:
  pull_request:
    paths:
      - 'apps/notes/**'
      - 'bun.lock'
      - '.github/workflows/notes-live-postgres.yml'
  push:
    branches: [main]
    paths:
      - 'apps/notes/**'
      - 'bun.lock'
      - '.github/workflows/notes-live-postgres.yml'

permissions:
  contents: read

jobs:
  installed-postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: notes_installed_ci
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 127.0.0.1:5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d notes_installed_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - name: Install declared producer tooling without lifecycle scripts
        run: bun install --frozen-lockfile --ignore-scripts --filter @hasna/notes
      - name: Fresh installed CLI, MCP, SDK and HTTP against owned PostgreSQL
        working-directory: apps/notes
        env:
          NOTES_TEST_DATABASE_URL: postgres://postgres@127.0.0.1:5432/notes_installed_ci
        run: bun scripts/test-installed-postgres.mjs "$RUNNER_TEMP/notes-installed-postgres"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: success()
        with:
          name: notes-installed-postgres
          path: |
            ${{ runner.temp }}/notes-installed-postgres/receipt.json
            ${{ runner.temp }}/notes-installed-postgres/installed-postgres-receipt.json
            ${{ runner.temp }}/notes-installed-postgres/pack.json
            ${{ runner.temp }}/notes-installed-postgres/consumer/package-lock.json
          if-no-files-found: error
  notes-live-postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: notes_ci
          # Disposable runner-local database; no production credentials or data.
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 127.0.0.1:5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d notes_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - name: Install frozen dependencies without lifecycle scripts
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Prove the PostgreSQL gate refuses missing configuration
        working-directory: apps/notes
        run: |
          set -euo pipefail
          set +e
          env -u NOTES_TEST_DATABASE_URL bun run test:pg > "$RUNNER_TEMP/notes-pg-negative.log" 2>&1
          result=$?
          set -e
          if [ "$result" -ne 2 ]; then
            echo "Missing-database control did not fail with the expected configuration status"
            exit 1
          fi
          grep -Fq 'NOTES_TEST_DATABASE_URL is not set' "$RUNNER_TEMP/notes-pg-negative.log"
      - name: Exercise Notes schema, authentication, and note round-trip
        working-directory: apps/notes
        env:
          NOTES_TEST_DATABASE_URL: postgres://postgres@127.0.0.1:5432/notes_ci
        run: |
          set -euo pipefail
          bun -e 'const u = new URL(process.env.NOTES_TEST_DATABASE_URL); if (u.protocol !== "postgres:" || u.hostname !== "127.0.0.1" || u.port !== "5432" || u.pathname !== "/notes_ci" || u.username !== "postgres" || u.password || u.search || u.hash) throw new Error("Refusing a non-isolated integration database");'
          # The dev-auth probe emits a disposable OTP. Keep its raw output out
          # of public CI logs; assert the result without echoing credentials.
          if ! bun run test:pg > "$RUNNER_TEMP/notes-live-postgres.log" 2>&1; then
            echo "Notes live PostgreSQL gate failed"
            exit 1
          fi
          grep -Fq '[pg-test-gate] PASS: 6 live PostgreSQL checks' "$RUNNER_TEMP/notes-live-postgres.log"
          echo "Notes live PostgreSQL gate passed all six checks"
