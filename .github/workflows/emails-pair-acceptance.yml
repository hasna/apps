name: emails-pair-acceptance
on:
  pull_request:
    paths:
      - 'apps/emails/**'
      - 'tooling/acceptance/emails/**'
      - '.github/workflows/emails-pair-acceptance.yml'
  push:
    branches: [main]
    paths:
      - 'apps/emails/**'
      - 'tooling/acceptance/emails/**'
      - '.github/workflows/emails-pair-acceptance.yml'
permissions:
  contents: read
jobs:
  isolated-pair:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - run: bun install --frozen-lockfile
      - name: Test admission and synthetic transports
        run: |
          python3 -B -m unittest discover -s tooling/acceptance/emails -p '*_test.py'
          bun --no-env-file --no-install test tooling/acceptance/emails/transports.test.ts
      - name: Build local fixture image and run actual API and worker
        run: python3 -B tooling/acceptance/emails/ci-smoke.py
      - name: Retain unsigned synthetic evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: emails-isolated-pair-proof
          path: emails-pair-proof/
          retention-days: 7
