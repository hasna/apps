name: emails-search-promotion-execute
on:
  workflow_call:
    inputs:
      phase: {type: string, required: true}
      source: {type: string, required: true}
      prepared_run_id: {type: string, required: true}
      prepared_sha256: {type: string, required: true}
      reconciliation_run_id: {type: string, required: false, default: ""}
      reconciled_sha256: {type: string, required: false, default: ""}
permissions:
  contents: read
jobs:
  execute:
    if: ${{ github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: production
    permissions:
      contents: read
      actions: read
      id-token: write
    env:
      AWS_REGION: us-east-1
      ECR_REPOSITORY: mailery
      ECR_URL: "789877399345.dkr.ecr.us-east-1.amazonaws.com/mailery"
      LOCAL_IMAGE: emails-current-server
      PUBLIC_BASE_URL: https://api.hasna.com/emails
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ inputs.source }}
          fetch-depth: 0
          persist-credentials: false

      - name: Recheck gates after environment approval and download exact reviewed plan
        if: ${{ inputs.phase != 'current' }}
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE: ${{ inputs.source }}
          PHASE: ${{ inputs.phase }}
          PREPARED_RUN: ${{ inputs.prepared_run_id }}
          PREPARED_SHA: ${{ inputs.prepared_sha256 }}
        run: python3 -I -B tooling/deploy/emails-search/gate.py --source "$SOURCE" --phase "$PHASE" --run "$PREPARED_RUN" --prepared-sha256 "$PREPARED_SHA" --download "$RUNNER_TEMP/emails-reviewed-plan"

      - name: Recheck exact main and download reviewed reconciliation
        if: ${{ inputs.phase == 'current' }}
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE: ${{ inputs.source }}
          RECONCILIATION_RUN: ${{ inputs.reconciliation_run_id }}
          RECONCILED_SHA256: ${{ inputs.reconciled_sha256 }}
        run: |
          set -Eeuo pipefail
          python3 -I -B tooling/deploy/emails-current/gate.py \
            --source "$SOURCE" \
            --run "$RECONCILIATION_RUN" \
            --reconciled-sha256 "$RECONCILED_SHA256" \
            --download "$RUNNER_TEMP/emails-reconciled"
          # The full migration definition is byte-identical to the source used
          # by the reconciled live overlay. No database mutation is hidden here.
          overlay_source="$(jq -er .sourceCommit tooling/deploy/emails-search/recipe.json)"
          [[ "$overlay_source" =~ ^[0-9a-f]{40}$ ]]
          git diff --exit-code "$overlay_source" "$SOURCE" -- apps/emails/src/server/self-hosted/migrations.ts
          printf 'SOURCE_SHA=%s\n' "$SOURCE" >> "$GITHUB_ENV"
          printf 'IMAGE_TAG=current-%s-%s-%s\n' "$SOURCE" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" >> "$GITHUB_ENV"

      - name: Verify promotion controls before AWS authority
        if: ${{ inputs.phase != 'current' }}
        run: |
          python3 -I -B tooling/deploy/emails-search/promotion_test.py
          python3 -I -B tooling/deploy/emails-search/aws_transport_test.py

      - name: Exercise the exact amd64 server image with isolated PostgreSQL
        if: ${{ inputs.phase == 'current' }}
        working-directory: apps/emails
        env:
          CONTAINER_RUNTIME_PLATFORM: linux/amd64
          CONTAINER_RUNTIME_IMAGE: emails-current-server:${{ inputs.source }}
          CONTAINER_RUNTIME_PATCHED_BASE_IMAGE: emails-current-patched-base:${{ inputs.source }}
          CONTAINER_RUNTIME_KEEP_IMAGE: "1"
        run: bash scripts/container-runtime-smoke.sh

      - name: Generate vulnerability report before AWS authority
        if: ${{ inputs.phase == 'current' }}
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          image-ref: emails-current-server:${{ inputs.source }}
          format: json
          output: ${{ runner.temp }}/emails-current-trivy.json
          scanners: vuln
          vuln-type: os,library
          severity: CRITICAL,HIGH
          ignore-unfixed: false
          exit-code: "0"

      - name: Enforce vulnerability gate
        if: ${{ inputs.phase == 'current' }}
        run: |
          set -Eeuo pipefail
          jq -e '
            ([.Results[]?.Vulnerabilities[]? | select(.Severity == "HIGH" or .Severity == "CRITICAL")] | length) == 0
          ' "$RUNNER_TEMP/emails-current-trivy.json" >/dev/null

      # This reusable workflow path is the IAM trust-bound sanctioned authority
      # for Emails production. Callers cannot assume the role from a new job.
      - name: Assume only the existing Emails producer role
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a
        with:
          role-to-assume: arn:aws:iam::789877399345:role/emails-prod-gha-deploy
          aws-region: us-east-1
          role-session-name: emails-search-${{ github.run_id }}
          allowed-account-ids: "789877399345"
          mask-aws-account-id: true

      - name: Prepare image or promote exact reviewed task change
        if: ${{ inputs.phase != 'current' }}
        env:
          SOURCE: ${{ inputs.source }}
          PHASE: ${{ inputs.phase }}
          PREPARED_SHA: ${{ inputs.prepared_sha256 }}
        shell: bash
        run: |
          set -Eeuo pipefail
          # -I excludes ambient Python import paths. The entrypoint explicitly
          # admits only its checked-in sibling module by exact local path.
          python3 -I -B tooling/deploy/emails-search/promotion.py "$PHASE" --source "$SOURCE" --out "$RUNNER_TEMP/emails-promotion-receipts" --prepared "$RUNNER_TEMP/emails-reviewed-plan/prepared.json" --prepared-sha256 "$PREPARED_SHA"

      - name: Login to Amazon ECR for the current server
        if: ${{ inputs.phase == 'current' }}
        uses: aws-actions/amazon-ecr-login@d539f0932e70871a027e9d5a9d8fc38589180a64
        with:
          mask-password: true

      - name: Push immutable current image and resolve its registry digest
        if: ${{ inputs.phase == 'current' }}
        run: |
          set -Eeuo pipefail
          test "$(aws sts get-caller-identity --query Account --output text)" = "789877399345"
          remote_image="${ECR_URL}:${IMAGE_TAG}"
          if aws ecr describe-images --repository-name "$ECR_REPOSITORY" --image-ids "imageTag=${IMAGE_TAG}" >/dev/null 2>&1; then
            echo "immutable image tag already exists; refusing replay" >&2
            exit 1
          fi
          docker tag "${LOCAL_IMAGE}:${SOURCE_SHA}" "$remote_image"
          docker push "$remote_image" >/dev/null
          image_digest="$(aws ecr describe-images \
            --repository-name "$ECR_REPOSITORY" \
            --image-ids "imageTag=${IMAGE_TAG}" \
            --query 'imageDetails[0].imageDigest' --output text)"
          [[ "$image_digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          printf 'IMAGE_DIGEST=%s\n' "$image_digest" >> "$GITHUB_ENV"

      - name: Register and deploy an image-only clone of the reconciled task
        if: ${{ inputs.phase == 'current' }}
        env:
          RECONCILED_SHA256: ${{ inputs.reconciled_sha256 }}
        run: |
          set -Eeuo pipefail
          python3 -I -B tooling/deploy/emails-current/deploy.py \
            --source "$SOURCE_SHA" \
            --reconciled "$RUNNER_TEMP/emails-reconciled/reconciled.json" \
            --reconciled-sha256 "$RECONCILED_SHA256" \
            --image-digest "$IMAGE_DIGEST" \
            --out "$RUNNER_TEMP/emails-current-receipts"

      - name: Prove routed current OpenAPI, provider and reply authority
        if: ${{ inputs.phase == 'current' }}
        run: |
          set -Eeuo pipefail
          expected_version="$(jq -er .version apps/emails/package.json)"
          test "$PUBLIC_BASE_URL" = "https://api.hasna.com/emails"
          python3 -I -B tooling/deploy/emails-current/public_proof.py \
            --expected-version "$expected_version" \
            --out "$RUNNER_TEMP/emails-current-receipts/public-proof.json"

      - name: Retain metadata-only preparation and mutation receipts
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ${{ inputs.phase == 'current' && 'emails-current-deployed' || inputs.phase == 'prepare' && 'emails-search-prepared' || inputs.phase == 'reconcile' && 'emails-search-reconciled' || 'emails-search-promoted' }}
          path: |
            ${{ runner.temp }}/emails-promotion-receipts/*.json
            ${{ runner.temp }}/emails-current-receipts/*.json
          if-no-files-found: ignore
          retention-days: 30
