name: emails-search-promotion-execute
on:
  workflow_call:
    inputs:
      phase: {type: string, required: true}
      source: {type: string, required: true}
      prepared_run_id: {type: string, required: true}
      prepared_sha256: {type: string, required: true}
      reconciliation_run_id: {type: string, required: false, default: ""}
      reconciled_sha256: {type: string, required: false, default: ""}
      anchor_reconciliation_run_id: {type: string, required: false, default: ""}
      anchor_reconciled_sha256: {type: string, required: false, default: ""}
      failed_deploy_run_id_1: {type: string, required: false, default: ""}
      failed_deploy_run_id_2: {type: string, required: false, default: ""}
      migration_reconciliation_run_id: {type: string, required: false, default: ""}
      migration_reconciled_sha256: {type: string, required: false, default: ""}
      migration_plan_run_id: {type: string, required: false, default: ""}
      migration_plan_sha256: {type: string, required: false, default: ""}
permissions:
  contents: read
jobs:
  execute:
    if: ${{ github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    environment: production
    permissions:
      contents: read
      actions: read
      id-token: write
    env:
      AWS_REGION: us-east-1
      ECR_REPOSITORY: mailery
      ECR_URL: "789877399345.dkr.ecr.us-east-1.amazonaws.com/mailery"
      LOCAL_IMAGE: emails-current-server
      PUBLIC_BASE_URL: https://api.hasna.com/emails
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ inputs.source }}
          fetch-depth: 0
          persist-credentials: false

      - name: Install the pinned migration-input parser runtime
        if: ${{ inputs.phase == 'current' || startsWith(inputs.phase, 'migration_') }}
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.14"

      - name: Recheck gates after environment approval and download exact reviewed plan
        if: ${{ inputs.phase != 'current' && !startsWith(inputs.phase, 'migration_') }}
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE: ${{ inputs.source }}
          PHASE: ${{ inputs.phase }}
          PREPARED_RUN: ${{ inputs.prepared_run_id }}
          PREPARED_SHA: ${{ inputs.prepared_sha256 }}
        run: python3 -I -B tooling/deploy/emails-search/gate.py --source "$SOURCE" --phase "$PHASE" --run "$PREPARED_RUN" --prepared-sha256 "$PREPARED_SHA" --download "$RUNNER_TEMP/emails-reviewed-plan"

      - name: Recheck exact main and download reviewed reconciliation
        if: ${{ inputs.phase == 'current' }}
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE: ${{ inputs.source }}
          RECONCILIATION_RUN: ${{ inputs.reconciliation_run_id }}
          RECONCILED_SHA256: ${{ inputs.reconciled_sha256 }}
        run: |
          set -Eeuo pipefail
          python3 -I -B tooling/deploy/emails-current/gate.py \
            --source "$SOURCE" \
            --run "$RECONCILIATION_RUN" \
            --reconciled-sha256 "$RECONCILED_SHA256" \
            --download "$RUNNER_TEMP/emails-reconciled"
          # deploy.py compares actual immutable OCI migration inputs, including
          # dependency auth definitions, before any ECS register/update call.
          printf 'SOURCE_SHA=%s\n' "$SOURCE" >> "$GITHUB_ENV"
          printf 'IMAGE_TAG=current-%s-%s-%s\n' "$SOURCE" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" >> "$GITHUB_ENV"

      - name: Recheck exact-main migration evidence after environment approval
        if: ${{ startsWith(inputs.phase, 'migration_') }}
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE: ${{ inputs.source }}
          MIGRATION_PHASE: ${{ inputs.phase == 'migration_reconcile' && 'reconcile' || inputs.phase == 'migration_prepare' && 'prepare' || 'execute' }}
          ANCHOR_RUN: ${{ inputs.anchor_reconciliation_run_id }}
          ANCHOR_SHA: ${{ inputs.anchor_reconciled_sha256 }}
          FAILED_RUN_1: ${{ inputs.failed_deploy_run_id_1 }}
          FAILED_RUN_2: ${{ inputs.failed_deploy_run_id_2 }}
          MIGRATION_RECONCILIATION_RUN: ${{ inputs.migration_reconciliation_run_id }}
          MIGRATION_RECONCILED_SHA: ${{ inputs.migration_reconciled_sha256 }}
          PLAN_RUN: ${{ inputs.migration_plan_run_id }}
          PLAN_SHA: ${{ inputs.migration_plan_sha256 }}
        run: |
          set -Eeuo pipefail
          python3 -I -B tooling/deploy/emails-migration/gate.py \
            --phase "$MIGRATION_PHASE" \
            --source "$SOURCE" \
            --anchor-run "$ANCHOR_RUN" \
            --anchor-sha256 "$ANCHOR_SHA" \
            --failed-run "$FAILED_RUN_1" \
            --failed-run "$FAILED_RUN_2" \
            --migration-reconciliation-run "$MIGRATION_RECONCILIATION_RUN" \
            --migration-reconciled-sha256 "$MIGRATION_RECONCILED_SHA" \
            --plan-run "$PLAN_RUN" \
            --plan-sha256 "$PLAN_SHA" \
            --download "$RUNNER_TEMP/emails-migration-reviewed"
          if [ "$MIGRATION_PHASE" = prepare ]; then
            printf 'SOURCE_SHA=%s\n' "$SOURCE" >> "$GITHUB_ENV"
            printf 'IMAGE_TAG=migration-%s-%s-%s\n' "$SOURCE" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" >> "$GITHUB_ENV"
          fi

      - name: Verify migration deployment controls before AWS authority
        if: ${{ startsWith(inputs.phase, 'migration_') }}
        run: |
          python3 -I -B tooling/deploy/emails-migration/gate_test.py
          python3 -I -B tooling/deploy/emails-migration/deploy_test.py
          python3 -I -B tooling/deploy/emails-migration/task_receipt_test.py
          bun test tooling/ci/tests/standard/emails-migration-deploy.test.ts

      - name: Verify promotion controls before AWS authority
        if: ${{ inputs.phase != 'current' && !startsWith(inputs.phase, 'migration_') }}
        run: |
          python3 -I -B tooling/deploy/emails-search/promotion_test.py
          python3 -I -B tooling/deploy/emails-search/aws_transport_test.py

      - name: Exercise the exact amd64 server image with isolated PostgreSQL
        if: ${{ inputs.phase == 'current' || inputs.phase == 'migration_prepare' }}
        working-directory: apps/emails
        env:
          CONTAINER_RUNTIME_PLATFORM: linux/amd64
          CONTAINER_RUNTIME_IMAGE: emails-current-server:${{ inputs.source }}
          CONTAINER_RUNTIME_PATCHED_BASE_IMAGE: emails-current-patched-base:${{ inputs.source }}
          CONTAINER_RUNTIME_KEEP_IMAGE: "1"
        run: bash scripts/container-runtime-smoke.sh

      - name: Generate vulnerability report before AWS authority
        if: ${{ inputs.phase == 'current' || inputs.phase == 'migration_prepare' }}
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          image-ref: emails-current-server:${{ inputs.source }}
          format: json
          output: ${{ runner.temp }}/emails-current-trivy.json
          scanners: vuln
          vuln-type: os,library
          severity: CRITICAL,HIGH
          ignore-unfixed: false
          exit-code: "0"

      - name: Enforce vulnerability gate
        if: ${{ inputs.phase == 'current' || inputs.phase == 'migration_prepare' }}
        run: |
          set -Eeuo pipefail
          jq -e '
            ([.Results[]?.Vulnerabilities[]? | select(.Severity == "HIGH" or .Severity == "CRITICAL")] | length) == 0
          ' "$RUNNER_TEMP/emails-current-trivy.json" >/dev/null

      # This reusable workflow path is the IAM trust-bound sanctioned authority
      # for Emails production. Callers cannot assume the role from a new job.
      - name: Assume only the existing Emails producer role
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a
        with:
          role-to-assume: arn:aws:iam::789877399345:role/emails-prod-gha-deploy
          aws-region: us-east-1
          role-session-name: emails-search-${{ github.run_id }}
          mask-aws-account-id: true

      - name: Recheck exact main immediately before migration authority
        if: ${{ startsWith(inputs.phase, 'migration_') }}
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE: ${{ inputs.source }}
        run: test "$(gh api repos/hasna/apps/git/ref/heads/main --jq .object.sha)" = "$SOURCE"

      - name: Prepare image or promote exact reviewed task change
        if: ${{ inputs.phase != 'current' && !startsWith(inputs.phase, 'migration_') }}
        env:
          SOURCE: ${{ inputs.source }}
          PHASE: ${{ inputs.phase }}
          PREPARED_SHA: ${{ inputs.prepared_sha256 }}
        shell: bash
        run: |
          set -Eeuo pipefail
          # -I excludes ambient Python import paths. The entrypoint explicitly
          # admits only its checked-in sibling module by exact local path.
          python3 -I -B tooling/deploy/emails-search/promotion.py "$PHASE" --source "$SOURCE" --out "$RUNNER_TEMP/emails-promotion-receipts" --prepared "$RUNNER_TEMP/emails-reviewed-plan/prepared.json" --prepared-sha256 "$PREPARED_SHA"

      - name: Login to Amazon ECR for the current server
        if: ${{ inputs.phase == 'current' || inputs.phase == 'migration_prepare' }}
        uses: aws-actions/amazon-ecr-login@d539f0932e70871a027e9d5a9d8fc38589180a64
        with:
          mask-password: true

      - name: Push immutable current image and resolve its registry digest
        if: ${{ inputs.phase == 'current' || inputs.phase == 'migration_prepare' }}
        run: |
          set -Eeuo pipefail
          test "$(aws sts get-caller-identity --query Account --output text)" = "789877399345"
          remote_image="${ECR_URL}:${IMAGE_TAG}"
          if aws ecr describe-images --repository-name "$ECR_REPOSITORY" --image-ids "imageTag=${IMAGE_TAG}" >/dev/null 2>&1; then
            echo "immutable image tag already exists; refusing replay" >&2
            exit 1
          fi
          docker tag "${LOCAL_IMAGE}:${SOURCE_SHA}" "$remote_image"
          docker push "$remote_image" >/dev/null
          image_digest="$(aws ecr describe-images \
            --repository-name "$ECR_REPOSITORY" \
            --image-ids "imageTag=${IMAGE_TAG}" \
            --query 'imageDetails[0].imageDigest' --output text)"
          [[ "$image_digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          printf 'IMAGE_DIGEST=%s\n' "$image_digest" >> "$GITHUB_ENV"

      - name: Reconcile failed image-only deployments and expected migration drift
        if: ${{ inputs.phase == 'migration_reconcile' }}
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE: ${{ inputs.source }}
        run: |
          set -Eeuo pipefail
          python3 -I -B tooling/deploy/emails-migration/deploy.py reconcile \
            --source "$SOURCE" \
            --inputs "$RUNNER_TEMP/emails-migration-reviewed" \
            --out "$RUNNER_TEMP/emails-migration-receipts"

      - name: Register candidate without service update and capture production migration plan
        if: ${{ inputs.phase == 'migration_prepare' }}
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE: ${{ inputs.source }}
        run: |
          set -Eeuo pipefail
          python3 -I -B tooling/deploy/emails-migration/deploy.py prepare \
            --source "$SOURCE" \
            --inputs "$RUNNER_TEMP/emails-migration-reviewed" \
            --image-digest "$IMAGE_DIGEST" \
            --out "$RUNNER_TEMP/emails-migration-receipts"

      - name: Apply reviewed migration once and perform one roll-forward service update
        if: ${{ inputs.phase == 'migration_execute' }}
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE: ${{ inputs.source }}
        run: |
          set -Eeuo pipefail
          python3 -I -B tooling/deploy/emails-migration/deploy.py execute \
            --source "$SOURCE" \
            --inputs "$RUNNER_TEMP/emails-migration-reviewed" \
            --out "$RUNNER_TEMP/emails-migration-receipts"

      - name: Register and deploy an image-only clone of the reconciled task
        if: ${{ inputs.phase == 'current' }}
        env:
          RECONCILED_SHA256: ${{ inputs.reconciled_sha256 }}
        run: |
          set -Eeuo pipefail
          python3 -I -B tooling/deploy/emails-current/deploy.py \
            --source "$SOURCE_SHA" \
            --reconciled "$RUNNER_TEMP/emails-reconciled/reconciled.json" \
            --reconciled-sha256 "$RECONCILED_SHA256" \
            --image-digest "$IMAGE_DIGEST" \
            --out "$RUNNER_TEMP/emails-current-receipts"

      - name: Prove routed current OpenAPI, provider and reply authority
        if: ${{ inputs.phase == 'current' }}
        run: |
          set -Eeuo pipefail
          expected_version="$(jq -er .version apps/emails/package.json)"
          test "$PUBLIC_BASE_URL" = "https://api.hasna.com/emails"
          python3 -I -B tooling/deploy/emails-current/public_proof.py \
            --expected-version "$expected_version" \
            --out "$RUNNER_TEMP/emails-current-receipts/public-proof.json"

      - name: Prove routed migration-aware current server
        if: ${{ inputs.phase == 'migration_execute' }}
        env:
          SOURCE: ${{ inputs.source }}
        run: |
          set -Eeuo pipefail
          expected_version="$(jq -er .version apps/emails/package.json)"
          test "$PUBLIC_BASE_URL" = "https://api.hasna.com/emails"
          python3 -I -B tooling/deploy/emails-current/public_proof.py \
            --expected-version "$expected_version" \
            --out "$RUNNER_TEMP/emails-migration-receipts/public-proof.json"

      - name: Finalize ledger, KMS, task, image and public reconciliation
        if: ${{ inputs.phase == 'migration_execute' }}
        env:
          SOURCE: ${{ inputs.source }}
        run: |
          set -Eeuo pipefail
          python3 -I -B tooling/deploy/emails-migration/deploy.py finalize \
            --source "$SOURCE" \
            --inputs "$RUNNER_TEMP/emails-migration-reviewed" \
            --execution "$RUNNER_TEMP/emails-migration-receipts" \
            --public-proof "$RUNNER_TEMP/emails-migration-receipts/public-proof.json" \
            --out "$RUNNER_TEMP/emails-migration-receipts"

      - name: Preserve roll-forward requirement after any post-migration proof failure
        if: ${{ always() && inputs.phase == 'migration_execute' }}
        env:
          SOURCE: ${{ inputs.source }}
        run: |
          python3 -I -B tooling/deploy/emails-migration/deploy.py mark-failure             --source "$SOURCE"             --inputs "$RUNNER_TEMP/emails-migration-reviewed"             --out "$RUNNER_TEMP/emails-migration-receipts"

      - name: Retain metadata-only search preparation and mutation receipts
        if: ${{ always() && inputs.phase != 'current' && !startsWith(inputs.phase, 'migration_') }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ${{ inputs.phase == 'prepare' && 'emails-search-prepared' || inputs.phase == 'reconcile' && 'emails-search-reconciled' || 'emails-search-promoted' }}
          path: ${{ runner.temp }}/emails-promotion-receipts/*.json
          if-no-files-found: ignore
          retention-days: 30

      - name: Retain reviewed migration reconciliation
        if: ${{ always() && inputs.phase == 'migration_reconcile' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: emails-current-migration-reconciled
          path: ${{ runner.temp }}/emails-migration-receipts/reconciled.json
          if-no-files-found: error
          retention-days: 30

      - name: Retain reviewed production migration plan
        if: ${{ always() && inputs.phase == 'migration_prepare' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: emails-current-migration-prepared
          path: ${{ runner.temp }}/emails-migration-receipts/prepared.json
          if-no-files-found: error
          retention-days: 30

      - name: Retain migration prepare mutation receipts
        if: ${{ always() && inputs.phase == 'migration_prepare' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: emails-current-migration-prepare-receipts
          path: ${{ runner.temp }}/emails-migration-receipts/*.json
          if-no-files-found: ignore
          retention-days: 30

      - name: Retain migration execution and roll-forward receipts
        if: ${{ always() && inputs.phase == 'migration_execute' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: emails-current-migration-executed
          path: ${{ runner.temp }}/emails-migration-receipts/*.json
          if-no-files-found: error
          retention-days: 30

      - name: Retain metadata-only current server deployment receipts
        if: ${{ always() && inputs.phase == 'current' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: emails-current-deployed
          path: ${{ runner.temp }}/emails-current-receipts/*.json
          if-no-files-found: ignore
          retention-days: 30
