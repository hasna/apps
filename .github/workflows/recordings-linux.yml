# Temporary diagnostic branch only: do not merge this workflow replacement.
# Reuses the registered path for an explicit dispatch at this branch ref.
# Default/release workflows and the required failed aggregate remain unchanged.
name: Emails shared-process diagnostic (temporary branch)
run-name: Emails shared-process capture / ${{ github.sha }}

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fixture:
    name: Emails shared-process capture diagnostic
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/diag/emails-enumeration-20260909'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        timeout-minutes: 2
        with:
          persist-credentials: false
          path: diagnostic
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        timeout-minutes: 2
        with:
          ref: a82cbcad7f8c62b71f797416a52c51bde8321aa7
          persist-credentials: false
          path: fixture
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        timeout-minutes: 2
        with:
          bun-version: 1.3.14
      - name: Install the original npm artifact-check toolchain
        timeout-minutes: 2
        run: |
          set -euo pipefail
          npm_prefix="$(mktemp -d "${RUNNER_TEMP}/npm-toolchain.XXXXXX")"
          npm install --global --prefix "$npm_prefix" npm@11.19.0 --ignore-scripts
          test "$("$npm_prefix/bin/npm" --version)" = "11.19.0"
          echo "$npm_prefix/bin" >> "$GITHUB_PATH"
      - name: Install frozen dependencies without lifecycle hooks
        timeout-minutes: 5
        working-directory: fixture
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Verify the pinned imported workspace artifacts exist
        timeout-minutes: 1
        working-directory: fixture
        run: |
          test -f apps/contracts/dist/client/transport.js
          test -f apps/contracts/dist/client/storage.js
          test -f apps/events/dist/index.js
      - name: Allocate numerical report storage
        id: reports
        timeout-minutes: 1
        run: |
          report_root="$(mktemp -d "${RUNNER_TEMP}/emails-enumeration.XXXXXX")"
          echo "root=$report_root" >> "$GITHUB_OUTPUT"
      - name: Run the shared Emails process with only target-fixture capture
        timeout-minutes: 9
        env:
          REPORT_ROOT: ${{ steps.reports.outputs.root }}
        run: |
          set -euo pipefail
          # Dependencies were fetched before entering the network namespace.
          # The runner drops back to this user before any source/fixture work.
          sudo env -i PATH=/usr/sbin:/usr/bin:/sbin:/bin \
            unshare --net --pid --fork --kill-child --mount-proc \
            python3 "$GITHUB_WORKSPACE/diagnostic/tooling/ci/emails-enumeration-diagnostic.py" \
            --source "$GITHUB_WORKSPACE/fixture" --reports "$REPORT_ROOT" \
            --bun "$(command -v bun)" --curl "$(command -v curl)" \
            --uid "$(id -u)" --gid "$(id -g)" \
            --shared-order "$GITHUB_WORKSPACE/diagnostic/tooling/ci/emails-enumeration-shared-order.json" \
            --node "$(command -v node)" --npm "$(command -v npm)" \
            --image-version "${ImageVersion:-unrecorded}"
      - name: Upload only allowlisted counts, hashes and identities
        if: always() && steps.reports.outputs.root != ''
        timeout-minutes: 1
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: emails-enumeration-numeric-${{ github.run_id }}
          path: ${{ steps.reports.outputs.root }}/result.json
          if-no-files-found: error
          retention-days: 7
