name: emails-search-promotion

# A bounded compatibility overlay; this does not rebuild/publish @hasna/emails.
# Prepare pushes an immutable image and emits a metadata-only plan. An operator
# reviews that plan, then dispatches promote with its exact run and file digest.
on:
  workflow_dispatch:
    inputs:
      recipe:
        type: choice
        options: [search-capacity, delivery-headers]
        default: search-capacity
        required: true
      phase:
        type: choice
        options: [prepare, reconcile, promote, rollback]
        default: prepare
        required: true
      prepared_run_id:
        type: string
        default: ""
        description: Successful preparation run, required for reconciliation, promotion, or rollback
      prepared_sha256:
        type: string
        default: ""
        description: Independently reviewed SHA256 of prepared.json
permissions:
  contents: read
concurrency:
  group: emails-search-production
  cancel-in-progress: false
jobs:
  gate:
    if: ${{ github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify exact main CI and reviewed preparation
        env:
          GH_TOKEN: ${{ github.token }}
          PHASE: ${{ inputs.phase }}
          RECIPE: ${{ inputs.recipe }}
          PREPARED_RUN: ${{ inputs.prepared_run_id }}
          PREPARED_SHA: ${{ inputs.prepared_sha256 }}
        run: python3 -I -B tooling/deploy/emails-search/gate.py --recipe "$RECIPE" --source "$GITHUB_SHA" --phase "$PHASE" --run "$PREPARED_RUN" --prepared-sha256 "$PREPARED_SHA"
  execute:
    needs: gate
    permissions:
      contents: read
      actions: read
      id-token: write
    uses: ./.github/workflows/emails-search-promotion-execute.yml
    with:
      recipe: ${{ inputs.recipe }}
      phase: ${{ inputs.phase }}
      source: ${{ github.sha }}
      prepared_run_id: ${{ inputs.prepared_run_id }}
      prepared_sha256: ${{ inputs.prepared_sha256 }}
