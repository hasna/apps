name: messages live PostgreSQL

on:
  pull_request:
    paths:
      - 'apps/messages/**'
      - 'apps/contracts/**'
      - 'bun.lock'
      - '.github/workflows/messages-live-postgres.yml'
  push:
    branches: [main]
    paths:
      - 'apps/messages/**'
      - 'apps/contracts/**'
      - 'bun.lock'
      - '.github/workflows/messages-live-postgres.yml'

permissions:
  contents: read

jobs:
  messages-live-postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: messages_test
          POSTGRES_DB: messages_test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U messages_test -d messages_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14
      - name: Install frozen dependencies without lifecycle scripts
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Exercise every required PostgreSQL suite without skips
        working-directory: apps/messages
        env:
          MESSAGES_TEST_DATABASE_URL: postgres://messages_test@127.0.0.1:5432/messages_test
        run: |
          bun run test:postgres
          bun test src/discovery.test.ts
