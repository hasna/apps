name: emails-current-server-deploy

# Manual, exact-main deployment of the complete current Emails server image.
# It is intentionally separate from npm release #2373 and from the historical
# three-file compatibility overlays. A successful read-only reconciliation is
# mandatory and is rechecked after entering the production environment.
on:
  workflow_dispatch:
    inputs:
      reconciliation_run_id:
        type: string
        required: true
        description: Successful exact-main emails-search reconcile run
      reconciled_sha256:
        type: string
        required: true
        description: Independently reviewed SHA256 of reconciled.json

concurrency:
  # Share the lock with the historical overlay lane: neither workflow may read
  # and then mutate the same ECS service while the other is in flight.
  group: emails-search-production
  cancel-in-progress: false

permissions:
  contents: read

env:
  AWS_REGION: us-east-1
  AWS_ACCOUNT_ID: "789877399345"
  ECR_REPOSITORY: mailery
  ECR_URL: "789877399345.dkr.ecr.us-east-1.amazonaws.com/mailery"
  LOCAL_IMAGE: emails-current-server
  PUBLIC_BASE_URL: https://api.hasna.com/emails

jobs:
  gate:
    name: gate (exact main CI + immutable reconciliation)
    if: ${{ github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify exact main CI and reviewed reconciled.json
        env:
          GH_TOKEN: ${{ github.token }}
          RECONCILIATION_RUN: ${{ inputs.reconciliation_run_id }}
          RECONCILED_SHA256: ${{ inputs.reconciled_sha256 }}
        run: >-
          python3 -I -B tooling/deploy/emails-current/gate.py
          --source "$GITHUB_SHA"
          --run "$RECONCILIATION_RUN"
          --reconciled-sha256 "$RECONCILED_SHA256"

  deploy:
    name: smoke + push + clone task + live proof
    needs: gate
    runs-on: ubuntu-24.04
    environment: production
    timeout-minutes: 60
    permissions:
      contents: read
      actions: read
      id-token: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Recheck exact main and download reviewed reconciliation
        env:
          GH_TOKEN: ${{ github.token }}
          RECONCILIATION_RUN: ${{ inputs.reconciliation_run_id }}
          RECONCILED_SHA256: ${{ inputs.reconciled_sha256 }}
        run: |
          set -Eeuo pipefail
          python3 -I -B tooling/deploy/emails-current/gate.py \
            --source "$GITHUB_SHA" \
            --run "$RECONCILIATION_RUN" \
            --reconciled-sha256 "$RECONCILED_SHA256" \
            --download "$RUNNER_TEMP/emails-reconciled"
          # No schema mutation is hidden in this rollout. The complete migration
          # definition is byte-identical to the source used by the reviewed live
          # compatibility image, so replacing the server image needs no migrator.
          overlay_source="$(jq -er .sourceCommit tooling/deploy/emails-search/recipe.json)"
          [[ "$overlay_source" =~ ^[0-9a-f]{40}$ ]]
          git diff --exit-code "$overlay_source" "$GITHUB_SHA" -- apps/emails/src/server/self-hosted/migrations.ts
          printf 'SOURCE_SHA=%s\n' "$GITHUB_SHA" >> "$GITHUB_ENV"
          printf 'IMAGE_TAG=current-%s-%s-%s\n' "$GITHUB_SHA" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" >> "$GITHUB_ENV"

      - name: Exercise the exact amd64 server image with isolated PostgreSQL
        working-directory: apps/emails
        env:
          CONTAINER_RUNTIME_PLATFORM: linux/amd64
          CONTAINER_RUNTIME_IMAGE: emails-current-server:${{ github.sha }}
          CONTAINER_RUNTIME_PATCHED_BASE_IMAGE: emails-current-patched-base:${{ github.sha }}
          CONTAINER_RUNTIME_KEEP_IMAGE: "1"
        run: bash scripts/container-runtime-smoke.sh

      - name: Generate vulnerability report before AWS authority
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: emails-current-server:${{ github.sha }}
          format: json
          output: ${{ runner.temp }}/emails-current-trivy.json
          scanners: vuln
          vuln-type: os,library
          severity: CRITICAL,HIGH
          ignore-unfixed: false
          exit-code: "0"

      - name: Enforce vulnerability gate
        run: |
          set -Eeuo pipefail
          jq -e '
            ([.Results[]?.Vulnerabilities[]? | select(.Severity == "HIGH" or .Severity == "CRITICAL")] | length) == 0
          ' "$RUNNER_TEMP/emails-current-trivy.json" >/dev/null

      - name: Assume only the existing Emails producer role
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          role-to-assume: arn:aws:iam::789877399345:role/emails-prod-gha-deploy
          aws-region: us-east-1
          role-session-name: emails-current-${{ github.run_id }}
          allowed-account-ids: "789877399345"
          mask-aws-account-id: true

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@d539f0932e70871a027e9d5a9d8fc38589180a64 # v2
        with:
          mask-password: true

      - name: Push immutable current image and resolve its registry digest
        run: |
          set -Eeuo pipefail
          remote_image="${ECR_URL}:${IMAGE_TAG}"
          if aws ecr describe-images --repository-name "$ECR_REPOSITORY" --image-ids "imageTag=${IMAGE_TAG}" >/dev/null 2>&1; then
            echo "immutable image tag already exists; refusing replay" >&2
            exit 1
          fi
          docker tag "${LOCAL_IMAGE}:${SOURCE_SHA}" "$remote_image"
          docker push "$remote_image" >/dev/null
          image_digest="$(aws ecr describe-images \
            --repository-name "$ECR_REPOSITORY" \
            --image-ids "imageTag=${IMAGE_TAG}" \
            --query 'imageDetails[0].imageDigest' --output text)"
          [[ "$image_digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          printf 'IMAGE_DIGEST=%s\n' "$image_digest" >> "$GITHUB_ENV"

      - name: Register and deploy an image-only clone of the reconciled task
        env:
          RECONCILED_SHA256: ${{ inputs.reconciled_sha256 }}
        run: |
          set -Eeuo pipefail
          python3 -I -B tooling/deploy/emails-current/deploy.py \
            --source "$SOURCE_SHA" \
            --reconciled "$RUNNER_TEMP/emails-reconciled/reconciled.json" \
            --reconciled-sha256 "$RECONCILED_SHA256" \
            --image-digest "$IMAGE_DIGEST" \
            --out "$RUNNER_TEMP/emails-current-receipts"

      - name: Prove routed current OpenAPI, provider and reply authority
        run: |
          set -Eeuo pipefail
          expected_version="$(jq -er .version apps/emails/package.json)"
          test "$PUBLIC_BASE_URL" = "https://api.hasna.com/emails"
          python3 -I -B tooling/deploy/emails-current/public_proof.py \
            --expected-version "$expected_version" \
            --out "$RUNNER_TEMP/emails-current-receipts/public-proof.json"

      - name: Retain metadata-only deployment receipts
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: emails-current-deployed
          path: ${{ runner.temp }}/emails-current-receipts/*.json
          if-no-files-found: ignore
          retention-days: 30
