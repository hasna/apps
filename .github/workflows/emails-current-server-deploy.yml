name: emails-current-server-deploy

# Manual, exact-main deployment of the complete current Emails server image.
# It is intentionally separate from npm release #2373 and from the historical
# three-file compatibility overlays. A successful read-only reconciliation is
# mandatory and is rechecked after entering the production environment.
on:
  workflow_dispatch:
    inputs:
      reconciliation_run_id:
        type: string
        required: true
        description: Successful exact-main emails-search reconcile run
      reconciled_sha256:
        type: string
        required: true
        description: Independently reviewed SHA256 of reconciled.json

concurrency:
  # Share the lock with the historical overlay lane: neither workflow may read
  # and then mutate the same ECS service while the other is in flight.
  group: emails-search-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  gate:
    name: gate (exact main CI + immutable reconciliation)
    if: ${{ github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify exact main CI and reviewed reconciled.json
        env:
          GH_TOKEN: ${{ github.token }}
          RECONCILIATION_RUN: ${{ inputs.reconciliation_run_id }}
          RECONCILED_SHA256: ${{ inputs.reconciled_sha256 }}
        run: >-
          python3 -I -B tooling/deploy/emails-current/gate.py
          --source "$GITHUB_SHA"
          --run "$RECONCILIATION_RUN"
          --reconciled-sha256 "$RECONCILED_SHA256"

  execute:
    needs: gate
    permissions:
      contents: read
      actions: read
      id-token: write
    uses: ./.github/workflows/emails-search-promotion-execute.yml
    with:
      phase: current
      source: ${{ github.sha }}
      prepared_run_id: ""
      prepared_sha256: ""
      reconciliation_run_id: ${{ inputs.reconciliation_run_id }}
      reconciled_sha256: ${{ inputs.reconciled_sha256 }}
