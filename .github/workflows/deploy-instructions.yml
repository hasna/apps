name: deploy-instructions

# GitHub Actions discovers workflows only at the repository root. This lane
# builds apps/instructions from the exact main-branch commit, scans the image before
# AWS authentication, then resolves and verifies every production target from
# the package-owned SSM manifest before it can push, migrate, or update ECS.
#
# TRIGGERING — deployment never races the repository gates. A push to main does
# NOT start this lane directly; the `ci` workflow does, and only after it has
# already concluded successfully for that exact commit. `workflow_run` carries
# `head_sha`, so the deployed source is bound to the commit CI actually
# verified rather than to whatever main happens to point at when the deploy
# starts. `workflow_run` does not accept a `paths:` filter, so the
# member-scoping that `paths: [apps/instructions/**]` used to provide is enforced in
# the gate job below against DEPLOY_PATH_SCOPE — a push touching another member
# resolves proceed=false and the deploy job is skipped, never run and failed.
#
# The manual route is retained and is deliberately narrower than the automatic
# one: workflow_dispatch must be invoked on the main branch ref and always
# resolves to the exact current origin/main tip. A historical SHA cannot be
# deployed by hand, which is what the previous ancestor-of-main check allowed.
# Resolving to the tip is necessary and was not sufficient — the tip itself may
# never have passed ci, so a hand dispatch during or after red CI could deploy
# an unverified commit. The gate therefore asks the Actions API, with the
# workflow's own contents+actions read token, for a COMPLETED SUCCESSFUL ci PUSH
# run on main whose head_sha equals that freshly resolved tip, and refuses on
# zero or unreadable matches. Both routes now deploy only ci-passed commits.
#
# External prerequisite (not changed by this repository): the
# instructions-prod-gha-deploy role trust must admit
# repo:hasna/apps:environment:production. Until that trust is updated, OIDC
# fails before any AWS target read or mutation.

on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: deploy-instructions-production
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: us-east-1
  AWS_ACCOUNT_ID: "789877399345"
  DEPLOY_MANIFEST: /hasna/deploy/instructions
  EXPECTED_CLUSTER: oss-fleet-prod
  EXPECTED_SERVICE: instructions-prod
  EXPECTED_WEB_FAMILY: instructions-prod
  EXPECTED_ECR_REPOSITORY: instructions
  EXPECTED_MIGRATION_FAMILY: instructions-prod-migrate
  LOCAL_IMAGE: instructions-deploy-candidate
  # The workflow whose successful conclusion is the ONLY automatic entry point
  # into this lane. Must equal the `name:` of .github/workflows/ci.yml and the
  # single entry of on.workflow_run.workflows; the deploy gate cross-checks all
  # three so renaming ci.yml cannot silently detach the binding.
  REQUIRED_CI_WORKFLOW: ci
  # The ci workflow's file, used to address it exactly on the Actions API when
  # the manual route has to prove a ci success itself. Selecting by file path is
  # unambiguous where a name lookup is not; the run's own `name` and `path` are
  # then both re-checked against this pin and REQUIRED_CI_WORKFLOW.
  CI_WORKFLOW_FILE: ci.yml
  # Member scoping for this lane. Used as a real git pathspec by the gate job
  # because workflow_run cannot carry a paths: filter.
  DEPLOY_PATH_SCOPE: "apps/instructions/**"
  PUBLIC_BASE_URL: https://api.hasna.com/instructions
  CLIENT_KEY_SECRET_ID: hasna/oss/instructions/api-key
  EXPECTED_BACKUP_BUCKET: hasna-instructions-prod-backups-789877399345

jobs:
  gate:
    name: gate (successful ci for the exact main commit)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # The gate reads git history and the repository's own Actions run history,
    # and nothing else. It must never hold the OIDC token that the deploy job
    # needs, so it narrows the workflow permissions: `actions: read` is what
    # lets it ask whether ci actually passed for a commit, and `id-token` is
    # deliberately absent so this job can never assume an AWS role.
    permissions:
      contents: read
      actions: read
    # A failed, cancelled, non-push or non-main ci run must not open this lane.
    # Expressed as a job condition so an unrelated ci outcome SKIPS the lane
    # instead of reporting a red deployment for a deployment that never began.
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main') }}
    outputs:
      proceed: ${{ steps.resolve.outputs.proceed }}
      source_sha: ${{ steps.resolve.outputs.source_sha }}
    steps:
      - name: Checkout main history
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: main

      - name: Resolve the deployable commit
        id: resolve
        shell: bash
        env:
          # The workflow's own short-lived repository token, scoped by the job
          # permissions above to contents+actions read. No PAT, no secret.
          GH_TOKEN: ${{ github.token }}
          RUN_NAME: ${{ github.event.workflow_run.name }}
          RUN_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          RUN_EVENT: ${{ github.event.workflow_run.event }}
          RUN_BRANCH: ${{ github.event.workflow_run.head_branch }}
          RUN_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -Eeuo pipefail
          git fetch --no-tags --prune origin +refs/heads/main:refs/remotes/origin/main
          main_tip="$(git rev-parse refs/remotes/origin/main)"
          proceed=false
          source_sha=""

          case "${GITHUB_EVENT_NAME}" in
            workflow_run)
              [[ "${RUN_NAME}" == "${REQUIRED_CI_WORKFLOW}" ]] || { echo "upstream workflow is ${RUN_NAME}, not ${REQUIRED_CI_WORKFLOW}" >&2; exit 1; }
              [[ "${RUN_CONCLUSION}" == "success" ]] || { echo "upstream ci concluded ${RUN_CONCLUSION}, not success" >&2; exit 1; }
              [[ "${RUN_EVENT}" == "push" ]] || { echo "upstream ci ran for ${RUN_EVENT}, not push" >&2; exit 1; }
              [[ "${RUN_BRANCH}" == "main" ]] || { echo "upstream ci ran on ${RUN_BRANCH}, not main" >&2; exit 1; }
              [[ "${RUN_HEAD_SHA}" =~ ^[0-9a-f]{40}$ ]] || { echo "upstream ci head sha is not a full commit id" >&2; exit 1; }
              source_sha="${RUN_HEAD_SHA}"
              git merge-base --is-ancestor "${source_sha}^{commit}" refs/remotes/origin/main || { echo "ci commit ${source_sha} is no longer contained in origin/main" >&2; exit 1; }
              superseded="$(git rev-list -n 1 "${source_sha}..refs/remotes/origin/main" -- "${DEPLOY_PATH_SCOPE}")"
              parent="$(git rev-parse --verify --quiet "${source_sha}^1" || true)"
              if [[ -n "${superseded}" ]]; then
                echo "superseded: origin/main already carries a newer commit touching ${DEPLOY_PATH_SCOPE}; that commit's own ci run owns the deployment"
              elif [[ -z "${parent}" ]]; then
                proceed=true
              elif [[ -n "$(git diff --name-only "${parent}" "${source_sha}" -- "${DEPLOY_PATH_SCOPE}")" ]]; then
                proceed=true
              else
                echo "no change under ${DEPLOY_PATH_SCOPE} in ${source_sha}; this lane has nothing to deploy"
              fi
              ;;
            workflow_dispatch)
              [[ "${GITHUB_REF}" == "refs/heads/main" ]] || { echo "manual deploy is restricted to the main branch ref, received ${GITHUB_REF}" >&2; exit 1; }
              source_sha="${main_tip}"
              # A manual dispatch must not become a route around the repository
              # gates. The workflow_run arm above inherits a head_sha that ci
              # itself verified; workflow_dispatch inherits nothing, so the same
              # binding is PROVED here against the Actions API: the exact tip we
              # are about to deploy must already own a COMPLETED, SUCCESSFUL ci
              # PUSH run on main. A dispatch during red, in-flight, or absent ci
              # is refused rather than deployed.
              #
              # Fails closed on every path: a missing token, an HTTP or 404
              # failure (set -e), a body jq cannot reduce to a number, and a zero
              # count all exit non-zero. Nothing here can resolve proceed=true by
              # default.
              [[ -n "${GH_TOKEN:-}" ]] || { echo "manual deploy cannot verify ${REQUIRED_CI_WORKFLOW} without a repository token" >&2; exit 1; }
              gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/${CI_WORKFLOW_FILE}/runs?branch=main&event=push&status=completed&head_sha=${source_sha}&per_page=100" > "${RUNNER_TEMP}/ci-runs.json"
              ci_success_count="$(jq --arg sha "${source_sha}" --arg name "${REQUIRED_CI_WORKFLOW}" --arg path ".github/workflows/${CI_WORKFLOW_FILE}" '[.workflow_runs[]? | select(.name == $name and .path == $path and .head_sha == $sha and .head_branch == "main" and .event == "push" and .status == "completed" and .conclusion == "success")] | length' "${RUNNER_TEMP}/ci-runs.json")"
              [[ "${ci_success_count}" =~ ^[0-9]+$ ]] || { echo "the ${REQUIRED_CI_WORKFLOW} run query for ${source_sha} returned a body with no readable count" >&2; exit 1; }
              [[ "${ci_success_count}" -ge 1 ]] || { echo "manual deploy refused: no completed successful ${REQUIRED_CI_WORKFLOW} push run on main for the exact origin/main tip ${source_sha}" >&2; exit 1; }
              echo "manual deploy: ${ci_success_count} completed successful ${REQUIRED_CI_WORKFLOW} push run(s) bind ${source_sha}"
              proceed=true
              ;;
            *)
              echo "unsupported trigger ${GITHUB_EVENT_NAME}" >&2
              exit 1
              ;;
          esac

          [[ "${source_sha}" =~ ^[0-9a-f]{40}$ ]] || { echo "gate did not resolve a full source commit" >&2; exit 1; }
          {
            printf 'source_sha=%s\n' "${source_sha}"
            printf 'proceed=%s\n' "${proceed}"
          } >> "${GITHUB_OUTPUT}"

  deploy:
    name: build + scan + migrate + deploy
    needs: gate
    if: ${{ needs.gate.outputs.proceed == 'true' }}
    # The Instructions Dockerfile targets linux/arm64. Use a native ARM64
    # runner so the candidate can be executed locally before AWS authentication.
    runs-on: ubuntu-24.04-arm
    environment: production
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
        working-directory: apps/instructions

    steps:
      - name: Checkout exact source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ needs.gate.outputs.source_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify source is the gated ci-passed main commit
        env:
          GATED_SHA: ${{ needs.gate.outputs.source_sha }}
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "${GATED_SHA}"
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          main_tip="$(git rev-parse refs/remotes/origin/main)"
          git merge-base --is-ancestor "${GATED_SHA}^{commit}" refs/remotes/origin/main
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            [[ "${GITHUB_REF}" == "refs/heads/main" ]] || { echo "manual deploy is restricted to the main branch ref, received ${GITHUB_REF}" >&2; exit 1; }
            [[ "${GATED_SHA}" == "${main_tip}" ]] || { echo "manual deploy must target the exact current origin/main commit ${main_tip}, received ${GATED_SHA}" >&2; exit 1; }
          fi
          printf 'SOURCE_SHA=%s\n' "${GATED_SHA}" >> "${GITHUB_ENV}"
          printf 'IMAGE_TAG=deploy-%s-%s-%s\n' "${GATED_SHA}" "${GITHUB_RUN_ID}" "${GITHUB_RUN_ATTEMPT}" >> "${GITHUB_ENV}"

      - name: Set up host Bun for shipped-artefact verification
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      # Build the native ARM64 runner image and load it for local execution.
      - name: Build native ARM64 image locally
        run: |
          set -Eeuo pipefail
          docker buildx build \
            --platform linux/arm64 \
            --target runner \
            --load \
            --label "org.opencontainers.image.revision=${SOURCE_SHA}" \
            --label "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" \
            --tag "${LOCAL_IMAGE}:${SOURCE_SHA}" \
            .
          image_id="$(docker image inspect --format '{{.Id}}' "${LOCAL_IMAGE}:${SOURCE_SHA}")"
          [[ "${image_id}" =~ ^sha256:[0-9a-f]{64}$ ]]
          printf 'LOCAL_IMAGE_ID=%s\n' "${image_id}" >> "${GITHUB_ENV}"

      - name: Verify shipped runtime and package version
        run: |
          set -Eeuo pipefail
          expected_version="$(node -p 'require("./package.json").version')"
          runtime_bun="$(docker run --rm --entrypoint bun "${LOCAL_IMAGE}:${SOURCE_SHA}" --version)"
          test "${runtime_bun}" = "1.3.14"
          test "$(docker run --rm --entrypoint bun "${LOCAL_IMAGE}:${SOURCE_SHA}" dist/server/index.js --version)" = "${expected_version}"

      - name: Smoke exact image HTTP startup
        run: |
          set -Eeuo pipefail
          expected_version="$(node -p 'require("./package.json").version')"
          smoke_container="instructions-http-smoke-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          smoke_dir="${RUNNER_TEMP}/instructions-http-smoke"
          health_json="${smoke_dir}/health.json"
          version_json="${smoke_dir}/version.json"
          settled_health_json="${smoke_dir}/settled-health.json"
          mkdir -p "${smoke_dir}"
          chmod 700 "${smoke_dir}"
          cleanup_smoke() {
            docker rm --force "${smoke_container}" >/dev/null 2>&1 || true
          }
          trap cleanup_smoke EXIT
          docker run --detach \
            --name "${smoke_container}" \
            --publish 127.0.0.1::8080 \
            "${LOCAL_IMAGE}:${SOURCE_SHA}" >/dev/null
          smoke_port="$(docker port "${smoke_container}" 8080/tcp | awk -F: '$1 == "127.0.0.1" { print $NF; exit }')"
          [[ "${smoke_port}" =~ ^[0-9]+$ ]]
          smoke_url="http://127.0.0.1:${smoke_port}"
          smoke_started=false
          for attempt in $(seq 1 30); do
            if [[ "$(docker inspect --format '{{.State.Running}}' "${smoke_container}")" != "true" ]]; then
              docker logs "${smoke_container}" >&2 || true
              echo "exact Instructions image exited before serving HTTP" >&2
              exit 1
            fi
            if curl --fail --silent --show-error --max-time 2 \
              --output "${health_json}" "${smoke_url}/health"; then
              smoke_started=true
              break
            fi
            sleep 1
          done
          [[ "${smoke_started}" == "true" ]] || {
            docker logs "${smoke_container}" >&2 || true
            echo "exact Instructions image did not serve /health" >&2
            exit 1
          }
          jq -e --arg version "${expected_version}" '
            .status == "ok" and .version == $version and .name == "instructions"
          ' "${health_json}" >/dev/null
          curl --fail --silent --show-error --max-time 2 \
            --output "${version_json}" "${smoke_url}/version"
          jq -e --arg version "${expected_version}" '
            .status == "ok" and .version == $version and .name == "instructions"
          ' "${version_json}" >/dev/null
          sleep 3
          test "$(docker inspect --format '{{.State.Running}}' "${smoke_container}")" = "true"
          curl --fail --silent --show-error --max-time 2 \
            --output "${settled_health_json}" "${smoke_url}/health"
          jq -e --arg version "${expected_version}" '
            .status == "ok" and .version == $version and .name == "instructions"
          ' "${settled_health_json}" >/dev/null

      - name: Generate local vulnerability report
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.LOCAL_IMAGE }}:${{ needs.gate.outputs.source_sha }}
          format: json
          output: ${{ github.workspace }}/apps/instructions/trivy-local.json
          scanners: vuln
          vuln-type: os,library
          severity: CRITICAL,HIGH
          ignore-unfixed: false
          exit-code: "0"

      - name: Enforce local vulnerability gate
        id: local-scan
        run: |
          set -Eeuo pipefail
          critical="$(jq '[.Results[]?.Vulnerabilities[]? | select(.Severity == "CRITICAL")] | length' trivy-local.json)"
          high="$(jq '[.Results[]?.Vulnerabilities[]? | select(.Severity == "HIGH")] | length' trivy-local.json)"
          [[ "${critical}" =~ ^[0-9]+$ && "${high}" =~ ^[0-9]+$ ]]
          printf 'critical=%s\n' "${critical}" >> "${GITHUB_OUTPUT}"
          printf 'high=%s\n' "${high}" >> "${GITHUB_OUTPUT}"
          if (( critical > 0 || high > 0 )); then
            echo "local image scan rejected the candidate: critical=${critical}, high=${high}" >&2
            exit 1
          fi

      - name: Configure AWS credentials with GitHub OIDC
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          role-to-assume: arn:aws:iam::${{ env.AWS_ACCOUNT_ID }}:role/instructions-prod-gha-deploy
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: gha-deploy-instructions-${{ github.run_id }}
          role-duration-seconds: 3600
          mask-aws-account-id: true
          unset-current-credentials: true

      - name: Resolve manifest and fail closed on production target mismatch
        id: manifest
        run: |
          set -Eeuo pipefail
          actual_account="$(aws sts get-caller-identity --query Account --output text)"
          if [[ "${actual_account}" != "${AWS_ACCOUNT_ID}" ]]; then
            echo "AWS account mismatch: expected ${AWS_ACCOUNT_ID}, received ${actual_account}" >&2
            exit 1
          fi

          manifest="$(aws ssm get-parameter --name "${DEPLOY_MANIFEST}" --query Parameter.Value --output text)"
          get_string() { jq -er "$1 | strings | select(length > 0)" <<<"${manifest}"; }
          cluster="$(get_string '.cluster')"
          service="$(get_string '.service')"
          web_family="$(get_string '.web_task_family')"
          web_container="$(get_string '.web_container')"
          migration_family="$(get_string '.migration_task_family')"
          migration_container="$(get_string '.migration_container')"
          ecr_url="$(get_string '.ecr_repository_url')"
          assign_public_ip="$(get_string '.assign_public_ip')"
          health_url="$(get_string '.health_url')"
          subnets="$(jq -er '.subnets | arrays | select(length > 0) | join(",")' <<<"${manifest}")"
          security_groups="$(jq -er '.security_groups | arrays | select(length > 0) | join(",")' <<<"${manifest}")"

          expected_ecr_url="${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/${EXPECTED_ECR_REPOSITORY}"
          [[ "${cluster}" == "${EXPECTED_CLUSTER}" ]] || { echo "manifest cluster mismatch" >&2; exit 1; }
          [[ "${service}" == "${EXPECTED_SERVICE}" ]] || { echo "manifest service mismatch" >&2; exit 1; }
          [[ "${web_family}" == "${EXPECTED_WEB_FAMILY}" ]] || { echo "manifest web task family mismatch" >&2; exit 1; }
          [[ "${migration_family}" == "${EXPECTED_MIGRATION_FAMILY}" ]] || { echo "manifest migration family mismatch" >&2; exit 1; }
          [[ "${ecr_url}" == "${expected_ecr_url}" ]] || { echo "manifest ECR repository mismatch" >&2; exit 1; }
          [[ "${web_family}" =~ ^[A-Za-z0-9_-]+$ ]]
          [[ "${web_container}" =~ ^[A-Za-z0-9_-]+$ ]]
          [[ "${migration_container}" =~ ^[A-Za-z0-9_-]+$ ]]
          [[ "${assign_public_ip}" == "ENABLED" || "${assign_public_ip}" == "DISABLED" ]]
          [[ "${subnets}" =~ ^subnet-[0-9a-f]+(,subnet-[0-9a-f]+)*$ ]]
          [[ "${security_groups}" =~ ^sg-[0-9a-f]+(,sg-[0-9a-f]+)*$ ]]
          [[ "${health_url}" =~ ^https://[^[:space:]]+$ ]]

          {
            printf 'account=%s\n' "${actual_account}"
            printf 'cluster=%s\n' "${cluster}"
            printf 'service=%s\n' "${service}"
            printf 'web_family=%s\n' "${web_family}"
            printf 'web_container=%s\n' "${web_container}"
            printf 'migration_family=%s\n' "${migration_family}"
            printf 'migration_container=%s\n' "${migration_container}"
            printf 'ecr_url=%s\n' "${ecr_url}"
            printf 'assign_public_ip=%s\n' "${assign_public_ip}"
            printf 'subnets=%s\n' "${subnets}"
            printf 'security_groups=%s\n' "${security_groups}"
            printf 'health_url=%s\n' "${health_url}"
          } >> "${GITHUB_OUTPUT}"

      - name: Capture rollback anchor and verify live service authority
        id: before
        env:
          CLUSTER: ${{ steps.manifest.outputs.cluster }}
          SERVICE: ${{ steps.manifest.outputs.service }}
          WEB_FAMILY: ${{ steps.manifest.outputs.web_family }}
          WEB_CONTAINER: ${{ steps.manifest.outputs.web_container }}
        run: |
          set -Eeuo pipefail
          service_json="$(aws ecs describe-services --cluster "${CLUSTER}" --services "${SERVICE}" --output json)"
          jq -e '.failures | length == 0' <<<"${service_json}" >/dev/null
          jq -e '.services | length == 1' <<<"${service_json}" >/dev/null
          jq -e '.services[0].status == "ACTIVE" and .services[0].desiredCount > 0' <<<"${service_json}" >/dev/null
          previous_task_definition="$(jq -er '.services[0].taskDefinition' <<<"${service_json}")"
          [[ "${previous_task_definition}" == *":task-definition/${WEB_FAMILY}:"* ]]

          task_json="$(aws ecs describe-task-definition --task-definition "${previous_task_definition}" --output json)"
          [[ "$(jq --arg c "${WEB_CONTAINER}" '[.taskDefinition.containerDefinitions[] | select(.name == $c)] | length' <<<"${task_json}")" == "1" ]]
          previous_image="$(jq -er --arg c "${WEB_CONTAINER}" '.taskDefinition.containerDefinitions[] | select(.name == $c) | .image' <<<"${task_json}")"
          {
            printf 'previous_task_definition=%s\n' "${previous_task_definition}"
            printf 'previous_image=%s\n' "${previous_image}"
          } >> "${GITHUB_OUTPUT}"

      - name: Export and validate complete pre-migration domain archive
        id: data-before
        run: |
          set -Eeuo pipefail
          client_key="$(aws secretsmanager get-secret-value --secret-id "${CLIENT_KEY_SECRET_ID}" --query SecretString --output text)"
          [[ -n "${client_key}" && "${client_key}" != "None" ]] || { echo "Instructions client key is unavailable" >&2; exit 1; }
          echo "::add-mask::${client_key}"
          export HASNA_INSTRUCTIONS_API_KEY="${client_key}"
          archive_dir="${RUNNER_TEMP}/instructions-deploy-domain"
          mkdir -p "${archive_dir}"
          chmod 700 "${archive_dir}"
          pre_archive="${archive_dir}/instructions-domain-pre.tar.gz"
          pre_manifest="${archive_dir}/pre-domain-manifest.json"
          validate_domain_archive() {
            local archive_path="$1"
            local manifest_path="$2"
            local archive_members
            archive_members="$(tar -tzf "${archive_path}")"
            [[ "${archive_members}" == $'manifest.json\ndomain.json' ]] || {
              echo "Instructions domain archive contains unexpected members" >&2
              return 1
            }
            tar -xOzf "${archive_path}" manifest.json > "${manifest_path}.tmp"
            chmod 600 "${manifest_path}.tmp"
            mv "${manifest_path}.tmp" "${manifest_path}"
            jq -e '
              ["configs", "config_snapshots", "profiles", "profile_config_bindings", "profile_asset_bindings", "machines"] as $collections |
              .schema == "hasna.instructions.domain-archive/v2" and
              .version == "2.0.0" and
              .payload.path == "domain.json" and
              (.payload.sha256 | strings | test("^[0-9a-f]{64}$")) and
              (.payload.size_bytes | numbers | select(. > 0 and floor == .)) and
              .integrity.algorithm == "sha256" and
              .integrity.canonicalization == "hasna.instructions.logical-json/v1" and
              ((.integrity.counts | keys | sort) == ($collections | sort)) and
              ((.integrity.hashes | keys | sort) == ($collections | sort)) and
              (.integrity.counts | all(. as $count | ($count | type) == "number" and $count >= 0 and ($count | floor) == $count)) and
              (.integrity.hashes | all(. as $hash | ($hash | type) == "string" and ($hash | test("^[0-9a-f]{64}$")))) and
              (.integrity.domain_sha256 | strings | test("^[0-9a-f]{64}$"))
            ' "${manifest_path}" >/dev/null || {
              echo "Instructions domain archive manifest is not a complete v2 integrity manifest" >&2
              return 1
            }
          }

          max_capture_attempts=5
          previous_archive=""
          previous_manifest=""
          stable_archive=false
          for capture_attempt in $(seq 1 "${max_capture_attempts}"); do
            candidate_archive="${archive_dir}/instructions-domain-candidate-${capture_attempt}.tar.gz"
            candidate_manifest="${archive_dir}/candidate-domain-manifest-${capture_attempt}.json"
            rm -f "${candidate_archive}" "${candidate_manifest}"
            if ! docker run --rm \
              --user "$(id -u):$(id -g)" \
              -e HASNA_INSTRUCTIONS_API_KEY \
              -v "${archive_dir}:/archive" \
              --entrypoint sh \
              "${LOCAL_IMAGE}:${SOURCE_SHA}" \
              -c "set -eu; bun dist/cli/index.js export --output /archive/instructions-domain-candidate-${capture_attempt}.tar.gz; chmod 600 /archive/instructions-domain-candidate-${capture_attempt}.tar.gz"; then
              rm -f "${candidate_archive}" "${candidate_manifest}"
              if [[ -n "${previous_archive}" ]]; then rm -f "${previous_archive}" "${previous_manifest}"; fi
              previous_archive=""
              previous_manifest=""
              continue
            fi
            if ! validate_domain_archive "${candidate_archive}" "${candidate_manifest}"; then
              rm -f "${candidate_archive}" "${candidate_manifest}"
              if [[ -n "${previous_archive}" ]]; then rm -f "${previous_archive}" "${previous_manifest}"; fi
              previous_archive=""
              previous_manifest=""
              continue
            fi
            if [[ -n "${previous_manifest}" ]] && jq -e --slurpfile previous "${previous_manifest}" '
              .integrity == $previous[0].integrity
            ' "${candidate_manifest}" >/dev/null; then
              mv "${candidate_archive}" "${pre_archive}"
              mv "${candidate_manifest}" "${pre_manifest}"
              rm -f "${previous_archive}" "${previous_manifest}"
              stable_archive=true
              break
            fi
            if [[ -n "${previous_archive}" ]]; then rm -f "${previous_archive}" "${previous_manifest}"; fi
            previous_archive="${candidate_archive}"
            previous_manifest="${candidate_manifest}"
          done
          unset client_key HASNA_INSTRUCTIONS_API_KEY
          [[ "${stable_archive}" == "true" ]] || {
            if [[ -n "${previous_archive}" ]]; then rm -f "${previous_archive}" "${previous_manifest}"; fi
            rm -f "${pre_archive}" "${pre_manifest}"
            echo "Instructions failed to capture two consecutive identical valid archives after ${max_capture_attempts} attempts" >&2
            exit 1
          }
          [[ -f "${pre_archive}" && -f "${pre_manifest}" ]] || { echo "stable Instructions archive authority is unavailable" >&2; exit 1; }
          [[ "$(stat -c '%a' "${pre_archive}")" == "600" && "$(stat -c '%a' "${pre_manifest}")" == "600" ]] || {
            echo "stable Instructions archive permissions are not owner-only" >&2
            exit 1
          }
          validate_domain_archive "${pre_archive}" "${pre_manifest}"
          {
            printf 'archive=%s\n' "${pre_archive}"
            printf 'manifest=%s\n' "${pre_manifest}"
          } >> "${GITHUB_OUTPUT}"

      - name: Create immutable pre-deploy S3 backup
        id: backup
        env:
          PRE_DEPLOY_ARCHIVE: ${{ steps.data-before.outputs.archive }}
        run: |
          set -Eeuo pipefail
          aws s3api head-bucket --bucket "${EXPECTED_BACKUP_BUCKET}"
          [[ "$(aws s3api get-bucket-versioning --bucket "${EXPECTED_BACKUP_BUCKET}" --query Status --output text)" == "Enabled" ]]
          object_lock="$(aws s3api get-object-lock-configuration --bucket "${EXPECTED_BACKUP_BUCKET}" --output json)"
          jq -e '
            .ObjectLockConfiguration as $lock |
            $lock.Rule.DefaultRetention as $retention |
            $lock.ObjectLockEnabled == "Enabled" and
            $retention.Mode == "COMPLIANCE" and
            (
              (($retention | has("Days")) and ($retention | has("Years") | not) and ($retention.Days as $days | ($days | type) == "number" and $days > 0 and ($days | floor) == $days)) or
              (($retention | has("Years")) and ($retention | has("Days") | not) and ($retention.Years as $years | ($years | type) == "number" and $years > 0 and ($years | floor) == $years))
            )
          ' <<<"${object_lock}" >/dev/null || { echo "Instructions backup bucket Object Lock lacks a valid COMPLIANCE default retention period" >&2; exit 1; }
          public_block="$(aws s3api get-public-access-block --bucket "${EXPECTED_BACKUP_BUCKET}" --query PublicAccessBlockConfiguration --output json)"
          jq -e '.BlockPublicAcls == true and .IgnorePublicAcls == true and .BlockPublicPolicy == true and .RestrictPublicBuckets == true' <<<"${public_block}" >/dev/null
          encryption="$(aws s3api get-bucket-encryption --bucket "${EXPECTED_BACKUP_BUCKET}" --query 'ServerSideEncryptionConfiguration.Rules[0].ApplyServerSideEncryptionByDefault.SSEAlgorithm' --output text)"
          [[ "${encryption}" == "aws:kms" || "${encryption}" == "AES256" ]] || { echo "Instructions backup bucket encryption is not enabled" >&2; exit 1; }

          backup_dir="${RUNNER_TEMP}/instructions-deploy-domain"
          [[ "${PRE_DEPLOY_ARCHIVE}" == "${backup_dir}/instructions-domain-pre.tar.gz" ]] || { echo "pre-deploy archive authority mismatch" >&2; exit 1; }
          [[ -f "${PRE_DEPLOY_ARCHIVE}" && ! -L "${PRE_DEPLOY_ARCHIVE}" ]] || { echo "pre-deploy archive is unavailable" >&2; exit 1; }
          [[ "$(stat -c '%a' "${PRE_DEPLOY_ARCHIVE}")" == "600" ]] || { echo "pre-deploy archive permissions are not owner-only" >&2; exit 1; }
          backup_id="pre-deploy-${SOURCE_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          backup_json="${backup_dir}/s3-backup.json"
          verify_json="${backup_dir}/s3-verify.json"
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -e HASNA_INSTRUCTIONS_S3_BUCKET="${EXPECTED_BACKUP_BUCKET}" \
            -e HASNA_INSTRUCTIONS_AWS_REGION="${AWS_REGION}" \
            -e AWS_ACCESS_KEY_ID \
            -e AWS_SECRET_ACCESS_KEY \
            -e AWS_SESSION_TOKEN \
            -v "${backup_dir}:/backup" \
            --entrypoint bun \
            "${LOCAL_IMAGE}:${SOURCE_SHA}" \
            dist/cli/index.js storage backup push /backup/instructions-domain-pre.tar.gz \
              --id "${backup_id}" \
              --json > "${backup_json}"
          chmod 600 "${backup_json}"
          payload_version_id="$(jq -er '.payloadVersionId | strings | select(length > 0 and . != "null")' "${backup_json}")"
          manifest_version_id="$(jq -er '.manifestVersionId | strings | select(length > 0 and . != "null")' "${backup_json}")"
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -e HASNA_INSTRUCTIONS_S3_BUCKET="${EXPECTED_BACKUP_BUCKET}" \
            -e HASNA_INSTRUCTIONS_AWS_REGION="${AWS_REGION}" \
            -e AWS_ACCESS_KEY_ID \
            -e AWS_SECRET_ACCESS_KEY \
            -e AWS_SESSION_TOKEN \
            --entrypoint bun \
            "${LOCAL_IMAGE}:${SOURCE_SHA}" \
            dist/cli/index.js storage backup verify "${backup_id}" \
              --payload-version-id "${payload_version_id}" \
              --manifest-version-id "${manifest_version_id}" \
              --json > "${verify_json}"
          chmod 600 "${verify_json}"
          archive_sha256="$(sha256sum "${PRE_DEPLOY_ARCHIVE}" | awk '{print $1}')"
          archive_size="$(stat -c '%s' "${PRE_DEPLOY_ARCHIVE}")"
          jq -e --arg id "${backup_id}" --arg sha256 "${archive_sha256}" --argjson size_bytes "${archive_size}" '
            .status == "created" and .backupId == $id and .sha256 == $sha256 and .sizeBytes == $size_bytes and
            (.payloadVersionId | strings | length > 0) and (.manifestVersionId | strings | length > 0)
          ' "${backup_dir}/s3-backup.json" >/dev/null
          jq -e --arg id "${backup_id}" --arg sha256 "${archive_sha256}" --argjson size_bytes "${archive_size}" '
            .ok == true and .versionPinned == true and .backupId == $id and
            (.payloadKey | strings | length > 0) and (.manifestKey | strings | length > 0) and
            (.payloadVersionId | strings | length > 0) and (.manifestVersionId | strings | length > 0) and
            .sha256 == $sha256 and .sizeBytes == $size_bytes
          ' "${backup_dir}/s3-verify.json" >/dev/null
          backup_receipt="${backup_dir}/s3-backup-receipt.json"
          jq -n \
            --arg id "${backup_id}" \
            --slurpfile pushed "${backup_dir}/s3-backup.json" \
            --slurpfile verified "${backup_dir}/s3-verify.json" \
            '($pushed[0]) as $push | ($verified[0]) as $verify |
             if ($push.backupId == $id and $verify.backupId == $id and
                 $push.sha256 == $verify.sha256 and $push.sizeBytes == $verify.sizeBytes and
                 $push.payloadVersionId == $verify.payloadVersionId and
                 $push.manifestVersionId == $verify.manifestVersionId and
                 $verify.versionPinned == true)
             then {
               schema: "hasna.instructions.redacted-backup-receipt.v2",
               status: $push.status,
               backupId: $id,
               payloadKey: $verify.payloadKey,
               manifestKey: $verify.manifestKey,
               payloadVersionId: $verify.payloadVersionId,
               manifestVersionId: $verify.manifestVersionId,
               sha256: $push.sha256,
               sizeBytes: $push.sizeBytes
             }
             else error("backup receipts disagree") end' > "${backup_receipt}"
          chmod 600 "${backup_receipt}"
          jq -e '
            .schema == "hasna.instructions.redacted-backup-receipt.v2" and
            .status == "created" and
            (.payloadKey | strings | length > 0) and
            (.manifestKey | strings | length > 0) and
            (.payloadVersionId | strings | length > 0) and
            (.manifestVersionId | strings | length > 0) and
            (.sha256 | strings | test("^[0-9a-f]{64}$")) and
            (.sizeBytes | numbers) > 0
          ' "${backup_receipt}" >/dev/null || { echo "redacted backup receipt is invalid" >&2; exit 1; }
          payload_key="$(jq -er '.payloadKey' "${backup_receipt}")"
          manifest_key="$(jq -er '.manifestKey' "${backup_receipt}")"
          payload_version_id="$(jq -er '.payloadVersionId' "${backup_receipt}")"
          manifest_version_id="$(jq -er '.manifestVersionId' "${backup_receipt}")"
          verify_worm_object() {
            local object_label="$1"
            local object_key="$2"
            local object_version_id="$3"
            local head_object retain_until retain_until_epoch now_epoch
            head_object="$(aws s3api head-object \
              --bucket "${EXPECTED_BACKUP_BUCKET}" \
              --key "${object_key}" \
              --version-id "${object_version_id}" \
              --output json)"
            retain_until="$(jq -er '.ObjectLockRetainUntilDate | strings | select(length > 0)' <<<"${head_object}")" || {
              echo "${object_label} backup object lacks a retention deadline" >&2
              return 1
            }
            if ! retain_until_epoch="$(date -u --date="${retain_until}" +%s 2>/dev/null)"; then
              echo "${object_label} backup object has an invalid retention deadline" >&2
              return 1
            fi
            now_epoch="$(date -u +%s)"
            jq -e \
              --arg object_version_id "${object_version_id}" \
              --argjson now_epoch "${now_epoch}" \
              --argjson retain_until_epoch "${retain_until_epoch}" '
                (.VersionId == $object_version_id) and
                .ObjectLockMode == "COMPLIANCE" and
                (.ObjectLockRetainUntilDate | type == "string" and length > 0) and
                ($retain_until_epoch > $now_epoch)
              ' <<<"${head_object}" >/dev/null || {
                echo "${object_label} backup object is not protected by future COMPLIANCE retention" >&2
                return 1
              }
          }
          verify_worm_object "payload" "${payload_key}" "${payload_version_id}"
          verify_worm_object "manifest" "${manifest_key}" "${manifest_version_id}"
          versioned_payload="${backup_dir}/s3-versioned-payload"
          rm -f "${versioned_payload}"
          aws s3api get-object \
            --bucket "${EXPECTED_BACKUP_BUCKET}" \
            --key "${payload_key}" \
            --version-id "${payload_version_id}" \
            "${versioned_payload}" >/dev/null
          chmod 600 "${versioned_payload}"
          [[ "$(sha256sum "${versioned_payload}" | awk '{print $1}')" == "${archive_sha256}" ]] || { echo "exact retained payload digest mismatch" >&2; exit 1; }
          [[ "$(stat -c '%s' "${versioned_payload}")" == "${archive_size}" ]] || { echo "exact retained payload size mismatch" >&2; exit 1; }
          rm -f "${versioned_payload}"
          backup_sha256="$(jq -er '.sha256' "${backup_receipt}")"
          backup_size="$(jq -er '.sizeBytes' "${backup_receipt}")"
          {
            printf 'backup_id=%s\n' "${backup_id}"
            printf 'sha256=%s\n' "${backup_sha256}"
            printf 'size_bytes=%s\n' "${backup_size}"
            printf 'payload_version_id=%s\n' "${payload_version_id}"
            printf 'manifest_version_id=%s\n' "${manifest_version_id}"
            printf 'receipt=%s\n' "${backup_receipt}"
            printf 'verification=%s\n' "${backup_dir}/s3-verify.json"
          } >> "${GITHUB_OUTPUT}"

      - name: Verify immutable scan-on-push ECR repository
        run: |
          set -Eeuo pipefail
          repository="$(aws ecr describe-repositories --repository-names "${EXPECTED_ECR_REPOSITORY}" --output json)"
          [[ "$(jq -r '.repositories[0].repositoryName' <<<"${repository}")" == "${EXPECTED_ECR_REPOSITORY}" ]]
          [[ "$(jq -r '.repositories[0].repositoryUri' <<<"${repository}")" == "${{ steps.manifest.outputs.ecr_url }}" ]]
          [[ "$(jq -r '.repositories[0].imageTagMutability' <<<"${repository}")" == "IMMUTABLE" ]]
          [[ "$(jq -r '.repositories[0].imageScanningConfiguration.scanOnPush' <<<"${repository}")" == "true" ]]
          existing="$(aws ecr batch-get-image \
            --repository-name "${EXPECTED_ECR_REPOSITORY}" \
            --image-ids imageTag="${IMAGE_TAG}" \
            --query 'length(images)' --output text)"
          [[ "${existing}" == "0" ]] || { echo "immutable deployment tag already exists" >&2; exit 1; }

      - name: Login to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@d539f0932e70871a027e9d5a9d8fc38589180a64 # v2
        with:
          mask-password: true

      - name: Push scanned image and resolve immutable digest
        id: image
        env:
          ECR_URL: ${{ steps.manifest.outputs.ecr_url }}
        run: |
          set -Eeuo pipefail
          tagged_image="${ECR_URL}:${IMAGE_TAG}"
          docker tag "${LOCAL_IMAGE}:${SOURCE_SHA}" "${tagged_image}"
          docker push "${tagged_image}"

          remote_digest=""
          for _ in {1..12}; do
            remote_digest="$(aws ecr describe-images \
              --repository-name "${EXPECTED_ECR_REPOSITORY}" \
              --image-ids imageTag="${IMAGE_TAG}" \
              --query 'imageDetails[0].imageDigest' --output text 2>/dev/null || true)"
            [[ "${remote_digest}" =~ ^sha256:[0-9a-f]{64}$ ]] && break
            sleep 5
          done
          [[ "${remote_digest}" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "ECR did not return an immutable digest" >&2; exit 1; }
          printf 'tagged_image=%s\n' "${tagged_image}" >> "${GITHUB_OUTPUT}"
          printf 'digest=%s\n' "${remote_digest}" >> "${GITHUB_OUTPUT}"
          printf 'digest_image=%s@%s\n' "${ECR_URL}" "${remote_digest}" >> "${GITHUB_OUTPUT}"

      - name: Wait for ECR scan and enforce vulnerability gate
        id: ecr-scan
        env:
          DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          set -Eeuo pipefail
          scan_complete=false
          findings=''
          error_file="${RUNNER_TEMP}/instructions-ecr-scan-error.txt"
          for _ in {1..60}; do
            if response="$(aws ecr describe-image-scan-findings \
              --repository-name "${EXPECTED_ECR_REPOSITORY}" \
              --image-id imageDigest="${DIGEST}" \
              --query '{status:imageScanStatus.status,counts:imageScanFindings.findingSeverityCounts}' \
              --output json 2>"${error_file}")"; then
              status="$(jq -er '.status | strings | select(length > 0)' <<<"${response}")"
              case "${status}" in
                COMPLETE)
                  findings="$(jq -ce '.counts | if type == "object" then . else error("invalid counts") end' <<<"${response}")"
                  scan_complete=true
                  break
                  ;;
                IN_PROGRESS) ;;
                *) echo "ECR scan entered terminal status ${status}" >&2; exit 1 ;;
              esac
            else
              error_text="$(<"${error_file}")"
              [[ "${error_text}" == *ScanNotFoundException* ]] || { echo "ECR scan query failed" >&2; exit 1; }
            fi
            sleep 15
          done
          rm -f "${error_file}"
          [[ "${scan_complete}" == "true" ]] || { echo "ECR scan did not complete" >&2; exit 1; }
          critical="$(jq -er '(if has("CRITICAL") then .CRITICAL else 0 end) | numbers | select(. >= 0 and floor == .)' <<<"${findings}")"
          high="$(jq -er '(if has("HIGH") then .HIGH else 0 end) | numbers | select(. >= 0 and floor == .)' <<<"${findings}")"
          printf 'critical=%s\n' "${critical}" >> "${GITHUB_OUTPUT}"
          printf 'high=%s\n' "${high}" >> "${GITHUB_OUTPUT}"
          if (( critical > 0 || high > 0 )); then
            echo "ECR scan rejected the candidate: critical=${critical}, high=${high}" >&2
            exit 1
          fi

      - name: Run one-shot migration task on the digest
        id: migration
        env:
          IMAGE: ${{ steps.image.outputs.digest_image }}
          CLUSTER: ${{ steps.manifest.outputs.cluster }}
          MIGRATION_FAMILY: ${{ steps.manifest.outputs.migration_family }}
          MIGRATION_CONTAINER: ${{ steps.manifest.outputs.migration_container }}
          SUBNETS: ${{ steps.manifest.outputs.subnets }}
          SECURITY_GROUPS: ${{ steps.manifest.outputs.security_groups }}
          ASSIGN_PUBLIC_IP: ${{ steps.manifest.outputs.assign_public_ip }}
        run: |
          set -Eeuo pipefail
          task_definition="$(aws ecs describe-task-definition --task-definition "${MIGRATION_FAMILY}" --query taskDefinition --output json)"
          [[ "$(jq --arg c "${MIGRATION_CONTAINER}" '[.containerDefinitions[] | select(.name == $c)] | length' <<<"${task_definition}")" == "1" ]]
          replacement="$(jq --arg image "${IMAGE}" --arg c "${MIGRATION_CONTAINER}" '
            .containerDefinitions |= map(if .name == $c then .image = $image else . end)
            | del(.taskDefinitionArn,.revision,.status,.requiresAttributes,.compatibilities,.registeredAt,.registeredBy,.deregisteredAt)
          ' <<<"${task_definition}")"
          migration_task_definition="$(aws ecs register-task-definition --cli-input-json "${replacement}" --query taskDefinition.taskDefinitionArn --output text)"
          [[ "${migration_task_definition}" == *":task-definition/${MIGRATION_FAMILY}:"* ]]

          run_result="$(aws ecs run-task \
            --cluster "${CLUSTER}" \
            --task-definition "${migration_task_definition}" \
            --launch-type FARGATE \
            --count 1 \
            --started-by "gha-instructions-migrate-${GITHUB_RUN_ID}" \
            --network-configuration "awsvpcConfiguration={subnets=[${SUBNETS}],securityGroups=[${SECURITY_GROUPS}],assignPublicIp=${ASSIGN_PUBLIC_IP}}" \
            --output json)"
          jq -e '.failures | length == 0' <<<"${run_result}" >/dev/null
          migration_task="$(jq -er '.tasks[0].taskArn' <<<"${run_result}")"
          aws ecs wait tasks-stopped --cluster "${CLUSTER}" --tasks "${migration_task}"
          stopped="$(aws ecs describe-tasks --cluster "${CLUSTER}" --tasks "${migration_task}" --output json)"
          [[ "$(jq --arg c "${MIGRATION_CONTAINER}" '[.tasks[0].containers[] | select(.name == $c)] | length' <<<"${stopped}")" == "1" ]]
          exit_code="$(jq -r --arg c "${MIGRATION_CONTAINER}" '.tasks[0].containers[] | select(.name == $c) | .exitCode // "null"' <<<"${stopped}")"
          container_reason="$(jq -r --arg c "${MIGRATION_CONTAINER}" '.tasks[0].containers[] | select(.name == $c) | .reason // ""' <<<"${stopped}")"
          task_definition_arn="$(jq -r '.tasks[0].taskDefinitionArn // ""' <<<"${stopped}")"
          stop_code="$(jq -r '.tasks[0].stopCode // ""' <<<"${stopped}")"
          stopped_reason="$(jq -r '.tasks[0].stoppedReason // ""' <<<"${stopped}")"
          echo "migration taskArn=${migration_task} taskDefinition=${task_definition_arn} stopCode=${stop_code}"
          echo "migration container=${MIGRATION_CONTAINER} exitCode=${exit_code} containerReason=${container_reason:-none} stoppedReason=${stopped_reason:-none}"
          if [[ "${exit_code}" != "0" ]]; then
            log_group=""
            log_region=""
            log_stream=""
            if [[ -n "${task_definition_arn}" ]]; then
              stopped_task_definition="$(aws ecs describe-task-definition --task-definition "${task_definition_arn}" --query taskDefinition --output json)"
              log_driver="$(jq -r --arg c "${MIGRATION_CONTAINER}" '.containerDefinitions[] | select(.name == $c) | .logConfiguration.logDriver // ""' <<<"${stopped_task_definition}")"
              log_group="$(jq -r --arg c "${MIGRATION_CONTAINER}" '.containerDefinitions[] | select(.name == $c) | .logConfiguration.options["awslogs-group"] // ""' <<<"${stopped_task_definition}")"
              log_region="$(jq -r --arg c "${MIGRATION_CONTAINER}" '.containerDefinitions[] | select(.name == $c) | .logConfiguration.options["awslogs-region"] // ""' <<<"${stopped_task_definition}")"
              log_prefix="$(jq -r --arg c "${MIGRATION_CONTAINER}" '.containerDefinitions[] | select(.name == $c) | .logConfiguration.options["awslogs-stream-prefix"] // ""' <<<"${stopped_task_definition}")"
              task_id="${migration_task##*/}"
              if [[ "${log_driver}" == "awslogs" && -n "${log_prefix}" ]]; then
                log_stream="${log_prefix}/${MIGRATION_CONTAINER}/${task_id}"
              fi
            fi
            {
              echo "### Migration task failed"
              echo
              echo "- Task ARN: \`${migration_task}\`"
              echo "- Task definition: \`${task_definition_arn:-unknown}\`"
              echo "- Stop code: \`${stop_code:-unknown}\`"
              echo "- Container: \`${MIGRATION_CONTAINER}\`"
              echo "- Exit code: \`${exit_code}\`"
              echo "- Container reason: \`${container_reason:-none}\`"
              echo "- Stopped reason: \`${stopped_reason:-none}\`"
              echo "- Log group: \`${log_group:-unknown}\`"
              echo "- Log region: \`${log_region:-unknown}\`"
              echo "- Log stream: \`${log_stream:-unknown}\`"
              if [[ -n "${log_group}" && -n "${log_region}" && -n "${log_stream}" ]]; then
                echo
                echo "Retrieve the migration container evidence with an AWS identity allowed to read this log group:"
                echo
                echo "\`aws logs get-log-events --region ${log_region} --log-group-name ${log_group} --log-stream-name ${log_stream} --limit 100 --start-from-head --query 'events[].message' --output text | node scripts/ci/redact-log-lines.mjs\`"
              fi
            } >> "${GITHUB_STEP_SUMMARY}"
            echo "migration logGroup=${log_group:-unknown} logRegion=${log_region:-unknown} logStream=${log_stream:-unknown}"
            echo "::error::migration task did not exit 0 (exit=${exit_code}, containerReason=${container_reason:-none}, stoppedReason=${stopped_reason:-none}, logStream=${log_stream:-unknown})"
            exit 1
          fi
          {
            printf 'task_definition=%s\n' "${migration_task_definition}"
            printf 'task=%s\n' "${migration_task}"
            printf 'exit_code=%s\n' "${exit_code}"
          } >> "${GITHUB_OUTPUT}"

      - name: Register digest-pinned task definition and update service
        id: deploy
        env:
          IMAGE: ${{ steps.image.outputs.digest_image }}
          CLUSTER: ${{ steps.manifest.outputs.cluster }}
          SERVICE: ${{ steps.manifest.outputs.service }}
          WEB_FAMILY: ${{ steps.manifest.outputs.web_family }}
          WEB_CONTAINER: ${{ steps.manifest.outputs.web_container }}
          PREVIOUS_TASK_DEFINITION: ${{ steps.before.outputs.previous_task_definition }}
        run: |
          set -Eeuo pipefail
          live_task_definition="$(aws ecs describe-services --cluster "${CLUSTER}" --services "${SERVICE}" --query 'services[0].taskDefinition' --output text)"
          [[ "${live_task_definition}" == "${PREVIOUS_TASK_DEFINITION}" ]] || { echo "service changed after rollback anchor capture" >&2; exit 1; }
          task_definition="$(aws ecs describe-task-definition --task-definition "${PREVIOUS_TASK_DEFINITION}" --query taskDefinition --output json)"
          [[ "$(jq --arg c "${WEB_CONTAINER}" '[.containerDefinitions[] | select(.name == $c)] | length' <<<"${task_definition}")" == "1" ]]
          replacement="$(jq --arg image "${IMAGE}" --arg c "${WEB_CONTAINER}" '
            .containerDefinitions |= map(if .name == $c then .image = $image else . end)
            | del(.taskDefinitionArn,.revision,.status,.requiresAttributes,.compatibilities,.registeredAt,.registeredBy,.deregisteredAt)
          ' <<<"${task_definition}")"
          deployed_task_definition="$(aws ecs register-task-definition --cli-input-json "${replacement}" --query taskDefinition.taskDefinitionArn --output text)"
          [[ "${deployed_task_definition}" == *":task-definition/${WEB_FAMILY}:"* ]]
          printf 'deployed_task_definition=%s\n' "${deployed_task_definition}" >> "${GITHUB_OUTPUT}"
          printf 'service_mutated=true\n' >> "${GITHUB_OUTPUT}"
          aws ecs update-service \
            --cluster "${CLUSTER}" \
            --service "${SERVICE}" \
            --task-definition "${deployed_task_definition}" >/dev/null
          aws ecs wait services-stable --cluster "${CLUSTER}" --services "${SERVICE}"

      - name: Verify exact live task definition, digest, and health
        id: verify
        env:
          IMAGE: ${{ steps.image.outputs.digest_image }}
          CLUSTER: ${{ steps.manifest.outputs.cluster }}
          SERVICE: ${{ steps.manifest.outputs.service }}
          WEB_CONTAINER: ${{ steps.manifest.outputs.web_container }}
          HEALTH_URL: ${{ steps.manifest.outputs.health_url }}
          DEPLOYED_TASK_DEFINITION: ${{ steps.deploy.outputs.deployed_task_definition }}
          PRE_DEPLOY_MANIFEST: ${{ steps.data-before.outputs.manifest }}
        run: |
          set -Eeuo pipefail
          verified=false
          for _ in {1..30}; do
            service_json="$(aws ecs describe-services --cluster "${CLUSTER}" --services "${SERVICE}" --output json)"
            primary_count="$(jq '[.services[0].deployments[] | select(.status == "PRIMARY")] | length' <<<"${service_json}")"
            primary_task_definition="$(jq -r '.services[0].deployments[] | select(.status == "PRIMARY") | .taskDefinition' <<<"${service_json}")"
            rollout_state="$(jq -r '.services[0].deployments[] | select(.status == "PRIMARY") | .rolloutState // "UNKNOWN"' <<<"${service_json}")"
            running="$(jq -r '.services[0].runningCount' <<<"${service_json}")"
            desired="$(jq -r '.services[0].desiredCount' <<<"${service_json}")"
            if [[ "${primary_count}" == "1" && "${primary_task_definition}" == "${DEPLOYED_TASK_DEFINITION}" && "${rollout_state}" == "COMPLETED" && "${running}" == "${desired}" && "${desired}" -gt 0 ]]; then
              verified=true
              break
            fi
            sleep 10
          done
          [[ "${verified}" == "true" ]] || { echo "ECS did not converge on the deployed task definition" >&2; exit 1; }

          deployed_definition="$(aws ecs describe-task-definition --task-definition "${DEPLOYED_TASK_DEFINITION}" --output json)"
          deployed_image="$(jq -er --arg c "${WEB_CONTAINER}" '.taskDefinition.containerDefinitions[] | select(.name == $c) | .image' <<<"${deployed_definition}")"
          [[ "${deployed_image}" == "${IMAGE}" ]] || { echo "live task definition image digest mismatch" >&2; exit 1; }
          curl --fail --silent --show-error --retry 5 --retry-all-errors --max-time 15 "${HEALTH_URL}" >/dev/null
          ready_json="$(curl --fail --silent --show-error --retry 5 --retry-all-errors --max-time 15 "${PUBLIC_BASE_URL}/ready")"
          [[ "$(jq -r '.status' <<<"${ready_json}")" == "ready" ]]
          expected_version="$(node -p 'require("./package.json").version')"
          version_json="$(curl --fail --silent --show-error --retry 5 --retry-all-errors --max-time 15 "${PUBLIC_BASE_URL}/version")"
          [[ "$(jq -r '.version' <<<"${version_json}")" == "${expected_version}" ]]
          anonymous_status="$(curl --silent --show-error --max-time 15 --output /dev/null --write-out '%{http_code}' "${PUBLIC_BASE_URL}/v1/configs")"
          [[ "${anonymous_status}" == "401" || "${anonymous_status}" == "403" ]] || { echo "anonymous API request was not denied" >&2; exit 1; }

          client_key="$(aws secretsmanager get-secret-value --secret-id "${CLIENT_KEY_SECRET_ID}" --query SecretString --output text)"
          [[ -n "${client_key}" && "${client_key}" != "None" ]] || { echo "Instructions client key is unavailable" >&2; exit 1; }
          echo "::add-mask::${client_key}"
          export HASNA_INSTRUCTIONS_API_KEY="${client_key}"
          archive_dir="${RUNNER_TEMP}/instructions-deploy-domain"
          post_archive="${archive_dir}/instructions-domain-post.tar.gz"
          post_manifest="${archive_dir}/post-domain-manifest.json"
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -e HASNA_INSTRUCTIONS_API_KEY \
            -v "${archive_dir}:/archive" \
            --entrypoint sh \
            "${LOCAL_IMAGE}:${SOURCE_SHA}" \
            -c "set -eu; bun dist/cli/index.js export --output /archive/instructions-domain-post.tar.gz; chmod 600 /archive/instructions-domain-post.tar.gz"
          unset client_key HASNA_INSTRUCTIONS_API_KEY
          validate_domain_archive() {
            local archive_path="$1"
            local manifest_path="$2"
            local archive_members
            archive_members="$(tar -tzf "${archive_path}")"
            [[ "${archive_members}" == $'manifest.json\ndomain.json' ]] || {
              echo "Instructions domain archive contains unexpected members" >&2
              return 1
            }
            tar -xOzf "${archive_path}" manifest.json > "${manifest_path}.tmp"
            chmod 600 "${manifest_path}.tmp"
            mv "${manifest_path}.tmp" "${manifest_path}"
            jq -e '
              ["configs", "config_snapshots", "profiles", "profile_config_bindings", "profile_asset_bindings", "machines"] as $collections |
              .schema == "hasna.instructions.domain-archive/v2" and
              .version == "2.0.0" and
              .payload.path == "domain.json" and
              (.payload.sha256 | strings | test("^[0-9a-f]{64}$")) and
              (.payload.size_bytes | numbers | select(. > 0 and floor == .)) and
              .integrity.algorithm == "sha256" and
              .integrity.canonicalization == "hasna.instructions.logical-json/v1" and
              ((.integrity.counts | keys | sort) == ($collections | sort)) and
              ((.integrity.hashes | keys | sort) == ($collections | sort)) and
              (.integrity.counts | all(. as $count | ($count | type) == "number" and $count >= 0 and ($count | floor) == $count)) and
              (.integrity.hashes | all(. as $hash | ($hash | type) == "string" and ($hash | test("^[0-9a-f]{64}$")))) and
              (.integrity.domain_sha256 | strings | test("^[0-9a-f]{64}$"))
            ' "${manifest_path}" >/dev/null || {
              echo "Instructions domain archive manifest is not a complete v2 integrity manifest" >&2
              return 1
            }
          }
          validate_domain_archive "${post_archive}" "${post_manifest}"
          jq -e --slurpfile pre "${PRE_DEPLOY_MANIFEST}" '
            .integrity == $pre[0].integrity and
            .integrity.domain_sha256 == $pre[0].integrity.domain_sha256
          ' "${post_manifest}" >/dev/null || { echo "Instructions domain integrity changed during deployment" >&2; exit 1; }

          jq -n \
            --arg source_sha "${SOURCE_SHA}" \
            --arg image_tag "${IMAGE_TAG}" \
            --arg image_digest "${{ steps.image.outputs.digest }}" \
            --arg image "${IMAGE}" \
            --arg account "${{ steps.manifest.outputs.account }}" \
            --arg cluster "${CLUSTER}" \
            --arg service "${SERVICE}" \
            --arg previous_task_definition "${{ steps.before.outputs.previous_task_definition }}" \
            --arg previous_image "${{ steps.before.outputs.previous_image }}" \
            --arg backup_id "${{ steps.backup.outputs.backup_id }}" \
            --arg backup_sha256 "${{ steps.backup.outputs.sha256 }}" \
            --arg backup_size_bytes "${{ steps.backup.outputs.size_bytes }}" \
            --arg backup_payload_version_id "${{ steps.backup.outputs.payload_version_id }}" \
            --arg backup_manifest_version_id "${{ steps.backup.outputs.manifest_version_id }}" \
            --slurpfile pre_manifest "${PRE_DEPLOY_MANIFEST}" \
            --slurpfile post_manifest "${post_manifest}" \
            --arg migration_task_definition "${{ steps.migration.outputs.task_definition }}" \
            --arg migration_task "${{ steps.migration.outputs.task }}" \
            --arg deployed_task_definition "${DEPLOYED_TASK_DEFINITION}" \
            --arg deployed_image "${deployed_image}" \
            --arg health_url "${HEALTH_URL}" \
            --arg run_id "${GITHUB_RUN_ID}" \
            '{schema:"hasna.instructions.production_deploy.v1",source_sha:$source_sha,image_tag:$image_tag,image_digest:$image_digest,image:$image,account:$account,cluster:$cluster,service:$service,rollback:{task_definition:$previous_task_definition,image:$previous_image},backup:{id:$backup_id,sha256:$backup_sha256,size_bytes:($backup_size_bytes|tonumber),payload_version_id:$backup_payload_version_id,manifest_version_id:$backup_manifest_version_id},data_integrity:{policy:"exact_domain_integrity",pre:{counts:$pre_manifest[0].integrity.counts,integrity:$pre_manifest[0].integrity},post:{counts:$post_manifest[0].integrity.counts,integrity:$post_manifest[0].integrity}},migration:{task_definition:$migration_task_definition,task:$migration_task,exit_code:0},deployed:{task_definition:$deployed_task_definition,image:$deployed_image,health_url:$health_url},github_run_id:$run_id}' \
            > deploy-evidence.json

      - name: Restore rollback anchor after a failed service rollout
        if: ${{ failure() && steps.deploy.outputs.service_mutated == 'true' }}
        env:
          CLUSTER: ${{ steps.manifest.outputs.cluster }}
          SERVICE: ${{ steps.manifest.outputs.service }}
          PREVIOUS_TASK_DEFINITION: ${{ steps.before.outputs.previous_task_definition }}
        run: |
          set -Eeuo pipefail
          aws ecs update-service \
            --cluster "${CLUSTER}" \
            --service "${SERVICE}" \
            --task-definition "${PREVIOUS_TASK_DEFINITION}" >/dev/null
          aws ecs wait services-stable --cluster "${CLUSTER}" --services "${SERVICE}"
          live="$(aws ecs describe-services --cluster "${CLUSTER}" --services "${SERVICE}" --query 'services[0].taskDefinition' --output text)"
          [[ "${live}" == "${PREVIOUS_TASK_DEFINITION}" ]] || { echo "rollback did not restore the previous task definition" >&2; exit 1; }

      - name: Upload deployment evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: instructions-production-deploy-${{ github.run_id }}
          path: |
            apps/instructions/trivy-local.json
            apps/instructions/deploy-evidence.json
            ${{ steps.backup.outputs.receipt }}
            ${{ steps.backup.outputs.verification }}
          if-no-files-found: warn
          retention-days: 30

      - name: Publish deployment summary
        if: ${{ always() }}
        run: |
          set -Eeuo pipefail
          {
            echo "## Instructions production deployment"
            echo
            echo "- source SHA: \`${SOURCE_SHA:-unverified}\`"
            echo "- immutable tag: \`${IMAGE_TAG:-not-created}\`"
            echo "- image digest: \`${{ steps.image.outputs.digest || 'not-pushed' }}\`"
            echo "- local critical/high: \`${{ steps.local-scan.outputs.critical || 'not-run' }}/${{ steps.local-scan.outputs.high || 'not-run' }}\`"
            echo "- ECR critical/high: \`${{ steps.ecr-scan.outputs.critical || 'not-run' }}/${{ steps.ecr-scan.outputs.high || 'not-run' }}\`"
            echo "- S3 pre-deploy backup: \`${{ steps.backup.outputs.backup_id || 'not-created' }}\`"
            echo "- previous task definition: \`${{ steps.before.outputs.previous_task_definition || 'not-read' }}\`"
            echo "- deployed task definition: \`${{ steps.deploy.outputs.deployed_task_definition || 'not-deployed' }}\`"
          } >> "${GITHUB_STEP_SUMMARY}"

  # Provision-or-verify the CLIENT API key for this app (hasna/apps#1595).
  #
  # A deploy that leaves a running, routed service nobody can call is not a
  # finished deploy -- that is exactly what happened to messages-prod, and
  # projects/knowledge shipped keys the origin had already revoked while
  # Secrets Manager still held the dead value. This job reads
  # hasna/oss/instructions/api-key, proves it still authenticates against the freshly
  # deployed origin with a two-sided probe, and mints one when it is absent or
  # refused.
  #
  # Deliberately a job AFTER `deploy`, not a step inside it: the rollout is
  # already complete and healthy when this runs, so a key that cannot be minted
  # reports as its own failure instead of as a failed deployment, and never
  # executes while the deploy job is mutating the production service.
  provision_key:
    name: provision or verify the fleet client API key
    needs: [gate, deploy]
    if: ${{ needs.gate.outputs.proceed == 'true' }}
    uses: ./.github/workflows/fleet-key-provision.yml
    with:
      app: instructions
      source_sha: ${{ needs.gate.outputs.source_sha }}
    secrets: inherit
    permissions:
      contents: read
      id-token: write
