# CI — the gate set for the phase-0 skeleton of hasna/apps.
#
# Three jobs, split by what they NEED rather than by what they check:
#
#   gates         — no network beyond checkout. The checks that can refuse a
#                   pull request in seconds: secret scan (with its own
#                   two-sided self-test), name-conformance, and the
#                   contract-manifest placeholder.
#   build-test    — the affected build + test graph via turbo --affected.
#   publish-guard — internal-infra strings must never reach a published
#                   tarball. Real npm pack --dry-run per member; fails loudly
#                   when a pack cannot be parsed (never a vacuous pass).
#
# Every job is independent, so a red secret scan does not hide a red
# conformance run and the summary names which gate refused rather than "CI
# failed".
#
# INVERTED vs the platform: hasna-internal/platform CONSUMES @hasna/* and its
# fork gate forbids them in-tree. This repo PRODUCES public @hasna/* packages —
# the gates here are re-derived for a producer tree and must never be copied
# verbatim from the consumer repo.
name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  # ---------------------------------------------------------------------------------
  gates:
    name: gates (secrets, names, manifests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the secret scan diffs against a merge base; a shallow clone has none

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14 # in lockstep with package.json "packageManager"

      - name: Install
        run: bun install --frozen-lockfile

      # The scan runs its OWN two-sided self-test first and fails if the patterns
      # cannot fire — a scanner whose regexes are broken reports a clean tree, and
      # a clean tree is exactly what success looks like. It prints file, line and
      # pattern NAME, never a matched value: a scanner that echoes what it found
      # writes the credential into the CI log, which is the leak it exists to
      # prevent.
      - name: Secret scan self-test (prove it can fire AND stay silent)
        run: bun tooling/ci/check-secrets.ts --self-test

      - name: Secret scan (added lines in the diff)
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            bun tooling/ci/check-secrets.ts --base "origin/${{ github.base_ref }}"
          else
            bun tooling/ci/check-secrets.ts --base HEAD^
          fi

      # Name-conformance: every workspace member package.json name matches
      # @hasna/<kebab-case> and equals its directory. Self-test runs first and
      # separately, because a predicate that cannot fire reports a clean corpus,
      # and a clean corpus is what success looks like.
      - name: Name-conformance gate self-test
        run: bun tooling/ci/check-names.ts --self-test

      - name: Name-conformance gate (@hasna/* only, name == directory)
        run: bun tooling/ci/check-names.ts

      # PLACEHOLDER by design until the contracts lane defines the member
      # manifest schema (tier-0, founder-owned). Read tooling/ci/check-manifests.ts
      # before trusting anything from this job.
      - name: Contract-manifest gate (placeholder)
        run: bun tooling/ci/check-manifests.ts

  # ---------------------------------------------------------------------------------
  # test-suites: the versioning + standard-adherence suites, wired as a HARD gate.
  #   test:versioning — hermetic versioning-integrity suite (test/versioning): package
  #       identity/semver, pending changesets, version-without-changeset, workspace
  #       reference rewrites, changelog/runtime metadata, Bun quarantine coverage. The
  #       npm-parity lane is opt-in (VERSIONING_NPM_PARITY=1) and reads the public
  #       registry; CI runs the offline default, which skips it explicitly
  #       ([SKIP versioning] marker) instead of failing without network.
  #   test:standard — standard-adherence suite (tooling/ci/tests/standard): contracts
  #       conformance, publishConfig, four-surface, license, dist hygiene, each with a
  #       two-sided self-test and a measured exception registry.
  # Both suites intentionally FAIL on violations — that is the point of the job. There
  # is deliberately NO continue-on-error here; a red suite is a red PR.
  test-suites:
    name: test-suites (versioning + standard-adherence)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the versioning suite diffs package versions against a base ref

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14 # in lockstep with package.json "packageManager"

      - name: Install
        run: bun install --frozen-lockfile

      - name: Versioning integrity suite (offline default)
        run: bun run test:versioning

      - name: Standard-adherence suite
        run: bun run test:standard

  # ---------------------------------------------------------------------------------
  build-test:
    name: build + test (affected)
    runs-on: ubuntu-latest

    # apps/capacity's live PostgreSQL suite is a real gate in CI: with the URL
    # absent the test FAILS (never skips), so the service is part of this job,
    # not an optional extra. Same postgres:17-alpine image the capacity CI used
    # in its old repo (pinned digest); ACCOUNTS_TEST_POSTGRES_URL is the
    # variable apps/capacity/test/live-postgres-gate.ts reads.
    services:
      postgres:
        image: postgres:17-alpine@sha256:af194ccf3e2d7fe367012c7b88ce8b816c5c889b18a5b316799a1f0d7eac746a
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: capacity_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d capacity_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # turbo --affected needs the base to diff against

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install
        run: bun install --frozen-lockfile

      # Member test suites may drive a real browser (playwright chromium, e.g.
      # apps/browser). Provision the browser runtime from the MEMBER directory
      # so bun resolves the member's own playwright pin (the root may resolve a
      # different version whose browser build the member's tests reject).
      # google-chrome-stable is the system chrome that Bun's Linux WebView
      # backend drives over CDP — without it, WebView-route tests hang on a
      # runner that has no other chrome. No-op for members that do not use it.
      - name: Install playwright chromium (member browser tests)
        run: |
          bunx playwright install chromium --with-deps
          if ! command -v google-chrome >/dev/null 2>&1; then
            sudo apt-get update -qq && sudo apt-get install -y -qq google-chrome-stable
          fi
        working-directory: apps/browser

      # TURBO_SCM_BASE makes --affected real in both lanes. On pull_request the
      # base is the CURRENT base branch ref — not
      # github.event.pull_request.base.sha, which is a snapshot from PR-open
      # time and goes stale as the base branch moves. On push to main it is
      # HEAD^...HEAD, except on the ROOT commit where HEAD^ does not exist
      # (measured on the repo's first push: turbo died with "ambiguous
      # argument 'HEAD^'") — there the base falls back to HEAD, which diffs the
      # root commit against itself and correctly builds nothing.
      - name: Compute affected base
        id: affected
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "base=origin/${{ github.base_ref }}" >> "$GITHUB_OUTPUT"
          elif git rev-parse --verify -q HEAD^ >/dev/null; then
            echo "base=HEAD^" >> "$GITHUB_OUTPUT"
          else
            echo "base=HEAD" >> "$GITHUB_OUTPUT"
          fi

      - name: Build (affected)
        run: |
          bunx turbo run build --affected
          rc=$?
          if [ $rc -ne 0 ]; then
            echo "--- dirty-tree diagnostics (turbo rc=$rc; repos provenance gate refuses a dirty tree) ---"
            git status --porcelain --untracked-files=all | head -80
          fi
          exit $rc
        env:
          TURBO_SCM_BASE: ${{ steps.affected.outputs.base }}

      - name: Test (affected)
        # Serial execution: the runner (4 cores) kills test-spawned subprocesses
        # (null status / SIGTERM) when several spawn-heavy suites run in
        # parallel in the sweep. Measured on the skills import PR (5/5 fails on
        # the runner; 0 fails in a clean local replica), and again on
        # ci/test-suites PR #114 2026-08-14: the full 74-member sweep at
        # --concurrency=2 failed the test phase on a rotating spawn-heavy
        # member per run (mementos, automations, knowledge, shield — each
        # passes locally). --concurrency=1 runs every suite to completion,
        # serially; it slows the lane, it does not skip anything.
        run: bunx turbo run test --affected --concurrency=1
        env:
          TURBO_SCM_BASE: ${{ steps.affected.outputs.base }}
          ACCOUNTS_TEST_POSTGRES_URL: postgresql://postgres:postgres@127.0.0.1:5432/capacity_test?sslmode=disable

  # ---------------------------------------------------------------------------------
  publish-guard:
    name: publish guard (no internal-infra strings in tarballs)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install
        run: bun install --frozen-lockfile

      # The guard dry-runs `npm pack --json` per member and parses the real
      # entry list; prepack scripts interleave stdout with the JSON document,
      # so raw JSON.parse fails on chatty members and the guard must extract
      # the trailing JSON array instead — and FAIL (exit 1) on any parse
      # failure, never report an empty scan. Its two-sided self-test proves it
      # can fire on a seeded blocked entry, stays silent on a clean pack, and
      # fails loudly on a broken pack.
      - name: Publish-guard self-test
        run: bun tooling/ci/check-publish-guard.ts --self-test

      - name: Publish-guard (npm pack --dry-run + block internal-infra strings)
        run: bun tooling/ci/check-publish-guard.ts
