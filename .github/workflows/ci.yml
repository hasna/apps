# CI — the gate set for hasna/apps.
#
# Four independent gates plus a planner, four isolated shards and a required aggregate:
#
#   gates         — shared toolchain/dependency setup, then checks that can refuse a
#                   pull request in seconds: secret scan (with its own
#                   two-sided self-test), name-conformance, and the
#                   contract-manifest gate (contracts repo-conformance per
#                   member).
#   test-suites   — versioning + standard-adherence suites (hard gate).
#   affected-plan / affected-shard — immutable affected graph, four serial runners.
#   build-test    — required exact-union acceptance of terminal shard receipts.
#   verify-generated — byte-reproducibility of committed generated bundles.
#   publish-guard — internal-infra strings must never reach a published
#                   tarball. Real npm pack --dry-run per member; fails loudly
#                   when a pack cannot be parsed (never a vacuous pass).
#   client-gates  — fleet-alignment black-box gates over BUILT client bins
#                   (fail-closed probe, SQLite isolation); report-only at
#                   landing, flipped per gate in tests/standard/gate-mode.ts.
#
# The four other gates remain independent, so a red secret scan does not hide a red
# conformance run and the summary names which gate refused rather than "CI
# failed".
#
# INVERTED vs the platform: hasna-internal/platform CONSUMES @hasna/* and its
# fork gate forbids them in-tree. This repo PRODUCES public @hasna/* packages —
# the gates here are re-derived for a producer tree and must never be copied
# verbatim from the consumer repo.
name: ci

# npm 10's bundled pacote runs prepare despite --ignore-scripts. Provision
# the tested npm 11 toolchain in each ephemeral job before package work so
# nested artifact packs suppress every lifecycle hook. Bun stays pinned.
# Use a fresh runner-local prefix: the image's system manpage directories
# are not writable by the runner user. Verify the installed executable
# before adding only its bin directory to subsequent steps' PATH.

# Least privilege: nothing in this workflow needs write access to the
# repository. Every job is read-only over the checkout (the token is still
# available for authenticated reads of private deps if that ever becomes
# necessary, but no job may create releases, comments, or statuses).
permissions:
  contents: read

on:
  pull_request:
  push:
    branches: [main]

jobs:
  # ---------------------------------------------------------------------------------
  gates:
    name: gates (secrets, names, manifests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0 # the secret scan diffs against a merge base; a shallow clone has none

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14 # in lockstep with package.json "packageManager"

      - name: Install npm for artifact gates
        run: |
          set -euo pipefail
          npm_prefix="$(mktemp -d "${RUNNER_TEMP}/npm-toolchain.XXXXXX")"
          npm install --global --prefix "$npm_prefix" npm@11.19.0 --ignore-scripts
          test "$("$npm_prefix/bin/npm" --version)" = "11.19.0"
          echo "$npm_prefix/bin" >> "$GITHUB_PATH"

      # bun install runs workspace member prepare scripts CONCURRENTLY with no
      # topological ordering (measured on bun 1.3.14, 2026-08-21), so
      # @hasna/machines' prepare-time tsc read @hasna/contracts/dist while
      # contracts' own prepare was mid-rebuild and failed with TS7016 — root CI
      # red 5/5 (todos 3b2a7f1e). The edge bun's install runner cannot express
      # is declared in the root `prepare:ordered` chain (deterministic
      # topological order, @hasna/contracts first); the build phase runs through
      # it, and member scripts (prepare/postinstall) are skipped here. The
      # install-order standard-adherence test keeps chain and CI in lockstep.
      - name: Install
        run: |
          bun install --frozen-lockfile --ignore-scripts
          bun run prepare:ordered

      # The scan runs its OWN two-sided self-test first and fails if the patterns
      # cannot fire — a scanner whose regexes are broken reports a clean tree, and
      # a clean tree is exactly what success looks like. It prints file, line and
      # pattern NAME, never a matched value: a scanner that echoes what it found
      # writes the credential into the CI log, which is the leak it exists to
      # prevent.
      - name: Secret scan self-test (prove it can fire AND stay silent)
        run: bun tooling/ci/check-secrets.ts --self-test

      # Push lane: github.event.before is the PREVIOUS push head, so a
      # multi-commit push scans every commit it carries — HEAD^ would scan only
      # the tip and silently under-scan the rest. On the very first push
      # event.before is all zeros and there is no earlier state to diff: fall
      # back to HEAD^ (and on a root commit with no HEAD^ the scanner exits 2
      # — could-not-scan — rather than passing vacuously).
      - name: Secret scan (added lines in the diff)
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            bun tooling/ci/check-secrets.ts --base "origin/${{ github.base_ref }}"
          else
            BASE="${{ github.event.before }}"
            ZEROES="0000000000000000000000000000000000000000"
            if [ -z "$BASE" ] || [ "$BASE" = "$ZEROES" ]; then
              BASE="HEAD^"
            fi
            bun tooling/ci/check-secrets.ts --base "$BASE"
          fi

      # Commit-trailer gate (repo law 6): every non-merge commit the PR/push
      # carries ends with `Agent: <registered-name>` and none carries a
      # `Co-Authored-By` line. Nothing enforced this before 2026-09-11 (W9
      # audit) and a wave of PRs picked up the forbidden trailer. Same base
      # resolution as the secret scan; exit 2 (could-not-scan) when the range
      # cannot be resolved, never a vacuous pass. REPORT-ONLY at landing
      # (`--report`): drop the flag to refuse.
      - name: Commit-trailer gate self-test
        run: bun tooling/ci/check-commit-trailers.ts --self-test

      - name: "Commit-trailer gate (Agent trailer present, no Co-Authored-By; report-only)"
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            bun tooling/ci/check-commit-trailers.ts --base "origin/${{ github.base_ref }}" --report
          else
            BASE="${{ github.event.before }}"
            ZEROES="0000000000000000000000000000000000000000"
            if [ -z "$BASE" ] || [ "$BASE" = "$ZEROES" ]; then
              BASE="HEAD^"
            fi
            bun tooling/ci/check-commit-trailers.ts --base "$BASE" --report
          fi

      # Name-conformance: every workspace member package.json name matches
      # @hasna/<kebab-case> and equals its directory. Self-test runs first and
      # separately, because a predicate that cannot fire reports a clean corpus,
      # and a clean corpus is what success looks like.
      - name: Name-conformance gate self-test
        run: bun tooling/ci/check-names.ts --self-test

      - name: Name-conformance gate (@hasna/* only, name == directory)
        run: bun tooling/ci/check-names.ts

      # Dependency-direction gate: no member may DECLARE a dependency on the
      # private @hasna-internal/* scope (or any other private scope). The
      # pack-time publish-guard refuses a private-scope string inside a packed
      # tarball, but only after a prepare/build and only on the packed
      # artifact; this source-level gate refuses the DECLARATION directly in
      # the tree, so a private-scope dependency cannot arrive unseen at first
      # commit. Self-test runs first and separately, because a predicate that
      # cannot fire reports a clean corpus, and a clean corpus is what success
      # looks like. (todos H5-00003)
      - name: Dependency-direction gate self-test
        run: bun tooling/ci/check-dependency-direction.ts --self-test

      - name: Dependency-direction gate (no private-scope dependencies)
        run: bun tooling/ci/check-dependency-direction.ts

      # Contract-manifest gate: runs `contracts repo-conformance` per
      # publishable member (same validator, resolution and exception registry
      # as the standard-adherence suite) and refuses unrecorded violations.
      # Its own two-sided self-test runs first and separately: a gate whose
      # validator cannot fire reports a clean tree, and a clean tree is what
      # success looks like.
      - name: Contract-manifest gate self-test
        run: bun tooling/ci/check-manifests.ts --self-test

      - name: Contract-manifest gate (repo-conformance per member)
        run: bun tooling/ci/check-manifests.ts

      # Deploy-lane gate: member deploy workflows must live at the DISCOVERABLE
      # repo root (GitHub Actions only reads .github/workflows/ at the root),
      # must be push-scoped to apps/<member>/** (a monorepo push to another
      # member must not fire another member's deploy), and ported lanes must
      # keep their root workflow present. Self-test runs first and separately:
      # a gate whose patterns cannot fire reports a clean tree, and a clean
      # tree is what success looks like. (todos 9b1828c9)
      - name: Deploy-lane gate self-test
        run: bun tooling/ci/check-deploy-lanes.ts --self-test

      - name: Deploy-lane gate (discoverable root, path-scoped, single-sourced)
        run: bun tooling/ci/check-deploy-lanes.ts

      # Frozen-lockfile gate: the version wave (hasna/apps#717) and later
      # release commits bumped manifests WITHOUT regenerating the per-app and
      # root lockfiles, breaking every Docker deploy lane with "lockfile had
      # changes, but lockfile is frozen" and leaving the root lockfile stale.
      # bun's own frozen check does not flag workspace-package version/dep
      # drift (measured on bun 1.2/1.3.14/1.4.0), so this gate compares the
      # lockfiles against the manifests structurally. Self-test first: a gate
      # whose patterns cannot fire reports a clean tree, and a clean tree is
      # what success looks like.
      - name: Frozen-lockfile gate self-test
        run: bun tooling/ci/check-frozen-locks.ts --self-test

      - name: Frozen-lockfile gate (root + per-app lockfiles match manifests)
        run: bun tooling/ci/check-frozen-locks.ts

      # Nested-package gate (one package per app, rules/package-surfaces.md):
      # no package.json below a member root may declare a publishable
      # @hasna/* name — the split `-sdk` shape (apps/connectors/sdk,
      # apps/todos/sdk, apps/todos/ai measured 2026-09-11). REPORT-ONLY at
      # landing: drop `--report` once the measured splits are folded. Rule and
      # measurement shared with tooling/ci/tests/standard/nested-packages.test.ts.
      - name: Nested-package gate self-test
        run: bun tooling/ci/check-nested-packages.ts --self-test

      - name: Nested-package gate (no nested publishable @hasna/* package; report-only)
        run: bun tooling/ci/check-nested-packages.ts --report

  # ---------------------------------------------------------------------------------
  # test-suites: the versioning + standard-adherence suites, wired as a HARD gate.
  #   test:versioning — hermetic versioning-integrity suite (test/versioning): package
  #       identity/semver, pending changesets, version-without-changeset, workspace
  #       reference rewrites, changelog/runtime metadata, Bun quarantine coverage. The
  #       npm-parity lane is opt-in (VERSIONING_NPM_PARITY=1) and reads the public
  #       registry; CI runs the offline default, which skips it explicitly
  #       ([SKIP versioning] marker) instead of failing without network.
  #   test:standard — standard-adherence suite (tooling/ci/tests/standard): contracts
  #       conformance, publishConfig, four-surface, license, dist hygiene, each with a
  #       two-sided self-test and a measured exception registry.
  # Both suites intentionally FAIL on violations — that is the point of the job. There
  # is deliberately NO continue-on-error here; a red suite is a red PR.
  test-suites:
    name: test-suites (versioning + standard-adherence)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0 # the versioning suite diffs package versions against a base ref

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14 # in lockstep with package.json "packageManager"

      - name: Install npm for artifact gates
        run: |
          set -euo pipefail
          npm_prefix="$(mktemp -d "${RUNNER_TEMP}/npm-toolchain.XXXXXX")"
          npm install --global --prefix "$npm_prefix" npm@11.19.0 --ignore-scripts
          test "$("$npm_prefix/bin/npm" --version)" = "11.19.0"
          echo "$npm_prefix/bin" >> "$GITHUB_PATH"

      - name: Install
        run: |
          bun install --frozen-lockfile --ignore-scripts
          bun run prepare:ordered

      - name: Versioning integrity suite (offline default)
        run: bun run test:versioning

      - name: Standard-adherence suite
        run: bun run test:standard

  # ---------------------------------------------------------------------------------
  affected-plan:
    name: plan affected build and test tasks
    runs-on: ubuntu-latest
    env:
      NODE_OPTIONS: --max-old-space-size=14336
    outputs:
      head: ${{ steps.plan.outputs.head }}
      base: ${{ steps.plan.outputs.base }}
      plan-sha256: ${{ steps.plan.outputs.plan-sha256 }}
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - name: Install npm for artifact gates
        run: |
          set -euo pipefail
          npm_prefix="$(mktemp -d "${RUNNER_TEMP}/npm-toolchain.XXXXXX")"
          npm install --global --prefix "$npm_prefix" npm@11.19.0 --ignore-scripts
          test "$("$npm_prefix/bin/npm" --version)" = "11.19.0"
          echo "$npm_prefix/bin" >> "$GITHUB_PATH"
      - name: Install
        run: |
          bun install --frozen-lockfile --ignore-scripts
          bun run prepare:ordered
      # Preserve existing semantics: current origin/base branch for PRs;
      # HEAD^ for pushes, HEAD itself for a root commit. Resolve it only here.
      - name: Freeze affected task plan
        id: plan
        run: bun tooling/ci/run-affected-shards.ts plan "$RUNNER_TEMP/affected-plan"
      - name: Retain immutable affected plan
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: affected-plan-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/affected-plan/*.json
          if-no-files-found: error
          retention-days: 7

  affected-shard:
    name: affected test shard ${{ matrix.shard }}
    needs: affected-plan
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: ${{ fromJSON(needs.affected-plan.outputs.matrix) }}
    env:
      # Separate 16GB runners; never parallelize the 8-14GB builds or
      # spawn-heavy package suites inside one runner. Existing suite flags stay.
      NODE_OPTIONS: --max-old-space-size=14336
      AFFECTED_PLAN_SHA256: ${{ needs.affected-plan.outputs.plan-sha256 }}
      AFFECTED_SHARD: ${{ matrix.shard }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ needs.affected-plan.outputs.head }}
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - name: Install npm for artifact gates
        run: |
          set -euo pipefail
          npm_prefix="$(mktemp -d "${RUNNER_TEMP}/npm-toolchain.XXXXXX")"
          npm install --global --prefix "$npm_prefix" npm@11.19.0 --ignore-scripts
          test "$("$npm_prefix/bin/npm" --version)" = "11.19.0"
          echo "$npm_prefix/bin" >> "$GITHUB_PATH"
      - name: Install
        run: |
          bun install --frozen-lockfile --ignore-scripts
          bun run prepare:ordered
      - name: Download immutable affected plan
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: affected-plan-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/affected-plan
      - name: Execute serial affected shard
        run: bun tooling/ci/run-affected-shards.ts shard "$RUNNER_TEMP/affected-plan/plan.json" "$AFFECTED_PLAN_SHA256" "$AFFECTED_SHARD" "$RUNNER_TEMP/affected-shard"
      - name: Retain shard terminal evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: affected-shard-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.shard }}
          path: ${{ runner.temp }}/affected-shard/*.json
          if-no-files-found: error
          retention-days: 7
      - name: Retain Recordings release diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: recordings-release-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.shard }}
          path: |
            /tmp/recordings-release-gate-*/*.log
            /tmp/recordings-release-gate-*/*.xml
          if-no-files-found: ignore
          retention-days: 7

  build-test:
    # Keep this required check name; acceptance is now the exact union of four
    # successful terminal receipts, not a matrix result or a skipped job alone.
    name: build + test (affected)
    if: ${{ always() }}
    needs: [affected-plan, affected-shard]
    runs-on: ubuntu-latest
    env:
      AFFECTED_PLAN_SHA256: ${{ needs.affected-plan.outputs.plan-sha256 }}
      AFFECTED_MATRIX_RESULT: ${{ needs.affected-shard.result }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      # The aggregator imports only Bun/Node builtins and does not run packages.
      - name: Download immutable affected plan
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: affected-plan-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/affected-plan
      - name: Download all terminal shard evidence
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: affected-shard-${{ github.run_id }}-${{ github.run_attempt }}-*
          path: ${{ runner.temp }}/affected-receipts
      - name: Verify complete disjoint task execution
        if: ${{ always() }}
        run: bun tooling/ci/run-affected-shards.ts aggregate "$RUNNER_TEMP/affected-plan/plan.json" "$AFFECTED_PLAN_SHA256" "$RUNNER_TEMP/affected-receipts" "$AFFECTED_MATRIX_RESULT" "$RUNNER_TEMP/affected-aggregate.json"
      - name: Retain aggregate acceptance
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: affected-aggregate-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/affected-aggregate.json
          if-no-files-found: error
          retention-days: 7

  # ---------------------------------------------------------------------------------
  # client-gates: the fleet-alignment black-box gates that need BUILT client
  # bins (tooling/ci/tests/client-gates). Every hosted member is built first
  # (sequentially — see build-hosted-members.ts), then:
  #   client-fail-closed      — `HASNA_STATION=no-such-station HOME=$(mktemp -d)
  #                             <bin> <read>` must exit non-zero and create no
  #                             *.db under HOME (ruling d, PLAN §6 acceptance);
  #   client-sqlite-isolation — the `<name>` and `<name>-mcp` bundles carry no
  #                             bun:sqlite / better-sqlite3 / node:sqlite.
  # Both land REPORT-ONLY (tooling/ci/tests/standard/gate-mode.ts GATE_MODES);
  # HASNA_CLIENT_GATES_REQUIRE_BUILT=1 makes an unbuilt bin a violation here so
  # the job can never pass by not building. The source-only fleet-alignment
  # gates (fleet-hostnames, no-mode-vocabulary, nested-packages,
  # registry-hygiene, commit-trailers self-test) run in test-suites.
  client-gates:
    name: client gates (fail-closed + sqlite isolation; report-only)
    runs-on: ubuntu-latest
    env:
      NODE_OPTIONS: --max-old-space-size=14336
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14 # in lockstep with package.json "packageManager"

      - name: Install npm for artifact gates
        run: |
          set -euo pipefail
          npm_prefix="$(mktemp -d "${RUNNER_TEMP}/npm-toolchain.XXXXXX")"
          npm install --global --prefix "$npm_prefix" npm@11.19.0 --ignore-scripts
          test "$("$npm_prefix/bin/npm" --version)" = "11.19.0"
          echo "$npm_prefix/bin" >> "$GITHUB_PATH"

      - name: Install
        run: |
          bun install --frozen-lockfile --ignore-scripts
          bun run prepare:ordered

      - name: Build every hosted member (sequential)
        run: bun tooling/ci/build-hosted-members.ts

      - name: Client gates (fail-closed black box + SQLite isolation)
        env:
          HASNA_CLIENT_GATES_REQUIRE_BUILT: "1"
        run: bun run test:client-gates

  # ---------------------------------------------------------------------------------
  # verify-generated: the committed byte-reproducibility gate, one step per
  # member that commits build output. apps/knowledge commits its build output
  # (bin/, dist/ — GENERATED_PATHS in
  # apps/knowledge/scripts/verify-generated-artifacts.mjs) and the gate rebuilds it,
  # then requires `git diff --exit-code -- bin dist` to be empty. apps/events commits
  # dist/ (13 files, plus types/) and ships `generated-artifacts:check`, which rebuilds
  # and requires a clean `git status --porcelain` over dist/ and types/. apps/contracts
  # commits generated/deployment/v1/ and generated/todos/v1/ (shipped via the package's
  # `files` as public export subpaths) and ships `deployment:check` + `todos:check`,
  # which render the artifacts from src and byte-compare against the committed files —
  # the stale-artifact failure of #1775 that reddened every root-file PR until the
  # regeneration landed in #1744. A PR whose committed bundles drift from what the
  # current source builds is refused here. That
  # is the dirty-tree class that broke the merge train and was fixed by #110
  # (regenerated bundles under bun 1.3.14); it regresses silently whenever someone
  # regenerates artifacts and forgets to commit them, or rebuilds under a different
  # bun — so it must be a gate, not a convention.
  #
  # A member that commits generated bundles MUST add its own step here, sharing this
  # job's bun-version pin — a committed bundle no job regenerates is drift by
  # construction.
  #
  # Deliberately NOT routed through turbo: the turbo task cache is keyed on inputs and
  # would replay a cached success instead of running the rebuild, making the byte
  # comparison vacuous. This job runs the member's verify:generated script directly.
  #
  # The bun-version pin is LOAD-BEARING: the byte comparison is bun-version-sensitive
  # (bun 1.3.13 vs 1.3.14 differ by empty `else {}` dead-code elimination), so this
  # must stay equal to the version that built the committed bundles — see the note at
  # the top of apps/knowledge/.github/workflows/ci.yml. Bumping or lowering it without
  # rebuilding bin/ and dist/ in the same commit turns this gate red.
  verify-generated:
    name: verify generated artifacts (byte-reproducible)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14 # LOAD-BEARING — see the note above and in apps/knowledge ci.yml

      - name: Install npm for artifact gates
        run: |
          set -euo pipefail
          npm_prefix="$(mktemp -d "${RUNNER_TEMP}/npm-toolchain.XXXXXX")"
          npm install --global --prefix "$npm_prefix" npm@11.19.0 --ignore-scripts
          test "$("$npm_prefix/bin/npm" --version)" = "11.19.0"
          echo "$npm_prefix/bin" >> "$GITHUB_PATH"

      - name: Install
        run: |
          bun install --frozen-lockfile --ignore-scripts
          bun run prepare:ordered

      - name: Verify generated artifacts (knowledge — rebuild + byte-compare bin/ dist/)
        run: bun run verify:generated
        working-directory: apps/knowledge

      - name: Verify generated artifacts (events — rebuild + byte-compare dist/ types/)
        run: bun run generated-artifacts:check
        working-directory: apps/events

      - name: Verify generated artifacts (contracts — render + byte-compare generated/)
        run: bun run deployment:check && bun run todos:check
        working-directory: apps/contracts

  # ---------------------------------------------------------------------------------
  publish-guard:
    name: publish guard (no internal-infra strings in tarballs)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0 # the scoped guard diffs against the PR base / previous push head
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14

      - name: Install npm for artifact gates
        run: |
          set -euo pipefail
          npm_prefix="$(mktemp -d "${RUNNER_TEMP}/npm-toolchain.XXXXXX")"
          npm install --global --prefix "$npm_prefix" npm@11.19.0 --ignore-scripts
          test "$("$npm_prefix/bin/npm" --version)" = "11.19.0"
          echo "$npm_prefix/bin" >> "$GITHUB_PATH"

      - name: Install
        run: |
          bun install --frozen-lockfile --ignore-scripts
          bun run prepare:ordered
          # todos carries no lifecycle scripts (the release gate forbids them:
          # the pack that reaches the registry must equal the verified pack), so
          # it is not a prepare:ordered member — build its dist explicitly so
          # the guard's npm pack --dry-run scans the real payload.
          bun run --filter @hasna/todos build

      # The guard dry-runs `npm pack --json` per member and parses the real
      # entry list; prepack scripts interleave stdout with the JSON document,
      # so raw JSON.parse fails on chatty members and the guard must extract
      # the trailing JSON array instead — and FAIL (exit 1) on any parse
      # failure, never report an empty scan. Its two-sided self-test proves it
      # can fire on a seeded blocked entry, stays silent on a clean pack, and
      # fails loudly on a broken pack.
      - name: Publish-guard self-test
        run: bun tooling/ci/check-publish-guard.ts --self-test

      # SCOPED to the members whose tarball can differ from the base (their
      # apps/<m>/** changed, or an in-tree member they bundle changed); EVERY
      # member when a shared tarball input changed (root package.json, bun.lock,
      # turbo.json, tsconfig.base.json, tooling/, this file) or when the base
      # cannot be resolved. One member's pack-time flake no longer reddens this
      # required check for unrelated packages (fb59fb6a, 2026-09-11). Same base
      # resolution as the secret scan.
      - name: Publish-guard (npm pack --dry-run + block internal-infra strings; scoped to members changed vs base)
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            bun tooling/ci/check-publish-guard.ts --changed-since "origin/${{ github.base_ref }}"
          else
            BASE="${{ github.event.before }}"
            ZEROES="0000000000000000000000000000000000000000"
            if [ -z "$BASE" ] || [ "$BASE" = "$ZEROES" ]; then
              BASE="HEAD^"
            fi
            bun tooling/ci/check-publish-guard.ts --changed-since "$BASE"
          fi
