name: mementos live PostgreSQL

on:
  pull_request:
    paths:
      - 'apps/mementos/**'
      - 'apps/contracts/**'
      - 'bun.lock'
      - '.github/workflows/mementos-live-postgres.yml'
  push:
    branches: [main]
    paths:
      - 'apps/mementos/**'
      - 'apps/contracts/**'
      - 'bun.lock'
      - '.github/workflows/mementos-live-postgres.yml'

permissions:
  contents: read

jobs:
  mementos-live-postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: mementos_test
          POSTGRES_DB: mementos_test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 127.0.0.1:5432:5432
        options: >-
          --health-cmd "pg_isready -U mementos_test -d mementos_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14
      - name: Install frozen dependencies without lifecycle scripts
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Prove missing PostgreSQL configuration refuses
        working-directory: apps/mementos
        run: |
          set -euo pipefail
          set +e
          env -u MEMENTOS_TEST_DATABASE_URL bun run test:pg > "$RUNNER_TEMP/mementos-pg-negative.log" 2>&1
          result=$?
          set -e
          if [ "$result" -eq 0 ]; then
            echo "Missing-database control unexpectedly passed"
            exit 1
          fi
          grep -Fq 'MEMENTOS_TEST_DATABASE_URL is not set' "$RUNNER_TEMP/mementos-pg-negative.log"
      - name: Exercise schema, machine concurrency, and storage contracts
        working-directory: apps/mementos
        env:
          MEMENTOS_TEST_DATABASE_URL: postgres://mementos_test@127.0.0.1:5432/mementos_test
        run: |
          set -euo pipefail
          bun -e 'const u = new URL(process.env.MEMENTOS_TEST_DATABASE_URL); if (u.protocol !== "postgres:" || u.hostname !== "127.0.0.1" || u.port !== "5432" || u.pathname !== "/mementos_test" || u.username !== "mementos_test" || u.password || u.search || u.hash) throw new Error("Refusing a non-isolated integration database");'
          bun run test:pg > "$RUNNER_TEMP/mementos-live-postgres.log" 2>&1
          grep -Fq '[pg-test-gate] PASS: 10 live PostgreSQL checks' "$RUNNER_TEMP/mementos-live-postgres.log"
          echo "Mementos live PostgreSQL gate passed all ten checks"
