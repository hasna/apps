# recordings macOS native gate — root-discoverable (apps-ship-macos-app, todos 1a2ba6ad)
#
# WHY THIS FILE EXISTS AT THE REPO ROOT: GitHub Actions discovers workflows ONLY
# at `.github/workflows/` of the repo root. The recordings native (Swift/C) job
# previously lived in `apps/recordings/.github/workflows/ci.yml` — a NESTED path
# GitHub never reads, i.e. a silent dead lane of exactly the class the
# deploy-lane gate documents (todos 9b1828c9). Measured 2026-08-20 via the
# workflows API: hasna/apps had six root workflows and none under
# apps/recordings, so the Swift half compiled NOWHERE and a merged main produced
# no installable HasnaRecordings.app. The stale-sweep on row 1a2ba6ad named this
# "the CI build-and-sign path".
#
# This workflow ports the native compile gate so a merged main PROVABLY
# compiles the Swift half. It does NOT run build.sh: local-only artifacts are
# bound to an authenticated Tailscale builder and target identity, release
# artifacts need Developer ID signing material (todos 63ce6ecc, separate row),
# and the runtime smoke is TCC-gated with no grantable state on a headless
# runner — so the assembly-and-ship leg remains the fleet-Mac ship lane's work.
#
# READ BEFORE TRUSTING A GREEN TICK. The `native` job compiles every Swift and
# native-test target (empty known-errors baseline = plain build gate), then
# requires `swift test` to pass. Swift Testing handles intentional known issues
# and opt-in skips; unexpected failures fail this job. Real microphone, paste
# and Accessibility acceptance still belongs to the unlocked fleet-Mac lane.
name: recordings-macos

on:
  pull_request:
    paths:
      - apps/recordings/**
      - .github/workflows/recordings-macos.yml
  push:
    branches: [main]
    paths:
      - apps/recordings/**
      - .github/workflows/recordings-macos.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  native:
    name: Native (macOS — Swift/C compile)
    runs-on: macos-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: apps/recordings
    outputs:
      # Build evidence remains separate from the native test step's outcome.
      compiled: ${{ steps.compile.outputs.compiled }}
      blocked: ${{ steps.compile.outputs.blocked }}
      gatedTargets: ${{ steps.compile.outputs.gatedTargets }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Record the toolchain
        # Printed before anything is built, because the failure this package will
        # actually hit is a runner image whose Swift predates the 6.2 the package
        # demands, and that surfaces as a confusing parse error in Package.swift
        # rather than as a version complaint.
        run: |
          {
            echo '### macOS runner toolchain'
            echo
            echo '```'
            sw_vers
            swift --version 2>&1
            xcodebuild -version 2>&1 || true
            ls -d /Applications/Xcode*.app 2>/dev/null || true
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: The runner satisfies the toolchain the package declares
        # Derived from Package.swift rather than hardcoded, so bumping
        # swift-tools-version cannot leave this check silently asserting an older
        # floor than the package requires.
        shell: bash
        run: |
          required="$(sed -n 's|^// *swift-tools-version: *\([0-9][0-9.]*\).*|\1|p' src/native/Recordings/Package.swift | head -1)"
          [ -n "$required" ] || { echo "::error::Could not read swift-tools-version from Package.swift"; exit 1; }
          actual="$(swift --version 2>&1 | sed -n 's/.*Swift version \([0-9][0-9.]*\).*/\1/p' | head -1)"
          [ -n "$actual" ] || { echo "::error::Could not read a Swift version from this runner"; exit 1; }
          echo "package requires swift-tools-version $required; runner has Swift $actual"
          lowest="$(printf '%s\n%s\n' "$required" "$actual" | sort -V | head -1)"
          if [ "$lowest" != "$required" ]; then
            echo "::error title=Swift toolchain too old::Runner Swift $actual cannot build a package requiring $required. The native half is NOT verified by this run."
            exit 1
          fi

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14

      - name: Resolve the Swift dependencies
        run: swift package resolve --package-path src/native/Recordings

      - name: The Swift dependency pins are unchanged by resolving them
        # Package.resolved is committed and both dependencies are pinned exactly.
        # A diff here means resolution moved off a pin.
        run: git diff --exit-code -- src/native/Recordings/Package.resolved

      - name: Compile every native and native-test target
        id: compile
        # Compiles all products AND all test targets, then compares the compiler's
        # error SET against .github/native-known-errors.txt. That file is EMPTY,
        # so this is now a plain build gate: any compile error at all fails the
        # step. The set-comparison machinery fails when a recorded error starts
        # building cleanly, which is what forces the baseline to stay empty.
        run: bun run verify:ci-native

      - name: Run the native test suites
        # Run the whole suite after compilation. Preserve Swift's exit status
        # through tee and watcher cleanup; expected issues/skips are classified
        # by Swift Testing, never by treating all failures as headless limitations.
        id: native_tests
        if: steps.compile.outputs.compiled == 'true'
        timeout-minutes: 12
        shell: bash
        run: |
          set -o pipefail
          diagnostics="$(mktemp -d "$RUNNER_TEMP/recordings-native-stall.XXXXXX")"
          diagnostics="$(cd "$diagnostics" && pwd -P)"
          echo "diagnostics=$diagnostics" >> "$GITHUB_OUTPUT"
          /usr/bin/python3 -I -B ../../tooling/ci/watch-recordings-native-stall.py \
            --shell-pid "$$" --package-path src/native/Recordings \
            --log "$PWD/swift-test.log" --output "$diagnostics" &
          watcher=$!
          finish_watcher() {
            test_status=$?
            # Cooperatively stop/reap our watcher; never signal a test process.
            : > "$diagnostics/stop"
            wait "$watcher" || true
            exit "$test_status"
          }
          trap finish_watcher EXIT
          # Darwin libc: flush stdout at newlines so SwiftPM cannot hide the final
          # partial buffer if tests stall. This does not resolve a test timeout.
          STDBUF1=L swift test --package-path src/native/Recordings 2>&1 | tee swift-test.log

      - name: What the native test run actually established
        if: always() && steps.compile.outputs.compiled == 'true'
        shell: bash
        env:
          OUTCOME: ${{ steps.native_tests.outcome }}
        run: |
          summary="$(grep -m1 'Test run with' swift-test.log 2>/dev/null || true)"
          completed="$(grep -c 'passed after' swift-test.log 2>/dev/null || true)"
          if [ -n "$summary" ] && [ "$OUTCOME" = 'success' ]; then
            echo "::notice title=Native tests completed and passed::$summary  Native tests passed on this runner. Real microphone and paste acceptance remain separate."
          elif [ -n "$summary" ]; then
            echo "::error title=Native tests ran and did NOT pass::$summary  The native test gate failed. See the swift-test.log artifact."
          else
            echo "::error title=Native tests did NOT finish::swift test produced no run summary (step outcome: $OUTCOME); ${completed:-0} completion lines were recorded. Native runtime behaviour is unverified. See the swift-test.log artifact."
          fi

      - name: Native test suites were not attempted
        if: always() && steps.compile.outputs.compiled != 'true'
        run: |
          echo "::warning title=Native tests NOT run::The package did not compile, so swift test was not attempted. Nothing about native RUNTIME behaviour is verified by this run."

      - name: Preserve native build logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: recordings-native-build-logs-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            apps/recordings/swift-test.log
            ${{ steps.native_tests.outputs.diagnostics }}/sample.txt
            ${{ steps.native_tests.outputs.diagnostics }}/status.json
          if-no-files-found: ignore
          retention-days: 14
