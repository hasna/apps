name: Calendar tenant PostgreSQL

on:
  pull_request:
    paths:
      - 'apps/calendar/**'
      - 'apps/contracts/**'
      - 'bun.lock'
      - '.github/workflows/calendar-tenant-postgres.yml'
  push:
    branches: [main]
    paths:
      - 'apps/calendar/**'
      - 'apps/contracts/**'
      - 'bun.lock'
      - '.github/workflows/calendar-tenant-postgres.yml'

permissions:
  contents: read

jobs:
  calendar-tenant-postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: calendar_test
          POSTGRES_DB: calendar_test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U calendar_test -d calendar_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14
      - name: Install frozen dependencies without lifecycle scripts
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Prove tenant isolation against disposable PostgreSQL
        working-directory: apps/calendar
        env:
          CALENDAR_TENANT_TEST_DATABASE_URL: postgres://calendar_test@127.0.0.1:5432/calendar_test
        run: |
          bun -e 'const u = new URL(process.env.CALENDAR_TENANT_TEST_DATABASE_URL); if (u.protocol !== "postgres:" || u.hostname !== "127.0.0.1" || u.port !== "5432" || u.pathname !== "/calendar_test" || u.username !== "calendar_test" || u.password || u.search || u.hash) throw new Error("Refusing a non-isolated integration database");'
          bun test src/server/tenant-boundary.pg.test.ts > "$RUNNER_TEMP/calendar-tenant-postgres.log" 2>&1
          cat "$RUNNER_TEMP/calendar-tenant-postgres.log"
          grep -Fq '7 pass' "$RUNNER_TEMP/calendar-tenant-postgres.log"
          grep -Fq '0 fail' "$RUNNER_TEMP/calendar-tenant-postgres.log"
          if grep -Eq '\(skip\)|[1-9][0-9]* skip' "$RUNNER_TEMP/calendar-tenant-postgres.log"; then exit 1; fi
