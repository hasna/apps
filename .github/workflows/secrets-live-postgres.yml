name: secrets live PostgreSQL

on:
  pull_request:
    paths:
      - 'apps/secrets/**'
      - 'apps/contracts/**'
      - 'bun.lock'
      - '.github/workflows/secrets-live-postgres.yml'
  push:
    branches: [main]
    paths:
      - 'apps/secrets/**'
      - 'apps/contracts/**'
      - 'bun.lock'
      - '.github/workflows/secrets-live-postgres.yml'

permissions:
  contents: read

jobs:
  secrets-live-postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: secrets_test
          POSTGRES_DB: secrets_test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U secrets_test -d secrets_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14
      - name: Install frozen dependencies without lifecycle scripts
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Verify the fail-closed PostgreSQL gate
        working-directory: apps/secrets
        run: bun --no-env-file test scripts/live-postgres-test.test.ts
      - name: Exercise every required PostgreSQL suite without skips
        working-directory: apps/secrets
        env:
          SECRETS_TEST_DATABASE_URL: postgres://secrets_test@127.0.0.1:5432/secrets_test
        run: bun run test:postgres
